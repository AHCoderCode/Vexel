<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ================================================================
       🚀  FUTURISTIC MODERN UI – VEXEL AI
       ================================================================ */
    :root {
      --bg-primary: #0b0c15;
      --bg-secondary: #151725;
      --bg-tertiary: #1e2133;
      --text-primary: #eaeef5;
      --text-secondary: #b4bcd0;
      --text-muted: #6b728a;
      --accent: #7c5cfc;
      --accent-hover: #9b7efc;
      --border: #2a2e42;
      --msg-user-bg: #2a2050;
      --msg-user-border: #453b7a;
      --msg-assistant-bg: #151725;
      --msg-assistant-border: #2a2e42;
      --header-bg: #11131e;
      --input-bg: #151725;
      --input-border: #2a2e42;
      --sidebar-bg: #0d0f1a;
      --sidebar-hover: #1e2133;
      --scrollbar-thumb: #2a2e42;
      --glow: 0 0 15px rgba(124, 92, 252, 0.3);
    }

    body.light-mode {
      --bg-primary: #f0f2f8;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e4e7f0;
      --text-primary: #12142a;
      --text-secondary: #3a3d52;
      --text-muted: #6e7180;
      --accent: #6c5ce7;
      --accent-hover: #8a7ef0;
      --border: #d4d7e3;
      --msg-user-bg: #e8e5ff;
      --msg-user-border: #c4bef5;
      --msg-assistant-bg: #f8f9fc;
      --msg-assistant-border: #d4d7e3;
      --header-bg: #ffffff;
      --input-bg: #ffffff;
      --input-border: #d4d7e3;
      --sidebar-bg: #f5f6fa;
      --sidebar-hover: #e4e7f0;
      --scrollbar-thumb: #c4c7d4;
      --glow: 0 0 12px rgba(108, 92, 231, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 30;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 4px 0 30px rgba(0,0,0,0.4);
    }
    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      height: 100%;
    }
    .sidebar-header {
      padding: 1.5rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c5cfc, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .new-chat-btn {
      background: var(--accent);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: var(--glow);
    }
    .new-chat-btn:hover { background: var(--accent-hover); transform: scale(1.05); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .chat-list-item {
      padding: 0.8rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, color 0.2s;
      gap: 0.5rem;
    }
    .chat-list-item:hover { background: var(--sidebar-hover); }
    .chat-list-item.active { background: var(--bg-tertiary); color: var(--text-primary); font-weight: 500; border: 1px solid var(--accent); }
    .chat-list-item .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .chat-list-item .delete-chat {
      background: rgba(255, 70, 70, 0.15);
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: all 0.2s;
      opacity: 0.9; /* Always visible */
    }
    .chat-list-item .delete-chat:hover { background: #ff4444; color: white; }

    /* Main chat area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }
    .header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .menu-toggle:hover { background: var(--bg-tertiary); }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #7c5cfc, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions button {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      backdrop-filter: blur(5px);
    }
    .header-actions button:hover { background: var(--accent); border-color: var(--accent); color: white; box-shadow: var(--glow); }
    .theme-btn { font-size: 1.2rem; padding: 0.4rem 0.8rem; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: var(--bg-primary);
      scroll-behavior: smooth;
    }
    .message {
      max-width: 75%;
      padding: 1rem 1.5rem;
      border-radius: 20px;
      line-height: 1.6;
      word-wrap: break-word;
      font-size: 0.95rem;
      animation: fadeInUp 0.3s ease;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .message.user {
      align-self: flex-end;
      background: var(--msg-user-bg);
      color: white;
      border-bottom-right-radius: 6px;
      border: 1px solid var(--msg-user-border);
      background: linear-gradient(135deg, #4b3b8c, #2a2050);
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--msg-assistant-bg);
      color: var(--text-primary);
      border-bottom-left-radius: 6px;
      border: 1px solid var(--msg-assistant-border);
    }
    .message img.chat-img { max-width: 100%; border-radius: 10px; margin-bottom: 0.5rem; max-height: 300px; object-fit: cover; }

    .message pre {
      background: rgba(0,0,0,0.3);
      padding: 2.5rem 0.8rem 0.8rem;
      border-radius: 10px;
      overflow-x: auto;
      margin: 0.5rem 0;
      border: 1px solid var(--border);
      position: relative;
    }
    .message code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
    .copy-code-btn {
      position: absolute; top: 8px; right: 8px;
      background: var(--accent); border: none;
      color: white; padding: 0.3rem 0.6rem; border-radius: 6px;
      font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
    }
    .copy-code-btn:hover { background: var(--accent-hover); }

    /* Message actions */
    .message-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.7rem;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .message.assistant:hover .message-actions { opacity: 1; }
    @media (pointer: coarse) { .message-actions { opacity: 1; } } /* Always show on touch devices */
    .message-actions button {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .message-actions button:hover { background: var(--accent); border-color: var(--accent); color: white; }
    .like-btn.liked, .dislike-btn.disliked { background: var(--accent); color: white; border-color: var(--accent); }

    .typing {
      align-self: flex-start;
      background: var(--msg-assistant-bg);
      border: 1px solid var(--msg-assistant-border);
      padding: 0.8rem 1.5rem;
      border-radius: 16px 16px 16px 4px;
      display: flex;
      gap: 0.3rem;
    }
    .typing span { display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .input-wrapper {
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
      padding: 0.8rem 2.5rem 1.5rem;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }
    .image-preview-container { display: none; align-items: center; gap: 10px; padding-bottom: 0.5rem; }
    .image-preview-container img { height: 50px; border-radius: 8px; border: 1px solid var(--border); }
    .remove-image-btn { background: #ff4d4d; border: none; color: white; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .input-area { display: flex; gap: 0.8rem; align-items: flex-end; }
    .attach-btn {
      background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-secondary);
      font-size: 1.2rem; padding: 0 1rem; border-radius: 14px; cursor: pointer; height: 52px; transition: all 0.2s;
    }
    .attach-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--accent); }
    .input-area textarea {
      flex: 1; padding: 0.9rem 1.2rem; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 14px; font-size: 0.95rem; font-family: inherit; resize: none; outline: none;
      color: var(--text-primary); transition: border-color 0.2s, box-shadow 0.2s; min-height: 52px; max-height: 140px;
    }
    .input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(124,92,252,0.3); }
    .input-area button.send-btn {
      background: var(--accent); border: none; color: white; padding: 0 1.8rem; border-radius: 14px;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; height: 52px; transition: all 0.2s;
      box-shadow: 0 0 20px rgba(124,92,252,0.4);
    }
    .input-area button.send-btn:hover { background: var(--accent-hover); box-shadow: 0 0 30px rgba(124,92,252,0.7); }
    .input-area button.send-btn:disabled { opacity: 0.6; pointer-events: none; }

    .footer-note {
      padding: 0.6rem 2.5rem; text-align: center; font-size: 0.75rem; color: var(--text-muted);
      background: var(--bg-primary); border-top: 1px solid var(--border); flex-shrink: 0;
    }

    .messages::-webkit-scrollbar, .chat-list::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb, .chat-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .sidebar { position: absolute; left: 0; top: 0; height: 100%; z-index: 40; }
      .sidebar.hidden { transform: translateX(-100%); }
      .messages { padding: 1.5rem 1rem; }
      .input-wrapper { padding: 0.5rem 1rem 1rem; }
      .header { padding: 0.8rem 1rem; }
      .menu-toggle { display: flex; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>◈ Vexel AI</h2>
    <button class="new-chat-btn" onclick="createNewChat()" title="New chat">+</button>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>

<!-- Main Chat Area -->
<div class="main-area">
  <div class="header">
    <div class="header-left">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h1>Vexel AI</h1>
    </div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
      <button onclick="clearCurrentChat()">🗑️ Clear</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-wrapper">
    <div class="image-preview-container" id="imagePreviewContainer">
      <img id="imagePreview" src="" alt="Preview" />
      <button class="remove-image-btn" onclick="removeImage()">✕</button>
    </div>
    <div class="input-area">
      <input type="file" id="fileInput" accept="image/*" hidden onchange="handleImageSelection(event)">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach Image">📎</button>
      <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <div class="footer-note">1000 Messages a day! · Supports Text & Images · Chats saved automatically</div>
</div>

<script>
  // ============================================================
  // STATE MANAGEMENT (unchanged logic)
  // ============================================================
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewContainer = document.getElementById('imagePreviewContainer');
  const imagePreview = document.getElementById('imagePreview');
  const fileInput = document.getElementById('fileInput');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');

  let isWaiting = false;
  let currentImageBase64 = null;
  let currentImageMimeType = null;

  let allChats = [];
  let activeChatId = null;
  let chatHistory = [];
  let lastUserPrompt = null;
  let lastUserImage = null;

  // ============================================================
  // INITIALIZATION (FIXED)
  // ============================================================
  window.addEventListener('load', () => {
    loadAllChats();

    if (allChats.length === 0) {
      createNewChat(true);
    } else {
      const storedId = localStorage.getItem('vexel_activeChatId');
      if (storedId && allChats.some(c => c.id === storedId)) {
        activeChatId = storedId;
      } else {
        activeChatId = allChats[0].id;
        localStorage.setItem('vexel_activeChatId', activeChatId);
      }
      loadActiveChat();
    }

    renderChatList();
    updateThemeIcon();
    promptInput.focus();

    // Auto-close sidebar on mobile by default, but keep toggle functional
    handleResponsiveSidebar();
    window.addEventListener('resize', handleResponsiveSidebar);
  });

  function handleResponsiveSidebar() {
    if (window.innerWidth <= 768) {
      sidebar.classList.add('hidden');
    } else {
      sidebar.classList.remove('hidden');
    }
  }

  function loadAllChats() {
    const stored = localStorage.getItem('vexel_chats');
    if (stored) {
      try { allChats = JSON.parse(stored); } catch (e) { allChats = []; }
    }
  }

  function saveAllChats() {
    localStorage.setItem('vexel_chats', JSON.stringify(allChats));
  }

  function loadActiveChat() {
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat) {
      chatHistory = chat.messages || [];
      renderAllMessages();
    }
  }

  function createNewChat(switchTo = true) {
    const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    const newChat = {
      id,
      title: 'New Chat',
      createdAt: Date.now(),
      messages: []
    };
    allChats.unshift(newChat);
    saveAllChats();
    if (switchTo) {
      activeChatId = id;
      localStorage.setItem('vexel_activeChatId', id);
      chatHistory = [];
      renderAllMessages();
      renderChatList();
    }
  }

  function switchToChat(chatId) {
    if (activeChatId) {
      const currentChat = allChats.find(c => c.id === activeChatId);
      if (currentChat) {
        currentChat.messages = chatHistory;
        saveAllChats();
      }
    }
    activeChatId = chatId;
    localStorage.setItem('vexel_activeChatId', chatId);
    loadActiveChat();
    renderChatList();
    lastUserPrompt = null;
    lastUserImage = null;
    // On mobile, close sidebar after selection
    if (window.innerWidth <= 768) sidebar.classList.add('hidden');
  }

  function deleteChat(chatId, event) {
    event.stopPropagation();
    if (allChats.length <= 1) return;

    if (!confirm('Are you sure you want to delete this chat?')) return;

    allChats = allChats.filter(c => c.id !== chatId);
    if (activeChatId === chatId) {
      activeChatId = allChats[0].id;
      localStorage.setItem('vexel_activeChatId', activeChatId);
    }
    saveAllChats();
    loadActiveChat();
    renderChatList();
  }

  function renderChatList() {
    chatListEl.innerHTML = '';
    allChats.forEach(chat => {
      const item = document.createElement('div');
      item.className = `chat-list-item${chat.id === activeChatId ? ' active' : ''}`;
      item.innerHTML = `
        <span class="title">${escapeHtml(chat.title)}</span>
        <button class="delete-chat" title="Delete">🗑️</button>
      `;
      item.addEventListener('click', () => switchToChat(chat.id));
      item.querySelector('.delete-chat').addEventListener('click', (e) => deleteChat(chat.id, e));
      chatListEl.appendChild(item);
    });
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderAllMessages() {
    messagesDiv.innerHTML = '';
    if (chatHistory.length === 0) {
      renderMessage('assistant', '👋 Hello! I\'m Vexel. Ask me anything or upload an image.', null, false);
    } else {
      chatHistory.forEach(msg => {
        const role = msg.role === 'model' ? 'assistant' : 'user';
        const textPart = msg.parts.find(p => p.text);
        const imagePart = msg.parts.find(p => p.inline_data);
        const text = textPart ? textPart.text : '';
        const imageSrc = imagePart ? `data:${imagePart.inline_data.mime_type};base64,${imagePart.inline_data.data}` : null;
        renderMessage(role, text, imageSrc, false);
      });
      setTimeout(scrollToBottom, 50);
    }
  }

  function saveCurrentChat() {
    if (!activeChatId) return;
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat) {
      chat.messages = chatHistory;
      if (chat.title === 'New Chat' && chatHistory.length > 0) {
        const firstUserMsg = chatHistory.find(m => m.role === 'user');
        if (firstUserMsg) {
          const textPart = firstUserMsg.parts.find(p => p.text);
          chat.title = textPart ? textPart.text.slice(0, 30) : 'Image Chat';
        }
      }
      saveAllChats();
      renderChatList();
    }
  }

  function clearCurrentChat() {
    if (isWaiting) return;
    chatHistory = [];
    messagesDiv.innerHTML = '';
    renderMessage('assistant', '✨ Conversation cleared. Ask me anything!', null, false);
    saveCurrentChat();
    lastUserPrompt = null;
    lastUserImage = null;
  }

  // ============================================================
  // RENDERING (unchanged)
  // ============================================================
  function renderMessage(role, text, imageSrc = null, smoothScroll = true) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    let contentHtml = '';
    if (imageSrc) contentHtml += `<img src="${imageSrc}" class="chat-img" />`;
    if (role === 'assistant') {
      contentHtml += marked.parse(text);
    } else {
      contentHtml += text.replace(/\n/g, '<br>');
    }
    div.innerHTML = contentHtml;

    div.querySelectorAll('pre').forEach(pre => {
      if (!pre.querySelector('.copy-code-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-code-btn';
        btn.innerText = 'Copy';
        btn.onclick = () => {
          const code = pre.querySelector('code')?.innerText || '';
          navigator.clipboard.writeText(code).then(() => {
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy', 2000);
          });
        };
        pre.appendChild(btn);
      }
    });

    if (role === 'assistant') {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'message-actions';
      
      const copyBtn = document.createElement('button');
      copyBtn.innerHTML = '📋 Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = '✅ Copied';
          setTimeout(() => copyBtn.textContent = '📋 Copy', 2000);
        });
      };

      const regenBtn = document.createElement('button');
      regenBtn.innerHTML = '🔄 Regenerate';
      regenBtn.onclick = () => regenerateResponse();

      const likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn';
      likeBtn.innerHTML = '👍';
      likeBtn.onclick = () => toggleFeedback('like', likeBtn);

      const dislikeBtn = document.createElement('button');
      dislikeBtn.className = 'dislike-btn';
      dislikeBtn.innerHTML = '👎';
      dislikeBtn.onclick = () => toggleFeedback('dislike', dislikeBtn);

      actionsDiv.appendChild(copyBtn);
      actionsDiv.appendChild(regenBtn);
      actionsDiv.appendChild(likeBtn);
      actionsDiv.appendChild(dislikeBtn);
      div.appendChild(actionsDiv);
    }

    messagesDiv.appendChild(div);
    if (smoothScroll) scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // ============================================================
  // IMAGE HANDLING (unchanged)
  // ============================================================
  function handleImageSelection(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imagePreview.src = e.target.result;
        imagePreviewContainer.style.display = 'flex';
        currentImageBase64 = e.target.result.split(',')[1];
        currentImageMimeType = file.type;
      };
      reader.readAsDataURL(file);
    }
  }

  function removeImage() {
    fileInput.value = '';
    imagePreview.src = '';
    imagePreviewContainer.style.display = 'none';
    currentImageBase64 = null;
    currentImageMimeType = null;
  }

  // ============================================================
  // MESSAGE SENDING (unchanged)
  // ============================================================
  async function sendMessage(regenerating = false) {
    const prompt = promptInput.value.trim();
    if ((!prompt && !currentImageBase64 && !regenerating) || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    const userParts = [];
    if (!regenerating) {
      const userText = prompt;
      const imageData = currentImageBase64 ? { mimeType: currentImageMimeType, data: currentImageBase64 } : null;
      if (userText) userParts.push({ text: userText });
      if (imageData) userParts.push({ inline_data: { mime_type: imageData.mimeType, data: imageData.data } });
      
      renderMessage('user', prompt, imagePreview.src);
      promptInput.value = '';
      promptInput.style.height = 'auto';
      removeImage();
      lastUserPrompt = prompt;
      lastUserImage = imageData;
    } else {
      if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'model') {
        chatHistory.pop();
        saveCurrentChat();
        const lastAssistant = messagesDiv.querySelector('.message.assistant:last-child');
        if (lastAssistant) lastAssistant.remove();
      }
    }

    showTyping();

    const payload = {
      prompt: regenerating ? (lastUserPrompt || '') : prompt,
      history: regenerating ? chatHistory : [...chatHistory, { role: 'user', parts: userParts }],
      image: regenerating ? lastUserImage : (currentImageBase64 ? { mimeType: currentImageMimeType, data: currentImageBase64 } : null)
    };

    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        const errorMsg = data.error?.message || JSON.stringify(data, null, 2);
        renderMessage('assistant', `⚠️ **API Error:**\n${errorMsg}\n\n*Your chat history is preserved.*`);
      } else if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        renderMessage('assistant', reply);

        if (!regenerating) {
          chatHistory.push({ role: 'user', parts: userParts });
        }
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        saveCurrentChat();
        renderChatList();
      } else {
        renderMessage('assistant', '❌ Unexpected response format.');
      }
    } catch (err) {
      removeTyping();
      renderMessage('assistant', `🚨 Network error: ${err.message}`);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  function regenerateResponse() {
    sendMessage(true);
  }

  function toggleFeedback(type, button) {
    button.classList.toggle(type === 'like' ? 'liked' : 'disliked');
    const feedback = JSON.parse(localStorage.getItem('vexel_feedback') || '{}');
    const msgIndex = Array.from(document.querySelectorAll('.message.assistant')).indexOf(button.closest('.message'));
    const key = `${activeChatId}_${msgIndex}`;
    feedback[key] = feedback[key] === type ? null : type;
    localStorage.setItem('vexel_feedback', JSON.stringify(feedback));
    const sibling = type === 'like' ? button.nextElementSibling : button.previousElementSibling;
    if (sibling) sibling.classList.remove('liked', 'disliked');
  }

  // ============================================================
  // THEME TOGGLE
  // ============================================================
  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    updateThemeIcon();
    localStorage.setItem('vexel_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  }

  function updateThemeIcon() {
    const btn = document.querySelector('.theme-btn');
    if (!btn) return;
    btn.innerHTML = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  }

  // ============================================================
  // SIDEBAR TOGGLE
  // ============================================================
  function toggleSidebar() {
    sidebar.classList.toggle('hidden');
  }

  // Load saved theme
  (function() {
    if (localStorage.getItem('vexel_theme') === 'light') {
      document.body.classList.add('light-mode');
    }
    updateThemeIcon();
  })();

  promptInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });
</script>
</body>
</html>
