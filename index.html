<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vexel AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    /* ================================================================
       🚀  VEXEL AI – ULTIMATE MASTER (Voice, PDF, Search, Incognito)
       ================================================================ */
    :root {
      --bg-deep: #0b0c18;
      --bg-glass: rgba(18, 20, 42, 0.7);
      --border-glow: rgba(120, 90, 255, 0.4);
      --accent: #8a6dff;
      --accent-bright: #b590ff;
      --text-primary: #f0eefc;
      --text-secondary: #c2c0dd;
      --text-muted: #7878a0;
      --user-bg: linear-gradient(135deg, #322b6b, #1a1445);
      --assistant-bg: rgba(22, 24, 45, 0.8);
      --header-bg: rgba(16, 18, 32, 0.9);
      --sidebar-bg: rgba(10, 11, 22, 0.95);
      --input-bg: rgba(20, 22, 40, 0.6);
      --scroll-thumb: #3a3570;
      --neon-glow: 0 0 15px rgba(138, 109, 255, 0.5);
      --incognito-color: #b366ff;
    }

    body.light-mode {
      --bg-deep: #f4f6ff;
      --bg-glass: rgba(255,255,255,0.7);
      --border-glow: rgba(100, 80, 255, 0.3);
      --accent: #6c5ce7;
      --accent-bright: #8c7cf0;
      --text-primary: #181a2e;
      --text-secondary: #4a4b65;
      --text-muted: #7b7d98;
      --user-bg: linear-gradient(135deg, #e0dcff, #cbc3ff);
      --assistant-bg: rgba(255,255,255,0.85);
      --header-bg: rgba(255,255,255,0.9);
      --sidebar-bg: rgba(240,242,255,0.95);
      --input-bg: rgba(255,255,255,0.8);
      --scroll-thumb: #b0acd5;
      --neon-glow: 0 0 12px rgba(108, 92, 231, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: background 0.4s, color 0.4s;
      position: relative;
      width: 100vw;
      min-width: 0;
    }

    /* Animated orbs (unchanged) */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(138,109,255,0.15) 0%, transparent 70%);
      top: -200px;
      left: -200px;
      border-radius: 50%;
      animation: floatOrb 12s ease-in-out infinite;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(180,140,255,0.1) 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      border-radius: 50%;
      animation: floatOrb 15s ease-in-out infinite reverse;
      pointer-events: none;
    }
    @keyframes floatOrb {
      0%,100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(40px,-40px) scale(1.1); }
      50% { transform: translate(-30px,30px) scale(0.9); }
      75% { transform: translate(-30px,-30px) scale(1.05); }
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-glow);
      display: flex;
      flex-direction: column;
      height: 100vh;
      flex-shrink: 0;
      transition: transform 0.3s;
      z-index: 30;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 4px 0 30px rgba(0,0,0,0.5), var(--neon-glow);
    }
    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      height: 100%;
    }
    .sidebar-header {
      padding: 1.5rem 1.2rem 0.8rem;
      border-bottom: 1px solid var(--border-glow);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .sidebar-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b590ff, #8a6dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .close-sidebar-btn {
      background: none;
      border: 1px solid var(--border-glow);
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
    }
    .close-sidebar-btn:hover { background: var(--accent); color: white; }
    .new-chat-btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: var(--neon-glow);
      width: 100%;
    }
    .sidebar-tools {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .incognito-toggle {
      background: rgba(22,24,45,0.6);
      border: 1px solid var(--border-glow);
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }
    .incognito-toggle.active {
      background: var(--incognito-color);
      border-color: var(--incognito-color);
      color: white;
    }
    .search-box {
      width: 100%;
      padding: 0.5rem 0.8rem;
      background: var(--input-bg);
      border: 1px solid var(--border-glow);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      margin: 0.5rem 0;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .chat-list-item { /* unchanged */ }
    /* (include previous chat-list-item styles) */
    .chat-list-item {
      padding: 0.8rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .chat-list-item:hover { background: rgba(138,109,255,0.15); border-color: var(--border-glow); }
    .chat-list-item.active { background: rgba(138,109,255,0.2); border-color: var(--accent); color: white; }
    .chat-list-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    .chat-list-item .delete-chat { background: rgba(255,70,70,0.2); border: none; color: #ff7575; padding: 0.2rem 0.5rem; border-radius: 6px; cursor: pointer; }

    /* ========== MAIN AREA ========== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }
    .header {
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glow);
      padding: 1rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }
    .header.incognito {
      background: rgba(179, 102, 255, 0.2);
      border-bottom: 1px solid var(--incognito-color);
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .menu-toggle {
      background: none; border: 1px solid var(--border-glow);
      color: var(--text-secondary); font-size: 1.3rem;
      padding: 0.3rem 0.6rem; border-radius: 8px; cursor: pointer;
    }
    .menu-toggle:hover { background: var(--accent); color: white; }
    .menu-toggle.hidden { display: none; }
    .header h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #b590ff, #8a6dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .header-actions button { /* same */ }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 2rem 2.5rem;
      display: flex; flex-direction: column; gap: 1.5rem;
      background: transparent; scroll-behavior: smooth;
    }
    .message { /* unchanged bubble styles */ }
    /* Sticky copy button */
    .copy-code-btn {
      position: sticky; top: 8px; right: 8px; float: right;
      z-index: 5; background: var(--accent); color: white;
      padding: 0.3rem 0.6rem; border-radius: 6px;
      font-size: 0.75rem; cursor: pointer;
      box-shadow: 0 0 8px rgba(138,109,255,0.6);
    }

    /* Input area with extra buttons */
    .input-wrapper {
      border-top: 1px solid var(--border-glow);
      padding: 0.8rem 2.5rem 1.5rem;
      background: transparent;
    }
    .image-previews { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 0.5rem; }
    .preview-thumb { /* unchanged */ }
    .input-area {
      display: flex; gap: 0.5rem; align-items: flex-end;
    }
    .tool-btn {
      background: var(--input-bg); border: 1px solid var(--input-border);
      color: var(--text-secondary); font-size: 1.2rem;
      padding: 0 0.8rem; border-radius: 14px; cursor: pointer;
      height: 52px; transition: all 0.2s;
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--accent-bright); }
    .tool-btn.recording {
      background: #ff4444;
      border-color: #ff4444;
      color: white;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,68,68,0.6); }
      70% { box-shadow: 0 0 0 10px rgba(255,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
    }
    .input-area textarea {
      flex: 1; padding: 0.9rem 1.2rem; background: var(--input-bg);
      border: 1px solid var(--border-glow); border-radius: 14px;
      color: var(--text-primary); resize: none; outline: none;
      min-height: 52px; max-height: 140px;
    }
    .send-btn {
      background: var(--accent); border: none; color: white;
      padding: 0 1.8rem; border-radius: 14px; height: 52px;
      font-weight: 600; cursor: pointer; box-shadow: var(--neon-glow);
    }

    /* Delete modal (unchanged) */
    .modal-overlay { /* ... */ }

    /* Mobile tweaks */
    @media (max-width: 768px) {
      .input-area { flex-wrap: wrap; }
      .tool-btn { height: 44px; padding: 0 0.6rem; font-size: 1rem; }
      .input-area textarea { min-height: 44px; }
      .send-btn { height: 44px; padding: 0 1rem; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <h2>◈ Vexel AI</h2>
      <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div class="sidebar-tools">
      <input type="text" class="search-box" placeholder="🔍 Search chats..." id="searchInput" oninput="filterChats()">
      <button class="incognito-toggle" id="incognitoToggle" onclick="toggleIncognito()" title="Incognito Mode">🕶️</button>
    </div>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <p>Are you sure you want to delete this chat?</p>
    <div class="modal-buttons">
      <button onclick="closeDeleteModal()">Cancel</button>
      <button class="confirm-delete" id="confirmDeleteBtn">Yes, delete</button>
    </div>
  </div>
</div>

<!-- Main Chat -->
<div class="main-area">
  <div class="header" id="mainHeader">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>
      <h1>Vexel AI</h1>
    </div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleTheme()">🌙</button>
      <button onclick="clearCurrentChat()">🗑️ Clear</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-wrapper">
    <div class="image-previews" id="imagePreviews"></div>
    <div class="input-area">
      <input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleImageSelection(event)">
      <input type="file" id="pdfInput" accept="application/pdf" hidden onchange="handlePDFSelection(event)">
      <button class="tool-btn" onclick="document.getElementById('imageInput').click()" title="Attach Images">📎</button>
      <button class="tool-btn" onclick="document.getElementById('pdfInput').click()" title="Attach PDF">📄</button>
      <button class="tool-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">🎤</button>
      <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <div class="footer-note">1000 Messages a day! · Supports images, PDF, voice · Chats saved automatically (unless incognito)</div>
</div>

<script>
  // ============================================================
  // PDF.js setup
  // ============================================================
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // ============================================================
  // DOM elements
  // ============================================================
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewsContainer = document.getElementById('imagePreviews');
  const imageInput = document.getElementById('imageInput');
  const pdfInput = document.getElementById('pdfInput');
  const micBtn = document.getElementById('micBtn');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menuToggle');
  const mainHeader = document.getElementById('mainHeader');
  const incognitoToggle = document.getElementById('incognitoToggle');

  let isWaiting = false;
  let selectedImages = [];          // { mimeType, data, previewUrl }
  let allChats = [];
  let activeChatId = null;
  let chatHistory = [];
  let lastUserPrompt = null;
  let lastUserParts = null;
  let pendingDeleteChatId = null;
  let isIncognito = false;
  let recognition = null; // SpeechRecognition instance
  let isRecording = false;

  // ============================================================
  // INIT
  // ============================================================
  window.addEventListener('load', () => {
    loadAllChats();
    if (allChats.length === 0) {
      createNewChat(true);
    } else {
      const storedId = localStorage.getItem('vexel_activeChatId');
      if (storedId && allChats.some(c => c.id === storedId)) {
        activeChatId = storedId;
      } else {
        activeChatId = allChats[0].id;
        localStorage.setItem('vexel_activeChatId', activeChatId);
      }
      loadActiveChat();
    }
    renderChatList();
    updateThemeIcon();
    handleResponsiveSidebar();
    promptInput.focus();

    window.addEventListener('resize', () => {
      handleResponsiveSidebar();
      updateToggleButtonVisibility();
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', executeDelete);

    // Speech recognition setup
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        promptInput.value = promptInput.value + ' ' + transcript;
        promptInput.focus();
        stopRecordingUI();
      };
      recognition.onerror = function(event) {
        stopRecordingUI();
      };
      recognition.onend = function() {
        stopRecordingUI();
      };
    } else {
      micBtn.style.display = 'none';
    }
  });

  function handleResponsiveSidebar() {
    if (window.innerWidth <= 768) sidebar.classList.add('hidden');
    else sidebar.classList.remove('hidden');
    updateToggleButtonVisibility();
  }

  function updateToggleButtonVisibility() {
    menuToggle.classList.toggle('hidden', !sidebar.classList.contains('hidden'));
  }

  function toggleSidebar() {
    sidebar.classList.toggle('hidden');
    updateToggleButtonVisibility();
  }

  // ============================================================
  // CHAT MANAGEMENT (persistent + incognito)
  // ============================================================
  function loadAllChats() {
    const stored = localStorage.getItem('vexel_chats');
    if (stored) {
      try { allChats = JSON.parse(stored); } catch (e) { allChats = []; }
    }
  }

  function saveAllChats() {
    if (!isIncognito) localStorage.setItem('vexel_chats', JSON.stringify(allChats));
  }

  function loadActiveChat() {
    if (isIncognito) {
      chatHistory = []; // incognito chats start fresh
      renderAllMessages();
      return;
    }
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat) {
      chatHistory = chat.messages || [];
      renderAllMessages();
    }
    loadDraft(activeChatId);
  }

  function createNewChat(switchTo = true) {
    if (isIncognito) {
      // New incognito chat: just clear history
      chatHistory = [];
      activeChatId = null; // no ID
      renderAllMessages();
      clearDraftUI();
      lastUserPrompt = null;
      lastUserParts = null;
      return;
    }
    const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    const newChat = { id, title: 'New Chat', createdAt: Date.now(), messages: [] };
    allChats.unshift(newChat);
    saveAllChats();
    if (switchTo) {
      saveDraft(activeChatId);
      activeChatId = id;
      localStorage.setItem('vexel_activeChatId', id);
      chatHistory = [];
      renderAllMessages();
      renderChatList();
      clearDraftUI();
      loadDraft(activeChatId);
    }
  }

  function switchToChat(chatId) {
    if (isIncognito) {
      // Exit incognito if switching to a saved chat
      toggleIncognito(false);
    }
    saveDraft(activeChatId);
    if (activeChatId) {
      const currentChat = allChats.find(c => c.id === activeChatId);
      if (currentChat) {
        currentChat.messages = chatHistory;
        saveAllChats();
      }
    }
    activeChatId = chatId;
    localStorage.setItem('vexel_activeChatId', chatId);
    loadActiveChat();
    renderChatList();
    lastUserPrompt = null;
    lastUserParts = null;
    if (window.innerWidth <= 768) {
      sidebar.classList.add('hidden');
      updateToggleButtonVisibility();
    }
  }

  function deleteChat(chatId, event) {
    event.stopPropagation();
    if (allChats.length <= 1) return;
    pendingDeleteChatId = chatId;
    document.getElementById('deleteModal').classList.add('active');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
    pendingDeleteChatId = null;
  }

  function executeDelete() {
    if (!pendingDeleteChatId) return;
    allChats = allChats.filter(c => c.id !== pendingDeleteChatId);
    if (activeChatId === pendingDeleteChatId) {
      activeChatId = allChats[0].id;
      localStorage.setItem('vexel_activeChatId', activeChatId);
      localStorage.removeItem(`vexel_draft_${pendingDeleteChatId}`);
    }
    saveAllChats();
    loadActiveChat();
    renderChatList();
    closeDeleteModal();
  }

  function renderChatList(filteredChats = null) {
    const chatsToRender = filteredChats || allChats;
    chatListEl.innerHTML = '';
    if (isIncognito) return; // don't show list during incognito
    chatsToRender.forEach(chat => {
      const item = document.createElement('div');
      item.className = `chat-list-item${chat.id === activeChatId ? ' active' : ''}`;
      item.innerHTML = `
        <span class="title">${escapeHtml(chat.title)}</span>
        <button class="delete-chat" title="Delete">🗑️</button>
      `;
      item.addEventListener('click', () => switchToChat(chat.id));
      item.querySelector('.delete-chat').addEventListener('click', (e) => deleteChat(chat.id, e));
      chatListEl.appendChild(item);
    });
  }

  function filterChats() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    if (!query) {
      renderChatList();
      return;
    }
    const filtered = allChats.filter(chat => chat.title.toLowerCase().includes(query));
    renderChatList(filtered);
  }

  // Incognito mode
  function toggleIncognito(forceState = null) {
    const newState = forceState !== null ? forceState : !isIncognito;
    if (newState === isIncognito) return;
    isIncognito = newState;
    if (isIncognito) {
      // Save current chat before entering incognito
      if (activeChatId) {
        const currentChat = allChats.find(c => c.id === activeChatId);
        if (currentChat) {
          currentChat.messages = chatHistory;
          saveAllChats();
        }
      }
      activeChatId = null;
      chatHistory = [];
      renderAllMessages();
      clearDraftUI();
      mainHeader.classList.add('incognito');
      incognitoToggle.classList.add('active');
      renderChatList(); // empty list
    } else {
      // Exit incognito: load the last active chat or first chat
      mainHeader.classList.remove('incognito');
      incognitoToggle.classList.remove('active');
      const storedId = localStorage.getItem('vexel_activeChatId');
      if (storedId && allChats.some(c => c.id === storedId)) {
        activeChatId = storedId;
      } else if (allChats.length > 0) {
        activeChatId = allChats[0].id;
        localStorage.setItem('vexel_activeChatId', activeChatId);
      } else {
        createNewChat(true);
        return;
      }
      loadActiveChat();
      renderChatList();
      clearDraftUI();
      loadDraft(activeChatId);
    }
  }

  // ============================================================
  // DRAFT MANAGEMENT
  // ============================================================
  function saveDraft(chatId) {
    if (!chatId || isIncognito) return;
    const draft = {
      prompt: promptInput.value,
      images: selectedImages.map(img => ({ mimeType: img.mimeType, data: img.data, previewUrl: img.previewUrl }))
    };
    localStorage.setItem(`vexel_draft_${chatId}`, JSON.stringify(draft));
  }

  function loadDraft(chatId) {
    if (isIncognito) {
      clearDraftUI();
      return;
    }
    const stored = localStorage.getItem(`vexel_draft_${chatId}`);
    if (stored) {
      try {
        const draft = JSON.parse(stored);
        promptInput.value = draft.prompt || '';
        selectedImages = (draft.images || []).map(img => ({
          mimeType: img.mimeType,
          data: img.data,
          previewUrl: img.previewUrl
        }));
        renderImagePreviews();
        return;
      } catch(e) {}
    }
    clearDraftUI();
  }

  function clearDraftUI() {
    promptInput.value = '';
    selectedImages = [];
    renderImagePreviews();
  }

  // ============================================================
  // RENDERING
  // ============================================================
  function renderImagePreviews() {
    imagePreviewsContainer.innerHTML = '';
    selectedImages.forEach((img, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'preview-thumb';
      thumb.innerHTML = `<img src="${img.previewUrl}" /><button class="remove-thumb" data-index="${index}">✕</button>`;
      imagePreviewsContainer.appendChild(thumb);
    });
    imagePreviewsContainer.querySelectorAll('.remove-thumb').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index);
        selectedImages.splice(idx, 1);
        renderImagePreviews();
        saveDraft(activeChatId);
      });
    });
  }

  function renderAllMessages() {
    messagesDiv.innerHTML = '';
    if (chatHistory.length === 0) {
      renderMessage('assistant', '👋 Hello! I\'m Vexel. Ask me anything or upload files.', null, false, true);
    } else {
      chatHistory.forEach(msg => {
        const role = msg.role === 'model' ? 'assistant' : 'user';
        const textPart = msg.parts.find(p => p.text);
        const imageParts = msg.parts.filter(p => p.inline_data);
        let text = textPart ? textPart.text : '';
        let imageHtml = '';
        imageParts.forEach(part => {
          imageHtml += `<img src="data:${part.inline_data.mime_type};base64,${part.inline_data.data}" class="chat-img" />`;
        });
        const content = imageHtml ? (text + imageHtml) : text;
        renderMessage(role, content, null, false);
      });
      setTimeout(scrollToBottom, 50);
    }
  }

  function renderMessage(role, textOrHtml, imageSrc = null, smoothScroll = true, skipActions = false) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    if (role === 'assistant') {
      div.innerHTML = marked.parse(textOrHtml);
    } else {
      div.innerHTML = textOrHtml.replace(/\n/g, '<br>');
    }

    div.querySelectorAll('pre').forEach(pre => {
      if (!pre.querySelector('.copy-code-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-code-btn';
        btn.innerText = 'Copy';
        btn.onclick = () => {
          const code = pre.querySelector('code')?.innerText || '';
          navigator.clipboard.writeText(code).then(() => {
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy', 2000);
          });
        };
        pre.appendChild(btn);
      }
    });

    if (role === 'assistant' && !skipActions) {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'message-actions';
      const copyBtn = document.createElement('button');
      copyBtn.innerHTML = '📋 Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(textOrHtml).then(() => {
          copyBtn.textContent = '✅ Copied';
          setTimeout(() => copyBtn.textContent = '📋 Copy', 2000);
        });
      };
      const regenBtn = document.createElement('button');
      regenBtn.innerHTML = '🔄 Regenerate';
      regenBtn.onclick = () => regenerateResponse();
      const likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn';
      likeBtn.innerHTML = '👍';
      likeBtn.onclick = () => toggleFeedback('like', likeBtn);
      const dislikeBtn = document.createElement('button');
      dislikeBtn.className = 'dislike-btn';
      dislikeBtn.innerHTML = '👎';
      dislikeBtn.onclick = () => toggleFeedback('dislike', dislikeBtn);
      actionsDiv.appendChild(copyBtn);
      actionsDiv.appendChild(regenBtn);
      actionsDiv.appendChild(likeBtn);
      actionsDiv.appendChild(dislikeBtn);
      div.appendChild(actionsDiv);
    }

    messagesDiv.appendChild(div);
    if (smoothScroll) scrollToBottom();
  }

  function showTyping() { /* unchanged */ }
  function removeTyping() { /* unchanged */ }
  function scrollToBottom() { messagesDiv.scrollTop = messagesDiv.scrollHeight; }

  // ============================================================
  // IMAGE & PDF HANDLING
  // ============================================================
  function handleImageSelection(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      if (selectedImages.length >= 4) { alert('Max 4 images'); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result.split(',')[1];
        selectedImages.push({ mimeType: file.type, data: base64, previewUrl: e.target.result });
        renderImagePreviews();
        saveDraft(activeChatId);
      };
      reader.readAsDataURL(file);
    });
    imageInput.value = '';
  }

  async function handlePDFSelection(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const pageText = content.items.map(item => item.str).join(' ');
        fullText += pageText + '\n';
      }
      // Truncate to 5000 characters to keep payload manageable
      const truncated = fullText.slice(0, 5000);
      promptInput.value = `${promptInput.value}\n\n[PDF Content]:\n${truncated}`;
    } catch (err) {
      alert('Failed to extract PDF text.');
    }
    pdfInput.value = '';
  }

  // ============================================================
  // VOICE INPUT
  // ============================================================
  function startVoiceInput() {
    if (!recognition) return;
    if (isRecording) {
      recognition.stop();
      return;
    }
    isRecording = true;
    micBtn.classList.add('recording');
    recognition.start();
  }

  function stopRecordingUI() {
    isRecording = false;
    micBtn.classList.remove('recording');
  }

  // ============================================================
  // MESSAGE SENDING (with incognito awareness)
  // ============================================================
  async function sendMessage(regenerating = false) {
    const prompt = promptInput.value.trim();
    if ((!prompt && selectedImages.length === 0 && !regenerating) || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    const userParts = [];
    if (!regenerating) {
      if (prompt) userParts.push({ text: prompt });
      selectedImages.forEach(img => {
        userParts.push({ inline_data: { mime_type: img.mimeType, data: img.data } });
      });

      let combinedHtml = prompt ? prompt.replace(/\n/g, '<br>') : '';
      selectedImages.forEach(img => {
        combinedHtml += `<img src="${img.previewUrl}" class="chat-img" />`;
      });
      renderMessage('user', combinedHtml, null, true, false);

      promptInput.value = '';
      selectedImages = [];
      renderImagePreviews();
      clearDraftUI();
      if (!isIncognito) saveDraft(activeChatId);
      lastUserPrompt = prompt;
      lastUserParts = userParts;
    } else {
      if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'model') {
        chatHistory.pop();
        saveCurrentChatIfNeeded();
        const lastAssistant = messagesDiv.querySelector('.message.assistant:last-child');
        if (lastAssistant) lastAssistant.remove();
      }
    }

    showTyping();

    const payload = {
      prompt: regenerating ? (lastUserPrompt || '') : prompt,
      history: regenerating ? chatHistory : [...chatHistory, { role: 'user', parts: userParts }],
      images: regenerating
        ? (lastUserParts ? lastUserParts.filter(p => p.inline_data).map(p => ({ mimeType: p.inline_data.mime_type, data: p.inline_data.data })) : [])
        : selectedImages.map(img => ({ mimeType: img.mimeType, data: img.data }))
    };

    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        const errorMsg = data.error?.message || JSON.stringify(data, null, 2);
        renderMessage('assistant', `⚠️ **API Error:**\n${errorMsg}`);
      } else if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        renderMessage('assistant', reply);

        if (!regenerating) chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        saveCurrentChatIfNeeded();
        renderChatList();
      } else {
        renderMessage('assistant', '❌ Unexpected response format.');
      }
    } catch (err) {
      removeTyping();
      renderMessage('assistant', `🚨 Network error: ${err.message}`);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  function saveCurrentChatIfNeeded() {
    if (isIncognito) return;
    saveCurrentChat();
  }

  function saveCurrentChat() {
    if (!activeChatId || isIncognito) return;
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat) {
      chat.messages = chatHistory;
      if (chat.title === 'New Chat' && chatHistory.length > 0) {
        const firstUserMsg = chatHistory.find(m => m.role === 'user');
        if (firstUserMsg) {
          const textPart = firstUserMsg.parts.find(p => p.text);
          chat.title = textPart ? textPart.text.slice(0, 30) : 'File Chat';
        }
      }
      saveAllChats();
      renderChatList();
    }
  }

  function regenerateResponse() { sendMessage(true); }

  function clearCurrentChat() {
    if (isWaiting) return;
    chatHistory = [];
    messagesDiv.innerHTML = '';
    renderMessage('assistant', '✨ Conversation cleared.', null, false, true);
    clearDraftUI();
    if (!isIncognito) saveCurrentChat();
  }

  function toggleFeedback(type, button) { /* unchanged */ }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    updateThemeIcon();
    localStorage.setItem('vexel_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  }

  function updateThemeIcon() {
    const btn = document.querySelector('.theme-btn');
    if (btn) btn.innerHTML = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  }

  (function() {
    if (localStorage.getItem('vexel_theme') === 'light') document.body.classList.add('light-mode');
    updateThemeIcon();
  })();

  promptInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    if (!isIncognito && activeChatId) saveDraft(activeChatId);
  });
</script>
