<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI</title>

  <!-- Markdown library for nice formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ================================================================
       🌃  FULL‑SCREEN NEON UI – VEXEL AI
       ================================================================ */

    /* ----- Reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a12;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background 0.3s;
      overflow: hidden;
    }

    body.dark {
      background: #0a0a12;   /* stays neon even when toggled – you can keep it */
    }

    /* ----- Main chat container – now FULL SCREEN ----- */
    .chat-container {
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 20, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s;
    }

    body.dark .chat-container {
      background: rgba(10, 10, 20, 0.9);
      border-color: rgba(255, 0, 255, 0.2);
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.2);
    }

    /* ----- Header – neon gradient & glowing text ----- */
    .header {
      background: linear-gradient(135deg, #ff00cc, #3333ff);
      color: white;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(255, 0, 200, 0.4);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px #ff00cc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* ===== ADVANCED NEON BUTTONS ===== */
    .header-actions button {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .header-actions button::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      transition: all 0.5s;
    }

    .header-actions button:hover::before {
      left: 100%;
    }

    .header-actions button:hover {
      border-color: #ff00cc;
      box-shadow: 0 0 15px #ff00cc, 0 0 30px #ff00cc66, inset 0 0 10px rgba(255,255,255,0.2);
      text-shadow: 0 0 8px white;
      background: rgba(255, 0, 200, 0.1);
      transform: scale(1.05);
    }

    .header-actions button:active {
      transform: scale(0.95);
    }

    /* ----- Message area – dark glass with neon glow scroll ----- */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(15px);
      transition: background 0.3s;
    }

    body.dark .messages {
      background: rgba(0, 0, 0, 0.5);
    }

    /* ---- Message bubbles – neon frame ---- */
    .message {
      max-width: 80%;
      padding: 1rem 1.5rem;
      border-radius: 20px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeInNeon 0.3s ease;
      font-size: 1rem;
      position: relative;
      border: 1px solid rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #ff00cc, #3333ff);
      color: white;
      border-bottom-right-radius: 6px;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px #ff00cc88, 0 0 40px #3333ff44;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(0, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      color: #e0f7ff;
      border-bottom-left-radius: 6px;
      border-color: rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }

    body.dark .message.assistant {
      background: rgba(255, 0, 200, 0.08);
      border-color: rgba(255, 0, 200, 0.4);
      box-shadow: 0 0 20px rgba(255, 0, 200, 0.3);
    }

    .message pre {
      background: rgba(0,0,0,0.4);
      padding: 0.8rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5rem 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .message code {
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    /* ---- Typing indicator – glowing dots ---- */
    .typing {
      align-self: flex-start;
      background: rgba(0, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 0.8rem 1.5rem;
      border-radius: 20px;
      border-bottom-left-radius: 6px;
      display: flex;
      gap: 0.3rem;
      border: 1px solid rgba(0, 255, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
    }

    .typing span {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #0ff;
      border-radius: 50%;
      animation: neonBounce 1.2s infinite;
      box-shadow: 0 0 6px #0ff, 0 0 12px #0ff;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes neonBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
      30% { transform: translateY(-10px); opacity: 1; }
    }

    @keyframes fadeInNeon {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ----- Input area – neon text box & send button ----- */
    .input-area {
      display: flex;
      gap: 1rem;
      padding: 1.2rem 2rem;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(0, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .input-area textarea {
      flex: 1;
      padding: 0.9rem 1.5rem;
      border: 2px solid rgba(0, 255, 255, 0.4);
      border-radius: 30px;
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      outline: none;
      background: rgba(0, 255, 255, 0.05);
      color: white;
      transition: all 0.3s;
      min-height: 56px;
      max-height: 140px;
      backdrop-filter: blur(5px);
    }

    .input-area textarea:focus {
      border-color: #ff00cc;
      box-shadow: 0 0 20px #ff00cc88, 0 0 30px #ff00cc33;
      background: rgba(255, 0, 200, 0.08);
    }

    body.dark .input-area textarea:focus {
      border-color: #0ff;
      box-shadow: 0 0 25px #0ff99;
    }

    /* Neon send button */
    .input-area button {
      background: linear-gradient(135deg, #ff00cc, #3333ff);
      color: white;
      border: none;
      padding: 0 2rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      min-height: 56px;
      box-shadow: 0 0 20px #ff00cc88, 0 0 40px #3333ff44;
      border: 1px solid rgba(255,255,255,0.3);
      position: relative;
      overflow: hidden;
    }

    .input-area button::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg);
      transition: all 0.4s;
    }

    .input-area button:hover::before {
      left: 100%;
    }

    .input-area button:hover {
      box-shadow: 0 0 30px #ff00cc, 0 0 60px #3333ff, inset 0 0 15px rgba(255,255,255,0.4);
      transform: scale(1.03);
    }

    .input-area button:active {
      transform: scale(0.96);
    }

    .input-area button:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(30%);
    }

    /* ----- Footer note – subtle neon ----- */
    .footer-note {
      padding: 0.5rem 2rem 0.8rem;
      text-align: center;
      font-size: 0.75rem;
      color: #0ff;
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(0, 255, 255, 0.2);
      letter-spacing: 0.5px;
      text-shadow: 0 0 5px #0ff;
      flex-shrink: 0;
    }

    /* scrollbar – neon style */
    .messages::-webkit-scrollbar {
      width: 6px;
    }
    .messages::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    .messages::-webkit-scrollbar-thumb {
      background: #ff00cc;
      border-radius: 10px;
      box-shadow: 0 0 6px #ff00cc;
    }
    body.dark .messages::-webkit-scrollbar-thumb {
      background: #0ff;
      box-shadow: 0 0 6px #0ff;
    }

    /* Mobile tweaks – still full screen */
    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.4rem;
      }
      .message {
        max-width: 90%;
      }
      .input-area {
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <h1>Vexel AI</h1>
    <div class="header-actions">
      <button onclick="clearChat()">🗑️ Clear</button>
      <button onclick="toggleDark()">🌙 Dark</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="message assistant">
      👋 Hello! I'm Vexel. Ask me anything.
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Footer -->
  <div class="footer-note">
    1000 Messages a day! &nbsp;·&nbsp; Responses may take a few seconds
  </div>
</div>

<script>
  // =============================================================
  // 🔐 NO API KEY HERE – it's safely stored on the Vercel backend
  // =============================================================

  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');

  let isDark = false;
  let isWaiting = false;

  // -------------------------------------------------------------
  // Render helpers
  // -------------------------------------------------------------
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;

    if (role === 'assistant') {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }

    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function clearChat() {
    if (isWaiting) return;
    messagesDiv.innerHTML = '';
    addMessage('assistant', '✨ Conversation cleared. Ask me anything!');
  }

  function toggleDark() {
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    const btn = document.querySelector('.header-actions button:last-child');
    btn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
  }

  // -------------------------------------------------------------
  // Send message to OUR OWN BACKEND (not Google directly)
  // -------------------------------------------------------------
  async function sendMessage() {
    const prompt = promptInput.value.trim();
    if (!prompt || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    addMessage('user', prompt);
    promptInput.value = '';
    promptInput.style.height = 'auto';
    showTyping();

    try {
      // 🟢 Call your Vercel serverless function
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });

      const data = await res.json();

      removeTyping();

      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        addMessage('assistant', reply);
      } else {
        const errorMsg = data.error?.message || JSON.stringify(data, null, 2);
        addMessage('assistant', `❌ Error:\n\`\`\`\n${errorMsg}\n\`\`\``);
      }
    } catch (err) {
      removeTyping();
      addMessage('assistant', `🚨 Network error:\n\`\`\`\n${err.message}\n\`\`\``);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  // Auto-resize textarea
  promptInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });

  window.addEventListener('load', () => promptInput.focus());
</script>

</body>
</html>
