<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vexel AI</title>
  <!-- KaTeX for advanced math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <!-- SHA256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
  <style>
    /* ========== FULL CSS ========== */
    :root {
      --bg-deep: #0b0c18; --bg-glass: rgba(18, 20, 42, 0.7); --border-glow: rgba(120, 90, 255, 0.4);
      --accent: #8a6dff; --accent-bright: #b590ff; --text-primary: #f0eefc;
      --text-secondary: #c2c0dd; --text-muted: #7878a0;
      --user-bg: linear-gradient(135deg, #322b6b, #1a1445);
      --assistant-bg: transparent; --header-bg: rgba(16, 18, 32, 0.9);
      --sidebar-bg: rgba(10, 11, 22, 0.95); --input-bg: rgba(20, 22, 40, 0.6);
      --scroll-thumb: #3a3570; --neon-glow: 0 0 15px rgba(138, 109, 255, 0.5);
      --incognito-color: #b366ff;
    }
    body.light-mode {
      --bg-deep: #f4f6ff; --bg-glass: rgba(255,255,255,0.7); --border-glow: rgba(100, 80, 255, 0.3);
      --accent: #6c5ce7; --accent-bright: #8c7cf0; --text-primary: #181a2e;
      --text-secondary: #4a4b65; --text-muted: #7b7d98;
      --user-bg: linear-gradient(135deg, #e0dcff, #cbc3ff);
      --assistant-bg: transparent; --header-bg: rgba(255,255,255,0.9);
      --sidebar-bg: rgba(240,242,255,0.95); --input-bg: rgba(255,255,255,0.8);
      --scroll-thumb: #b0acd5; --neon-glow: 0 0 12px rgba(108, 92, 231, 0.4);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep); color: var(--text-primary);
      display: flex; height: 100vh; overflow: hidden;
      transition: background 0.4s, color 0.4s;
      position: relative; width: 100vw;
    }
    body::before, body::after {
      content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(138,109,255,0.15) 0%, transparent 70%);
      top: -200px; left: -200px; animation: floatOrb 12s ease-in-out infinite;
    }
    body::after {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(180,140,255,0.1) 0%, transparent 70%);
      bottom: -150px; right: -150px; animation: floatOrb 15s ease-in-out infinite reverse;
    }
    @keyframes floatOrb {
      0%,100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(40px,-40px) scale(1.1); }
      50% { transform: translate(-30px,30px) scale(0.9); }
      75% { transform: translate(-30px,-30px) scale(1.05); }
    }
    button { cursor:pointer; transition:all 0.2s ease; font-family:inherit; }
    a { text-decoration:none; color:inherit; }

    /* Sidebar */
    .sidebar {
      width:280px; background:var(--sidebar-bg); border-right:1px solid var(--border-glow);
      display:flex; flex-direction:column; height:100vh; flex-shrink:0;
      transition:transform 0.3s; z-index:30; backdrop-filter:blur(16px);
      box-shadow:4px 0 30px rgba(0,0,0,0.5), var(--neon-glow);
    }
    .sidebar.hidden { transform:translateX(-100%); position:absolute; }
    .sidebar-header { padding:1.5rem 1.2rem 0.8rem; border-bottom:1px solid var(--border-glow); display:flex; flex-direction:column; gap:0.8rem; }
    .sidebar-title-row { display:flex; justify-content:space-between; align-items:center; }
    .sidebar-header h2 a { font-size:1.3rem; font-weight:700; background:linear-gradient(135deg, #b590ff, #8a6dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .close-sidebar-btn { background:none; border:1px solid var(--border-glow); color:var(--text-secondary); font-size:1.2rem; padding:0.3rem 0.6rem; border-radius:8px; }
    .close-sidebar-btn:hover { background:var(--accent); color:white; }
    .new-chat-btn { background:var(--accent); border:none; color:white; padding:0.7rem 1rem; border-radius:12px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:0.4rem; box-shadow:0 0 15px rgba(138,109,255,0.6); width:100%; }
    .sidebar-tools { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
    .incognito-toggle { background:rgba(22,24,45,0.6); border:1px solid var(--border-glow); color:var(--text-secondary); padding:0.4rem 0.8rem; border-radius:8px; font-size:0.9rem; display:flex; align-items:center; gap:0.3rem; }
    .incognito-toggle.active { background:var(--incognito-color); border-color:var(--incognito-color); color:white; }
    .search-box { width:100%; padding:0.5rem 0.8rem; background:var(--input-bg); border:1px solid var(--border-glow); border-radius:10px; color:var(--text-primary); font-size:0.85rem; outline:none; }
    .bulk-toggle-btn {
      background: rgba(255,70,70,0.2); border: 1px solid #ff4444; color: #ff7575;
      padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .bulk-toggle-btn.active { background: #ff4444; border-color: #ff4444; color: white; }
    .chat-list { flex:1; overflow-y:auto; padding:0.5rem; position: relative; }
    .chat-list-item { padding:0.8rem 1rem; border-radius:12px; cursor:pointer; color:var(--text-secondary); font-size:0.9rem; margin-bottom:0.25rem; display:flex; justify-content:space-between; align-items:center; border:1px solid transparent; transition:all 0.2s; }
    .chat-list-item:hover { background:rgba(138,109,255,0.15); border-color:var(--border-glow); }
    .chat-list-item.active { background:rgba(138,109,255,0.2); border-color:var(--accent); color:white; }
    .chat-list-item .title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
    .chat-list-item .chat-actions { display:flex; gap:0.3rem; align-items:center; }
    /* Hide checkboxes by default, show when bulk mode active */
    .chat-list-item .chat-actions input[type=checkbox] { display: none; }
    .bulk-mode .chat-list-item .chat-actions input[type=checkbox] { display: inline-block; accent-color: var(--accent); transform: scale(1.1); }
    .chat-list-item .chat-actions button { border:none; color:#fff; padding:0.3rem 0.5rem; border-radius:6px; font-size:0.8rem; transition:all 0.2s; }
    .chat-list-item .chat-actions .rename-btn { background:rgba(100,200,255,0.3); color:#80c0ff; }
    .chat-list-item .chat-actions .rename-btn:hover { background:#4aa0ff; color:white; box-shadow:0 0 10px rgba(74,160,255,0.6); }
    .chat-list-item .chat-actions .lock-btn { background:rgba(255,200,50,0.3); color:#ffcc50; }
    .chat-list-item .chat-actions .lock-btn:hover { background:#ffbb00; color:white; box-shadow:0 0 10px rgba(255,187,0,0.6); }
    .chat-list-item .chat-actions .delete-chat { background:rgba(255,70,70,0.3); color:#ff7575; }
    .chat-list-item .chat-actions .delete-chat:hover { background:#ff4444; color:white; box-shadow:0 0 10px rgba(255,68,68,0.6); }

    /* Bulk delete confirmation button */
    .bulk-delete-confirm {
      position: sticky; bottom: 10px; left: 0; right: 0;
      background: #ff4444; border: none; color: white; padding: 0.7rem 1.8rem;
      border-radius: 30px; font-weight: 600; box-shadow: 0 0 20px rgba(255,68,68,0.6);
      z-index: 50; display: none; margin: 0.5rem auto 0; width: fit-content;
    }
    .bulk-delete-confirm.visible { display: block; }

    /* Main area */
    .main-area { flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; }
    .header {
      background:var(--header-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--border-glow);
      padding:1rem 1.8rem; display:flex; justify-content:space-between; align-items:center;
      flex-shrink:0; box-shadow:0 4px 30px rgba(0,0,0,0.4);
    }
    .header.incognito { background:rgba(179,102,255,0.2); border-bottom:1px solid var(--incognito-color); }
    .header-left { display:flex; align-items:center; gap:1rem; }
    .menu-toggle { background:none; border:1px solid var(--border-glow); color:var(--text-secondary); font-size:1.3rem; padding:0.3rem 0.6rem; border-radius:8px; }
    .menu-toggle:hover { background:var(--accent); color:white; }
    .menu-toggle.hidden { display:none; }
    .header h1 a { font-size:1.6rem; font-weight:700; background:linear-gradient(135deg, #b590ff, #8a6dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; cursor:pointer; }
    .header-actions button { background:rgba(22,24,45,0.6); border:1px solid var(--border-glow); color:var(--text-secondary); padding:0.5rem 0.8rem; border-radius:10px; font-size:0.85rem; white-space:nowrap; margin-left:0.4rem; }
    .header-actions button:hover { background:var(--accent); border-color:var(--accent-bright); color:white; box-shadow:0 0 12px rgba(138,109,255,0.6); }
    .theme-btn { font-size:1.2rem; padding:0.4rem 0.8rem; }

    /* Messages */
    .messages {
      flex:1; overflow-y:auto; padding:2rem 2.5rem; display:flex; flex-direction:column; gap:1.5rem;
      background:transparent; scroll-behavior:smooth; position:relative;
    }
    .message {
      max-width:75%; padding:1rem 1.5rem; border-radius:20px; line-height:1.6;
      word-wrap:break-word; font-size:0.95rem; animation:fadeInUp 0.3s ease; position:relative;
    }
    .message.user {
      align-self:flex-end; background:var(--user-bg); color:white;
      border-bottom-right-radius:6px; border:1px solid rgba(138,109,255,0.6);
      box-shadow:0 8px 32px rgba(0,0,0,0.3), 0 0 10px var(--border-glow);
    }
    .message.assistant {
      align-self:flex-start; background:var(--assistant-bg); color:var(--text-primary);
      max-width:100%; padding:0 1.5rem; margin:0.5rem 0; border:none; box-shadow:none;
    }
    .message img.chat-img { max-width:100%; border-radius:10px; margin:0.5rem 0; max-height:300px; object-fit:cover; display:block; cursor:pointer; transition:transform 0.2s; }
    .message img.chat-img:hover { transform:scale(1.02); }
    .message pre { background:rgba(0,0,0,0.35); padding:2.5rem 0.8rem 0.8rem; border-radius:10px; overflow:auto; margin:0.5rem 0; border:1px solid var(--border-glow); position:relative; white-space:pre; word-wrap:normal; }
    .message code { font-family:'JetBrains Mono', monospace; font-size:0.85em; }
    .copy-code-btn { position:sticky; top:8px; right:8px; float:right; z-index:5; background:var(--accent); border:none; color:white; padding:0.3rem 0.6rem; border-radius:6px; font-size:0.75rem; cursor:pointer; box-shadow:0 0 8px rgba(138,109,255,0.6); }
    .copy-code-btn:hover { background:var(--accent-bright); }
    .message-actions { display:flex; gap:0.4rem; margin-top:0.7rem; opacity:0; transition:opacity 0.2s; }
    .message.assistant:hover .message-actions { opacity:1; }
    @media (pointer: coarse) { .message-actions { opacity:1; } }
    .message-actions button { background:rgba(22,24,45,0.7); border:1px solid var(--border-glow); color:var(--text-secondary); padding:0.3rem 0.7rem; border-radius:8px; font-size:0.8rem; }
    .message-actions button:hover { background:var(--accent); border-color:var(--accent-bright); color:white; box-shadow:0 0 8px rgba(138,109,255,0.6); }
    .like-btn.liked, .dislike-btn.disliked { background:var(--accent); color:white; border-color:var(--accent-bright); }

    .typing { align-self:flex-start; background:transparent; padding:0.8rem 1.5rem; display:flex; gap:0.3rem; }
    .typing span { width:8px; height:8px; background:var(--accent-bright); border-radius:50%; animation:bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay:0.2s; } .typing span:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-8px); } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    /* Scroll to bottom button */
    .scroll-bottom-btn {
      position: sticky; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); border: none; color: white; width: 40px; height: 40px;
      border-radius: 50%; font-size: 1.4rem; display: none; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 0 15px rgba(138,109,255,0.5); z-index: 10; margin: 0 auto;
    }
    .scroll-bottom-btn.visible { display: flex; }

    .input-wrapper { border-top:1px solid var(--border-glow); padding:0.8rem 2.5rem 1.5rem; background:transparent; backdrop-filter:blur(8px); position:relative; }
    .image-previews { display:flex; gap:8px; flex-wrap:wrap; padding-bottom:0.5rem; }
    .preview-thumb { position:relative; width:56px; height:56px; border-radius:8px; border:2px solid var(--accent); overflow:hidden; cursor:pointer; box-shadow:0 0 10px rgba(138,109,255,0.4); }
    .preview-thumb img { width:100%; height:100%; object-fit:cover; }
    .preview-thumb .remove-thumb { position:absolute; top:-4px; right:-4px; background:#ff4d4d; color:white; border:none; width:18px; height:18px; border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; }
    .input-area { display:flex; gap:0.5rem; align-items:flex-end; position:relative; }
    .tool-btn, .send-btn { height:52px; border-radius:14px; font-size:0.95rem; }
    .plus-toggle {
      background:var(--accent); border:none; color:white; width:52px; height:52px; border-radius:50%;
      font-size:1.8rem; display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 15px rgba(138,109,255,0.6); flex-shrink:0;
    }
    .plus-toggle:hover { background:var(--accent-bright); box-shadow:0 0 25px rgba(138,109,255,0.8); transform:scale(1.05); }
    .input-area textarea {
      flex:1; padding:0.9rem 1.2rem; background:var(--input-bg); border:1px solid var(--border-glow);
      border-radius:14px; color:var(--text-primary); resize:none; outline:none;
      min-height:52px; max-height:140px; font-size:0.95rem;
    }
    .input-area textarea:focus { border-color:var(--accent-bright); box-shadow:0 0 12px rgba(138,109,255,0.4); }
    .send-btn { background:linear-gradient(135deg, #8a6dff, #a78bfa); border:none; color:white; padding:0 1.8rem; font-weight:600; box-shadow:0 0 15px rgba(138,109,255,0.5); }
    .send-btn:hover { background:linear-gradient(135deg, #9b7efc, #b590ff); box-shadow:0 0 25px rgba(138,109,255,0.8); transform:translateY(-2px); }
    .send-btn:disabled { opacity:0.6; pointer-events:none; }

    .plus-menu {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 1rem; background: var(--bg-glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border-glow); border-radius: 24px; padding: 0.8rem 1.2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), var(--neon-glow); z-index: 50;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateX(-50%) translateY(10px);
    }
    .plus-menu.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .plus-menu-item { display:flex; flex-direction:column; align-items:center; gap:0.3rem; color:var(--text-secondary); font-size:0.75rem; cursor:pointer; transition:color 0.2s; background:none; border:none; padding:0.3rem 0.5rem; border-radius:12px; }
    .plus-menu-item:hover { color:var(--accent-bright); background:rgba(138,109,255,0.2); }
    .plus-menu-item .icon { font-size:1.3rem; }

    .footer-note { padding:0.6rem 2.5rem; text-align:center; font-size:0.75rem; color:var(--text-muted); border-top:1px solid var(--border-glow); background:transparent; backdrop-filter:blur(5px); }

    /* Lock overlay */
    .lock-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:15; gap:1rem; }
    .pin-input-wrapper { position:relative; display:flex; align-items:center; }
    .pin-input-wrapper input { background:var(--input-bg); border:1px solid var(--border-glow); color:var(--text-primary); padding:0.8rem 2.5rem 0.8rem 0.8rem; border-radius:10px; text-align:center; font-size:1.2rem; width:150px; }
    .pin-input-wrapper .toggle-pin { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-secondary); font-size:1.2rem; cursor:pointer; padding:0.2rem; }
    .lock-overlay button { background:var(--accent); border:none; color:white; padding:0.7rem 1.5rem; border-radius:12px; font-weight:600; box-shadow:var(--neon-glow); }
    .lock-overlay .error { color:#ff6b6b; font-size:0.9rem; }

    /* PIN modal */
    .pin-modal-content { background:var(--bg-glass); border:1px solid var(--border-glow); border-radius:20px; padding:2rem; text-align:center; max-width:300px; box-shadow:var(--neon-glow); }
    .pin-modal-content p { margin-bottom:1rem; color:var(--text-primary); }
    .pin-modal-content .pin-input-wrapper { margin-bottom:1rem; }
    .pin-modal-content button { background:var(--accent); border:none; color:white; padding:0.7rem 1.5rem; border-radius:12px; font-weight:600; box-shadow:var(--neon-glow); margin:0 0.3rem; }
    .pin-modal-content button.cancel { background:#444; }
    .pin-modal-content .error { color:#ff6b6b; margin-top:0.5rem; }

    /* Modals */
    .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s; }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal-box { background:var(--bg-glass); border:1px solid var(--border-glow); border-radius:20px; padding:2rem; text-align:center; max-width:320px; box-shadow:var(--neon-glow); }
    .modal-box p { margin-bottom:1.5rem; color:var(--text-primary); }
    .modal-buttons { display:flex; justify-content:center; gap:1rem; }
    .modal-buttons button { padding:0.7rem 1.5rem; border:1px solid var(--border-glow); border-radius:12px; background:rgba(22,24,45,0.6); color:var(--text-primary); font-weight:600; }
    .modal-buttons button.confirm-delete { background:#ff4444; border-color:#ff4444; color:white; }

    .crop-modal-content { display:flex; flex-direction:column; align-items:center; background:#1a1d27; border-radius:20px; padding:1rem; max-width:95vw; max-height:95vh; width:800px; }
    .crop-container { width:100%; height:60vh; max-height:500px; background:#000; border-radius:12px; overflow:hidden; }
    .camera-modal-content { display:flex; flex-direction:column; align-items:center; background:#1a1d27; border-radius:20px; padding:1rem; }
    video { width:100%; max-width:400px; border-radius:10px; }
    .lightbox-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:200; display:flex; align-items:center; justify-content:center; cursor:zoom-out; }
    .lightbox-overlay img { max-width:90vw; max-height:90vh; border-radius:12px; box-shadow:0 0 30px rgba(138,109,255,0.5); }

    @media (max-width:768px) {
      .sidebar { position:absolute; left:0; top:0; height:100%; z-index:40; width:min(260px, 80vw); }
      .sidebar.hidden { transform:translateX(-100%); }
      .header { padding:0.8rem 1rem; }
      .header h1 a { font-size:1.3rem; }
      .messages { padding:1.2rem 1rem; gap:1rem; }
      .message.user { max-width:92%; padding:0.8rem 1rem; }
      .message.assistant { padding:0 0.8rem; }
      .input-wrapper { padding:0.5rem 0.8rem 0.8rem; }
      .plus-menu { bottom:60px; padding:0.6rem 0.8rem; gap:0.5rem; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <h2><a href="https://vexelai-zeta.vercel.app/">◈ Vexel AI</a></h2>
      <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div class="sidebar-tools">
      <input type="text" class="search-box" placeholder="🔍 Search chats..." id="searchInput" oninput="filterChats()">
      <button class="incognito-toggle" id="incognitoToggle" onclick="toggleIncognito()" title="Incognito Mode">🕶️</button>
      <button class="bulk-toggle-btn" id="bulkToggleBtn" onclick="toggleBulkMode()">🗑️ Bulk Delete</button>
    </div>
  </div>
  <div class="chat-list" id="chatList">
    <!-- Bulk delete button appears here -->
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <p>Are you sure you want to delete this chat?</p>
    <div class="modal-buttons">
      <button onclick="closeDeleteModal()">Cancel</button>
      <button class="confirm-delete" id="confirmDeleteBtn">Yes, delete</button>
    </div>
  </div>
</div>

<!-- Bulk delete confirmation modal -->
<div class="modal-overlay" id="bulkDeleteModal">
  <div class="modal-box">
    <p id="bulkDeleteModalText">Are you sure you want to delete 3 chats?</p>
    <div class="modal-buttons">
      <button onclick="closeBulkDeleteModal()">Cancel</button>
      <button class="confirm-delete" id="confirmBulkDeleteBtn">Yes, delete</button>
    </div>
  </div>
</div>

<!-- Crop Modal -->
<div class="modal-overlay" id="cropModal">
  <div class="crop-modal-content">
    <div class="crop-container"><img id="cropImage" /></div>
    <div class="crop-buttons">
      <button onclick="applyCrop()">Crop & Save</button>
      <button onclick="cancelCrop()">Cancel</button>
    </div>
  </div>
</div>

<!-- Camera Modal -->
<div class="modal-overlay" id="cameraModal">
  <div class="camera-modal-content">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="crop-buttons" style="margin-top:1rem;">
      <button onclick="capturePhoto()">📸 Capture</button>
      <button onclick="closeCamera()">Cancel</button>
      <button id="torchBtn" onclick="toggleTorch()">💡</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox-overlay" style="display:none" onclick="this.style.display='none'">
  <img id="lightboxImg" src="" />
</div>

<!-- PIN Modal -->
<div class="modal-overlay" id="pinModal">
  <div class="pin-modal-content">
    <p id="pinModalTitle">Set a 4-digit PIN to lock this chat:</p>
    <div class="pin-input-wrapper">
      <input type="password" id="newPinInput" maxlength="4" inputmode="numeric" placeholder="PIN" />
      <button class="toggle-pin" onclick="toggleNewPinVisibility()">👁️</button>
    </div>
    <div class="error" id="pinError"></div>
    <div style="display:flex; justify-content:center; gap:1rem;">
      <button class="cancel" onclick="closePinModal()">Cancel</button>
      <button id="confirmPinBtn">Set PIN</button>
    </div>
  </div>
</div>

<!-- Main Chat Area -->
<div class="main-area">
  <div class="header" id="mainHeader">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>
      <h1><a href="https://vexelai-zeta.vercel.app/">Vexel AI</a></h1>
    </div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleTheme()">🌙 Theme</button>
      <button onclick="downloadChat()">⬇️ Download Chat</button>
      <button onclick="shareChat()">📋 Share Chat</button>
      <button onclick="clearCurrentChat()">🗑️ Clear Chat</button>
      <button id="lockChatBtn" onclick="toggleLockChat()">🔒 Lock</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-wrapper">
    <div class="image-previews" id="imagePreviews"></div>
    <input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleImageSelection(event)">
    <input type="file" id="pdfInput" accept="application/pdf" hidden onchange="handlePDFSelection(event)">

    <div class="input-area">
      <button class="plus-toggle" id="plusToggle" onclick="togglePlusMenu()">+</button>
      <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <div class="plus-menu" id="plusMenu">
      <div class="plus-menu-item" onclick="document.getElementById('imageInput').click(); togglePlusMenu();">
        <span class="icon">📎</span><span>Images</span>
      </div>
      <div class="plus-menu-item" onclick="document.getElementById('pdfInput').click(); togglePlusMenu();">
        <span class="icon">📄</span><span>PDF</span>
      </div>
      <div class="plus-menu-item" id="micMenuItem" onclick="startVoiceInput(); togglePlusMenu();" style="display:none;">
        <span class="icon">🎤</span><span>Voice</span>
      </div>
      <div class="plus-menu-item" onclick="openCamera(); togglePlusMenu();">
        <span class="icon">📷</span><span>Camera</span>
      </div>
      <div class="plus-menu-item" onclick="generateImage(); togglePlusMenu();">
        <span class="icon">🎨</span><span>Create Image</span>
      </div>
    </div>
  </div>
  <div class="footer-note">Vexel is an AI and can make mistakes. Check important info.</div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // ========== DOM refs ==========
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewsContainer = document.getElementById('imagePreviews');
  const imageInput = document.getElementById('imageInput');
  const pdfInput = document.getElementById('pdfInput');
  const micMenuItem = document.getElementById('micMenuItem');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menuToggle');
  const mainHeader = document.getElementById('mainHeader');
  const incognitoToggle = document.getElementById('incognitoToggle');
  const lockChatBtn = document.getElementById('lockChatBtn');
  const plusMenu = document.getElementById('plusMenu');
  const plusToggle = document.getElementById('plusToggle');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const pinModal = document.getElementById('pinModal');
  const newPinInput = document.getElementById('newPinInput');
  const confirmPinBtn = document.getElementById('confirmPinBtn');
  const pinErrorEl = document.getElementById('pinError');
  const pinModalTitle = document.getElementById('pinModalTitle');
  const bulkToggleBtn = document.getElementById('bulkToggleBtn');
  const bulkDeleteModal = document.getElementById('bulkDeleteModal');
  const bulkDeleteModalText = document.getElementById('bulkDeleteModalText');
  const confirmBulkDeleteBtn = document.getElementById('confirmBulkDeleteBtn');
  const torchBtn = document.getElementById('torchBtn');

  let isWaiting = false;
  let selectedImages = [];
  let allChats = [];
  let activeChatId = null;
  let chatHistory = [];
  let lastUserPrompt = null;
  let lastUserParts = null;
  let pendingDeleteChatId = null;
  let isIncognito = false;
  let recognition = null;
  let isRecording = false;
  let currentCropIndex = null;
  let cropper = null;
  let cameraStream = null;
  let unlockedChats = new Set();
  let pendingLockChatId = null;
  let pendingLockReason = '';
  let isBulkMode = false;
  let selectedChats = new Set();
  let scrollBottomBtn = null;

  // ========== INIT ==========
  window.addEventListener('load', () => {
    loadAllChats();
    if (allChats.length === 0) {
      createNewChat(true);
    } else {
      const storedId = localStorage.getItem('vexel_activeChatId');
      if (storedId && allChats.some(c => c.id === storedId)) {
        activeChatId = storedId;
      } else {
        activeChatId = allChats[0].id;
        localStorage.setItem('vexel_activeChatId', activeChatId);
      }
      loadActiveChat();
    }
    renderChatList();
    updateThemeIcon();
    handleResponsiveSidebar();
    updateLockButtonState();
    promptInput.focus();

    // Scroll to bottom button
    scrollBottomBtn = document.createElement('button');
    scrollBottomBtn.className = 'scroll-bottom-btn';
    scrollBottomBtn.innerHTML = '⬇';
    scrollBottomBtn.onclick = () => messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: 'smooth' });
    messagesDiv.appendChild(scrollBottomBtn);
    messagesDiv.addEventListener('scroll', () => {
      const atBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 50;
      scrollBottomBtn.classList.toggle('visible', !atBottom);
    });

    window.addEventListener('resize', () => {
      handleResponsiveSidebar();
      updateToggleButtonVisibility();
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', executeDelete);
    confirmBulkDeleteBtn.addEventListener('click', executeBulkDelete);

    // PIN modal confirm
    confirmPinBtn.addEventListener('click', () => {
      const pin = newPinInput.value.trim();
      if (!/^\d{4}$/.test(pin)) {
        pinErrorEl.textContent = 'PIN must be exactly 4 digits.';
        return;
      }
      if (pendingLockChatId) {
        const chat = allChats.find(c => c.id === pendingLockChatId);
        if (!chat) return;
        if (pendingLockReason === 'bulk-select') {
          if (sha256(pin) !== chat.lockHash) {
            pinErrorEl.textContent = 'Wrong PIN.';
            return;
          }
          selectedChats.add(pendingLockChatId);
          closePinModal();
          renderChatList();
          updateBulkDeleteButton();
          return;
        }
        // Normal lock/unlock
        if (chat.lockHash) {
          if (sha256(pin) !== chat.lockHash) {
            pinErrorEl.textContent = 'Wrong PIN.';
            return;
          }
          chat.lockHash = null;
          unlockedChats.delete(pendingLockChatId);
        } else {
          chat.lockHash = sha256(pin);
          unlockedChats.delete(pendingLockChatId);
        }
        saveAllChats();
        if (pendingLockChatId === activeChatId) {
          if (chat.lockHash) showLockOverlay();
          else { removeLockOverlay(); renderAllMessages(); }
        }
      }
      closePinModal();
      updateLockButtonState();
      renderChatList();
    });

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = event => {
        promptInput.value = promptInput.value + ' ' + event.results[0][0].transcript;
        promptInput.focus();
        stopRecordingUI();
      };
      recognition.onerror = () => stopRecordingUI();
      recognition.onend = () => stopRecordingUI();
      micMenuItem.style.display = 'flex';
    }

    messagesDiv.addEventListener('click', (e) => {
      if (e.target.classList.contains('chat-img')) {
        lightboxImg.src = e.target.src;
        lightbox.style.display = 'flex';
      }
    });

    document.addEventListener('click', (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusToggle) {
        plusMenu.classList.remove('active');
      }
    });
  });

  function toggleNewPinVisibility() {
    const input = document.getElementById('newPinInput');
    const btn = input.nextElementSibling;
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
  }
  function toggleLockPinVisibility(btn) {
    const input = btn.previousElementSibling;
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
  }
  function togglePlusMenu() { plusMenu.classList.toggle('active'); }

  function handleResponsiveSidebar() {
    if (window.innerWidth <= 768) sidebar.classList.add('hidden');
    else sidebar.classList.remove('hidden');
    updateToggleButtonVisibility();
  }
  function updateToggleButtonVisibility() {
    menuToggle.classList.toggle('hidden', !sidebar.classList.contains('hidden'));
  }
  function toggleSidebar() {
    sidebar.classList.toggle('hidden');
    updateToggleButtonVisibility();
  }

  // ========== CHATS ==========
  function loadAllChats() {
    const stored = localStorage.getItem('vexel_chats');
    allChats = stored ? JSON.parse(stored) : [];
  }
  function saveAllChats() {
    if (!isIncognito) localStorage.setItem('vexel_chats', JSON.stringify(allChats));
  }
  function isChatLocked(chatId) {
    if (!chatId) return false;
    const chat = allChats.find(c => c.id === chatId);
    return chat && chat.lockHash && !unlockedChats.has(chatId);
  }
  function loadActiveChat() {
    if (isIncognito) {
      chatHistory = [];
      renderAllMessages();
      removeLockOverlay();
      return;
    }
    const chat = allChats.find(c => c.id === activeChatId);
    if (!chat) {
      if (allChats.length > 0) {
        activeChatId = allChats[0].id;
        localStorage.setItem('vexel_activeChatId', activeChatId);
        loadActiveChat();
        renderChatList();
      } else {
        createNewChat(true);
      }
      return;
    }
    chatHistory = chat.messages || [];
    if (isChatLocked(activeChatId)) {
      showLockOverlay();
    } else {
      removeLockOverlay();
      renderAllMessages();
    }
    updateLockButtonState();
    loadDraft(activeChatId);
  }
  function createNewChat(switchTo = true) {
    if (isIncognito) {
      chatHistory = [];
      activeChatId = null;
      renderAllMessages();
      clearDraftUI();
      lastUserPrompt = null; lastUserParts = null;
      return;
    }
    const id = Date.now().toString(36) + Math.random().toString(36).substr(2,5);
    const newChat = { id, title: 'New Chat', createdAt: Date.now(), messages: [], lockHash: null };
    allChats.unshift(newChat);
    saveAllChats();
    if (switchTo) {
      saveDraft(activeChatId);
      activeChatId = id;
      localStorage.setItem('vexel_activeChatId', id);
      chatHistory = [];
      renderAllMessages();
      renderChatList();
      clearDraftUI();
      updateLockButtonState();
      loadDraft(activeChatId);
    } else {
      renderChatList();
    }
  }
  function switchToChat(chatId) {
    if (isIncognito) toggleIncognito(false);
    if (activeChatId && activeChatId !== chatId) {
      const prevChat = allChats.find(c => c.id === activeChatId);
      if (prevChat && prevChat.lockHash && unlockedChats.has(activeChatId)) {
        unlockedChats.delete(activeChatId);
      }
    }
    saveDraft(activeChatId);
    if (activeChatId) {
      const currentChat = allChats.find(c => c.id === activeChatId);
      if (currentChat) currentChat.messages = chatHistory;
      saveAllChats();
    }
    activeChatId = chatId;
    localStorage.setItem('vexel_activeChatId', chatId);
    loadActiveChat();
    renderChatList();
    lastUserPrompt = null; lastUserParts = null;
    if (window.innerWidth <= 768) {
      sidebar.classList.add('hidden');
      updateToggleButtonVisibility();
    }
    messagesDiv.style.overflow = 'auto';
  }
  function deleteChat(chatId, event) {
    event.stopPropagation();
    const chat = allChats.find(c => c.id === chatId);
    if (!chat) return;
    if (chat.lockHash && !unlockedChats.has(chatId)) {
      pendingDeleteChatId = chatId;
      openPinModalForDelete(chatId);
      return;
    }
    pendingDeleteChatId = chatId;
    document.getElementById('deleteModal').classList.add('active');
  }
  function openPinModalForDelete(chatId) {
    pinModalTitle.textContent = 'Enter PIN to delete this locked chat:';
    pendingDeleteChatId = chatId;
    newPinInput.value = '';
    newPinInput.type = 'password';
    newPinInput.nextElementSibling.textContent = '👁️';
    pinErrorEl.textContent = '';
    pinModal.classList.add('active');
    confirmPinBtn.onclick = () => {
      const pin = newPinInput.value.trim();
      const chat = allChats.find(c => c.id === pendingDeleteChatId);
      if (!chat || sha256(pin) !== chat.lockHash) {
        pinErrorEl.textContent = 'Wrong PIN.';
        return;
      }
      unlockedChats.add(pendingDeleteChatId);
      closePinModal();
      document.getElementById('deleteModal').classList.add('active');
    };
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
    pendingDeleteChatId = null;
  }
  function executeDelete() {
    if (!pendingDeleteChatId) return;
    allChats = allChats.filter(c => c.id !== pendingDeleteChatId);
    if (activeChatId === pendingDeleteChatId) {
      activeChatId = allChats[0]?.id;
      localStorage.setItem('vexel_activeChatId', activeChatId || '');
      localStorage.removeItem(`vexel_draft_${pendingDeleteChatId}`);
    }
    unlockedChats.delete(pendingDeleteChatId);
    saveAllChats();
    if (allChats.length === 0) createNewChat(true);
    else loadActiveChat();
    renderChatList();
    closeDeleteModal();
    pendingDeleteChatId = null;
  }

  // ========== BULK DELETE ==========
  function toggleBulkMode() {
    isBulkMode = !isBulkMode;
    sidebar.classList.toggle('bulk-mode', isBulkMode);
    bulkToggleBtn.classList.toggle('active', isBulkMode);
    selectedChats.clear();
    renderChatList();
    updateBulkDeleteButton();
    const existing = document.getElementById('bulkDeleteConfirm');
    if (existing) existing.remove();
  }

  function handleBulkCheck(chatId, event) {
    event.stopPropagation();
    const chat = allChats.find(c => c.id === chatId);
    if (!chat) return;
    if (chat.lockHash && !unlockedChats.has(chatId)) {
      pendingLockChatId = chatId;
      pendingLockReason = 'bulk-select';
      openPinModalForBulk();
      return;
    }
    if (selectedChats.has(chatId)) {
      selectedChats.delete(chatId);
    } else {
      selectedChats.add(chatId);
    }
    renderChatList();
    updateBulkDeleteButton();
  }

  function openPinModalForBulk() {
    pinModalTitle.textContent = 'Enter PIN to select this locked chat:';
    newPinInput.value = '';
    newPinInput.type = 'password';
    newPinInput.nextElementSibling.textContent = '👁️';
    pinErrorEl.textContent = '';
    pinModal.classList.add('active');
  }

  function updateBulkDeleteButton() {
    const existing = document.getElementById('bulkDeleteConfirm');
    if (existing) existing.remove();
    if (!isBulkMode || selectedChats.size === 0) return;

    const btn = document.createElement('button');
    btn.id = 'bulkDeleteConfirm';
    btn.className = 'bulk-delete-confirm visible';
    btn.textContent = `Delete All (${selectedChats.size})`;
    btn.onclick = () => {
      bulkDeleteModalText.textContent = `Are you sure you want to delete ${selectedChats.size} chats?`;
      bulkDeleteModal.classList.add('active');
    };
    chatListEl.appendChild(btn);
  }

  function closeBulkDeleteModal() {
    bulkDeleteModal.classList.remove('active');
  }

  function executeBulkDelete() {
    const ids = Array.from(selectedChats);
    ids.forEach(id => {
      allChats = allChats.filter(c => c.id !== id);
      if (activeChatId === id) {
        activeChatId = allChats[0]?.id;
        localStorage.setItem('vexel_activeChatId', activeChatId || '');
        localStorage.removeItem(`vexel_draft_${id}`);
      }
      unlockedChats.delete(id);
    });
    selectedChats.clear();
    saveAllChats();
    if (allChats.length === 0) createNewChat(true);
    else loadActiveChat();
    renderChatList();
    updateBulkDeleteButton();
    closeBulkDeleteModal();
    toggleBulkMode();
  }

  function renderChatList(filteredChats = null) {
    if (isIncognito) { chatListEl.innerHTML = ''; return; }
    const chats = filteredChats || allChats;
    chatListEl.innerHTML = '';
    if (chats.length === 0) {
      if (allChats.length === 0 && !isIncognito) createNewChat(true);
      return;
    }
    chats.forEach(chat => {
      const locked = chat.lockHash && !unlockedChats.has(chat.id);
      const isSelected = selectedChats.has(chat.id);
      const item = document.createElement('div');
      item.className = `chat-list-item${chat.id === activeChatId ? ' active' : ''}`;
      item.innerHTML = `
        <span class="title">${locked ? '🔒 ' : ''}${escapeHtml(chat.title)}</span>
        <div class="chat-actions">
          <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="handleBulkCheck('${chat.id}', event)" />
          <button class="rename-btn" title="Rename">✏️</button>
          <button class="lock-btn" title="${locked ? 'Unlock' : 'Lock'}">${locked ? '🔓' : '🔒'}</button>
          <button class="delete-chat" title="Delete">🗑️</button>
        </div>
      `;
      item.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        switchToChat(chat.id);
      });
      item.querySelector('.delete-chat').addEventListener('click', (e) => deleteChat(chat.id, e));
      item.querySelector('.lock-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        switchToChat(chat.id);
        toggleLockChat();
      });
      item.querySelector('.rename-btn').addEventListener('click', (e) => renameChat(chat.id, e));
      chatListEl.appendChild(item);
    });
    if (isBulkMode && selectedChats.size > 0) {
      updateBulkDeleteButton();
    }
  }

  function filterChats() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (!q) renderChatList();
    else renderChatList(allChats.filter(chat => chat.title.toLowerCase().includes(q)));
  }
  function renameChat(chatId, event) {
    event.stopPropagation();
    const chat = allChats.find(c => c.id === chatId);
    if (!chat) return;
    const newName = prompt('Enter new name for this chat:', chat.title);
    if (newName && newName.trim()) {
      chat.title = newName.trim().slice(0, 50);
      saveAllChats();
      renderChatList();
    }
  }
  function toggleIncognito(forceState = null) {
    const newState = forceState !== null ? forceState : !isIncognito;
    if (newState === isIncognito) return;
    isIncognito = newState;
    if (isIncognito) {
      if (activeChatId) {
        const currentChat = allChats.find(c => c.id === activeChatId);
        if (currentChat) currentChat.messages = chatHistory;
        saveAllChats();
      }
      activeChatId = null;
      chatHistory = [];
      renderAllMessages();
      clearDraftUI();
      mainHeader.classList.add('incognito');
      incognitoToggle.classList.add('active');
      renderChatList();
    } else {
      mainHeader.classList.remove('incognito');
      incognitoToggle.classList.remove('active');
      const storedId = localStorage.getItem('vexel_activeChatId');
      if (storedId && allChats.some(c => c.id === storedId)) activeChatId = storedId;
      else if (allChats.length > 0) { activeChatId = allChats[0].id; localStorage.setItem('vexel_activeChatId', activeChatId); }
      else createNewChat(true);
      loadActiveChat();
      renderChatList();
      clearDraftUI();
      loadDraft(activeChatId);
    }
  }
  function escapeHtml(text) { return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ========== LOCKING ==========
  function showLockOverlay() {
    removeLockOverlay();
    messagesDiv.style.overflow = 'hidden';
    const overlay = document.createElement('div');
    overlay.className = 'lock-overlay';
    overlay.id = 'lockOverlay';
    overlay.innerHTML = `
      <p>🔒 This chat is locked</p>
      <div class="pin-input-wrapper">
        <input type="password" id="lockPinInput" maxlength="4" inputmode="numeric" placeholder="Enter PIN" />
        <button class="toggle-pin" onclick="toggleLockPinVisibility(this)">👁️</button>
      </div>
      <button id="unlockBtn">Unlock</button>
      <p class="error" id="lockError"></p>
    `;
    messagesDiv.appendChild(overlay);
    document.getElementById('unlockBtn').addEventListener('click', () => attemptUnlock());
    document.getElementById('lockPinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptUnlock(); });
  }
  function attemptUnlock() {
    const pin = document.getElementById('lockPinInput').value.trim();
    const chat = allChats.find(c => c.id === activeChatId);
    if (!chat || !chat.lockHash) return;
    if (sha256(pin) === chat.lockHash) {
      unlockedChats.add(activeChatId);
      removeLockOverlay();
      renderAllMessages();
      updateLockButtonState();
    } else {
      document.getElementById('lockError').textContent = 'Wrong PIN.';
    }
  }
  function removeLockOverlay() {
    const overlay = document.getElementById('lockOverlay');
    if (overlay) overlay.remove();
    messagesDiv.style.overflow = 'auto';
  }
  function openPinModal(chatId, isRemove = false) {
    pendingLockChatId = chatId;
    pendingLockReason = '';
    pinModalTitle.textContent = isRemove ? 'Enter PIN to remove lock:' : 'Set a 4-digit PIN to lock this chat:';
    newPinInput.value = '';
    newPinInput.type = 'password';
    newPinInput.nextElementSibling.textContent = '👁️';
    pinErrorEl.textContent = '';
    pinModal.classList.add('active');
  }
  function closePinModal() {
    pinModal.classList.remove('active');
    pendingLockChatId = null;
  }
  function toggleLockChat() {
    if (!activeChatId || isIncognito) return;
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat.lockHash) {
      openPinModal(activeChatId, true);
    } else {
      openPinModal(activeChatId, false);
    }
  }
  function updateLockButtonState() {
    if (!activeChatId || isIncognito) {
      lockChatBtn.style.display = 'none';
      return;
    }
    lockChatBtn.style.display = 'inline-block';
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat && chat.lockHash) {
      lockChatBtn.textContent = '🔓 Unlock';
      lockChatBtn.title = 'Remove lock';
    } else {
      lockChatBtn.textContent = '🔒 Lock';
      lockChatBtn.title = 'Lock this chat';
    }
  }

  // ========== DRAFT ==========
  function saveDraft(chatId) {
    if (!chatId || isIncognito) return;
    const draft = { prompt: promptInput.value, images: selectedImages.map(img => ({ mimeType: img.mimeType, data: img.data, previewUrl: img.previewUrl })) };
    localStorage.setItem(`vexel_draft_${chatId}`, JSON.stringify(draft));
  }
  function loadDraft(chatId) {
    if (isIncognito) { clearDraftUI(); return; }
    const stored = localStorage.getItem(`vexel_draft_${chatId}`);
    if (stored) {
      try {
        const draft = JSON.parse(stored);
        promptInput.value = draft.prompt || '';
        selectedImages = (draft.images || []).map(img => ({ ...img, id: Date.now()+Math.random() }));
        renderImagePreviews();
      } catch(e) { clearDraftUI(); }
    } else clearDraftUI();
  }
  function clearDraftUI() {
    promptInput.value = '';
    selectedImages = [];
    renderImagePreviews();
  }

  // ========== RENDERING (INSTANT, NO TYPEWRITER) ==========
  function renderImagePreviews() {
    imagePreviewsContainer.innerHTML = '';
    selectedImages.forEach((img, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'preview-thumb';
      thumb.innerHTML = `<img src="${img.previewUrl}" /><button class="remove-thumb">✕</button>`;
      thumb.querySelector('img').addEventListener('click', (e) => { e.stopPropagation(); openCropModal(index); });
      thumb.querySelector('.remove-thumb').addEventListener('click', (e) => { e.stopPropagation(); selectedImages.splice(index,1); renderImagePreviews(); saveDraft(activeChatId); });
      imagePreviewsContainer.appendChild(thumb);
    });
  }
  function renderAllMessages() {
    messagesDiv.innerHTML = '';
    if (chatHistory.length === 0) {
      renderMessage('assistant', '👋 Hello! I\'m Vexel. Ask me anything or upload files.', null, false, true);
    } else {
      chatHistory.forEach(msg => {
        const role = msg.role === 'model' ? 'assistant' : 'user';
        const textPart = msg.parts.find(p => p.text);
        const imageParts = msg.parts.filter(p => p.inline_data);
        let text = textPart ? textPart.text : '';
        let imgHtml = '';
        imageParts.forEach(part => {
          imgHtml += `<img src="data:${part.inline_data.mime_type};base64,${part.inline_data.data}" class="chat-img" />`;
        });
        renderMessage(role, text + imgHtml, null, false);
      });
      setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 50);
    }
  }

  function renderMessage(role, content, unused, smoothScroll = true, skipActions = false, skipTypewriter = false) {
    const div = document.createElement('div');
    div.className = `message ${role}`;

    if (role === 'assistant') {
      // Instantly render full message – no typewriter delay
      div.innerHTML = marked.parse(content);
      // Render KaTeX for math formulas
      renderMathInElement(div, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
      // Attach code copy buttons
      attachCodeCopyButtons(div);
      // Add action buttons (Copy, Regenerate, Like/Dislike)
      if (!skipActions) addMessageActions(div, content, false);
    } else {
      // User message
      div.innerHTML = content.replace(/\n/g, '<br>');
    }

    messagesDiv.appendChild(div);
    if (smoothScroll) messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function addMessageActions(div, content, skipActions) {
    if (skipActions) return;
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'message-actions';
    const copyBtn = document.createElement('button'); copyBtn.innerHTML = '📋 Copy'; copyBtn.onclick = () => { navigator.clipboard.writeText(content); copyBtn.textContent = '✅ Copied'; setTimeout(() => copyBtn.textContent = '📋 Copy', 2000); };
    const regenBtn = document.createElement('button'); regenBtn.innerHTML = '🔄 Regenerate'; regenBtn.onclick = () => regenerateResponse();
    const likeBtn = document.createElement('button'); likeBtn.className = 'like-btn'; likeBtn.innerHTML = '👍'; likeBtn.onclick = () => toggleFeedback('like', likeBtn);
    const dislikeBtn = document.createElement('button'); dislikeBtn.className = 'dislike-btn'; dislikeBtn.innerHTML = '👎'; dislikeBtn.onclick = () => toggleFeedback('dislike', dislikeBtn);
    actionsDiv.appendChild(copyBtn); actionsDiv.appendChild(regenBtn); actionsDiv.appendChild(likeBtn); actionsDiv.appendChild(dislikeBtn);
    div.appendChild(actionsDiv);
  }

  function attachCodeCopyButtons(container) {
    container.querySelectorAll('pre').forEach(pre => {
      if (!pre.querySelector('.copy-code-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-code-btn';
        btn.innerText = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.querySelector('code')?.innerText || '');
          btn.innerText = 'Copied!';
          setTimeout(() => btn.innerText = 'Copy', 2000);
        };
        pre.insertBefore(btn, pre.firstChild);
      }
    });
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  function removeTyping() { document.getElementById('typingIndicator')?.remove(); }

  // ========== IMAGE / PDF / VOICE / CAMERA / CROP ==========
  function handleImageSelection(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      if (selectedImages.length >= 4) { alert('Max 4 images'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = e.target.result.split(',')[1];
        selectedImages.push({ mimeType: file.type, data: base64, previewUrl: e.target.result, id: Date.now()+Math.random() });
        renderImagePreviews();
        saveDraft(activeChatId);
      };
      reader.readAsDataURL(file);
    });
    imageInput.value = '';
  }

  async function handlePDFSelection(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
      }
      promptInput.value = promptInput.value + '\n\n[PDF Content]:\n' + fullText.slice(0,5000);
    } catch(e) { alert('Failed to extract PDF text.'); }
    pdfInput.value = '';
  }

  function startVoiceInput() {
    if (!recognition) return;
    if (isRecording) { recognition.stop(); return; }
    isRecording = true;
    micMenuItem.querySelector('.icon').textContent = '🎙️';
    recognition.start();
  }

  function stopRecordingUI() {
    isRecording = false;
    const el = document.getElementById('micMenuItem');
    if (el) el.querySelector('.icon').textContent = '🎤';
  }

  async function openCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      cameraStream = stream;
      document.getElementById('cameraVideo').srcObject = stream;
      document.getElementById('cameraModal').classList.add('active');
    } catch (err) { alert('Camera access denied.'); }
  }

  function toggleTorch() {
    if (!cameraStream) return;
    const track = cameraStream.getVideoTracks()[0];
    if (!track) return;
    if ('torch' in track.getCapabilities()) {
      track.applyConstraints({ advanced: [{ torch: !track.getSettings().torch }] });
      torchBtn.textContent = track.getSettings().torch ? '💡✅' : '💡';
    } else {
      alert('Torch not supported.');
    }
  }

  function capturePhoto() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg');
    if (selectedImages.length >= 4) { alert('Max 4 images'); closeCamera(); return; }
    selectedImages.push({ mimeType: 'image/jpeg', data: dataUrl.split(',')[1], previewUrl: dataUrl, id: Date.now()+Math.random() });
    renderImagePreviews();
    saveDraft(activeChatId);
    closeCamera();
  }

  function closeCamera() {
    if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
    document.getElementById('cameraModal').classList.remove('active');
  }

  function openCropModal(index) {
    currentCropIndex = index;
    const img = selectedImages[index];
    document.getElementById('cropImage').src = img.previewUrl;
    document.getElementById('cropModal').classList.add('active');
    if (cropper) cropper.destroy();
    cropper = new Cropper(document.getElementById('cropImage'), {
      aspectRatio: NaN, viewMode: 1, autoCropArea: 0.8, responsive: true, background: false,
      zoomable: true, rotatable: true, scalable: true
    });
  }

  function applyCrop() {
    if (!cropper || currentCropIndex === null) return;
    const canvas = cropper.getCroppedCanvas();
    const dataUrl = canvas.toDataURL(selectedImages[currentCropIndex].mimeType);
    selectedImages[currentCropIndex].data = dataUrl.split(',')[1];
    selectedImages[currentCropIndex].previewUrl = dataUrl;
    cropper.destroy();
    cropper = null;
    document.getElementById('cropModal').classList.remove('active');
    renderImagePreviews();
    saveDraft(activeChatId);
  }

  function cancelCrop() {
    if (cropper) cropper.destroy();
    cropper = null;
    document.getElementById('cropModal').classList.remove('active');
    currentCropIndex = null;
  }

  // ========== IMAGE GENERATION ==========
  async function generateImage() {
    const description = promptInput.value.trim() || prompt('Describe the image you want to generate:');
    if (!description) return;
    renderMessage('user', description, null, true, false);
    chatHistory.push({ role: 'user', parts: [{ text: description }] });
    saveCurrentChatIfNeeded();

    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(description)}?width=512&height=512&nologo=true`;
    try {
      const tempDiv = document.createElement('div');
      tempDiv.className = 'typing';
      tempDiv.innerHTML = '<span></span><span></span><span></span>';
      messagesDiv.appendChild(tempDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const response = await fetch(url);
      const blob = await response.blob();
      const dataUrl = URL.createObjectURL(blob);
      tempDiv.remove();

      const imgMsg = document.createElement('div');
      imgMsg.className = 'message assistant';
      imgMsg.innerHTML = `<img src="${dataUrl}" class="chat-img" alt="Generated image" />`;
      messagesDiv.appendChild(imgMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        chatHistory.push({ role: 'model', parts: [{ inline_data: { mime_type: 'image/png', data: base64 } }] });
        saveCurrentChatIfNeeded();
      };
      reader.readAsDataURL(blob);
    } catch(err) { alert('Image generation failed.'); }
  }

  // ========== SHARE & DOWNLOAD ==========
  function shareChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `*${role}:* ${textPart.text}\n\n`;
    });
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
    const choice = confirm('Share via WhatsApp? Click OK for WhatsApp, Cancel to copy to clipboard.');
    if (choice) window.open(whatsappUrl, '_blank');
    else navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
  }
  function downloadChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `**${role}:** ${textPart.text}\n\n`;
    });
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vexel-chat-${Date.now()}.md`;
    a.click();
  }

  // ========== SEND MESSAGE ==========
  async function sendMessage(regenerating = false) {
    const prompt = promptInput.value.trim();
    if ((!prompt && selectedImages.length === 0 && !regenerating) || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    const userParts = [];
    if (!regenerating) {
      if (prompt) userParts.push({ text: prompt });
      selectedImages.forEach(img => userParts.push({ inline_data: { mime_type: img.mimeType, data: img.data } }));

      let combinedHtml = prompt ? prompt.replace(/\n/g, '<br>') : '';
      selectedImages.forEach(img => combinedHtml += `<img src="${img.previewUrl}" class="chat-img" />`);
      renderMessage('user', combinedHtml, null, true, false);

      promptInput.value = '';
      promptInput.style.height = '52px';
      selectedImages = [];
      renderImagePreviews();
      if (!isIncognito) saveDraft(activeChatId);
      lastUserPrompt = prompt;
      lastUserParts = userParts;
    } else {
      if (chatHistory.length > 0 && chatHistory[chatHistory.length-1].role === 'model') {
        chatHistory.pop();
        saveCurrentChatIfNeeded();
        const lastAssistant = messagesDiv.querySelector('.message.assistant:last-child');
        if (lastAssistant) lastAssistant.remove();
      }
    }

    showTyping();

    const payload = {
      prompt: regenerating ? (lastUserPrompt || '') : prompt,
      history: regenerating ? chatHistory : [...chatHistory, { role: 'user', parts: userParts }],
      images: regenerating ? (lastUserParts ? lastUserParts.filter(p => p.inline_data).map(p => ({ mimeType: p.inline_data.mime_type, data: p.inline_data.data })) : []) : []
    };

    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        renderMessage('assistant', `⚠️ **API Error:**\n${data.error?.message || JSON.stringify(data)}`);
      } else if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        renderMessage('assistant', reply, null, true, false, false);
        if (!regenerating) chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        saveCurrentChatIfNeeded();
        renderChatList();
      } else {
        renderMessage('assistant', '❌ Unexpected response format.');
      }
    } catch (err) {
      removeTyping();
      renderMessage('assistant', `🚨 Network error: ${err.message}`);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  function saveCurrentChatIfNeeded() { if (!isIncognito) saveCurrentChat(); }
  function saveCurrentChat() {
    if (!activeChatId || isIncognito) return;
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat) {
      chat.messages = chatHistory;
      if (chat.title === 'New Chat' && chatHistory.length > 0) {
        const firstUserMsg = chatHistory.find(m => m.role === 'user');
        if (firstUserMsg) {
          const textPart = firstUserMsg.parts.find(p => p.text);
          chat.title = textPart ? textPart.text.slice(0,30) : 'File Chat';
        }
      }
      saveAllChats();
      renderChatList();
    }
  }

  function regenerateResponse() { sendMessage(true); }

  function clearCurrentChat() {
    if (isWaiting) return;
    chatHistory = [];
    messagesDiv.innerHTML = '';
    renderMessage('assistant', '✨ Conversation cleared.', null, false, true);
    clearDraftUI();
    if (!isIncognito) saveCurrentChat();
  }

  function toggleFeedback(type, button) {
    button.classList.toggle(type === 'like' ? 'liked' : 'disliked');
    const feedback = JSON.parse(localStorage.getItem('vexel_feedback') || '{}');
    const idx = Array.from(document.querySelectorAll('.message.assistant')).indexOf(button.closest('.message'));
    const key = `${activeChatId||'incognito'}_${idx}`;
    feedback[key] = feedback[key] === type ? null : type;
    localStorage.setItem('vexel_feedback', JSON.stringify(feedback));
    const sibling = type === 'like' ? button.nextElementSibling : button.previousElementSibling;
    if (sibling) sibling.classList.remove('liked', 'disliked');
  }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    updateThemeIcon();
    localStorage.setItem('vexel_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  }
  function updateThemeIcon() {
    const btn = document.querySelector('.theme-btn');
    if (btn) btn.innerHTML = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  }
  (function() {
    if (localStorage.getItem('vexel_theme') === 'light') document.body.classList.add('light-mode');
    updateThemeIcon();
  })();

  promptInput.addEventListener('input', function() {
    this.style.height = '52px';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    if (!isIncognito && activeChatId) saveDraft(activeChatId);
  });
</script>
</body>
</html>
