<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI</title>

  <!-- Markdown library for nice formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #13151a; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
    .chat-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #1a1d27; }
    .header { background: #1f2230; border-bottom: 1px solid #2a2d3a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .header h1 { font-size: 1.5rem; font-weight: 600; color: #ffffff; letter-spacing: -0.3px; display: flex; align-items: center; gap: 0.5rem; }
    .header h1::before { content: '◈'; font-size: 1.4rem; color: #6d8aff; }
    .header-actions { display: flex; gap: 0.8rem; align-items: center; }
    .header-actions button { background: #2a2d3a; border: 1px solid #3a3d4a; color: #c0c5d0; padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s ease; }
    .header-actions button:hover { background: #343845; border-color: #5a5f72; color: #ffffff; }
    
    .messages { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; display: flex; flex-direction: column; gap: 1.5rem; background: #1a1d27; scroll-behavior: smooth; }
    .message { max-width: 75%; padding: 0.9rem 1.4rem; border-radius: 16px; line-height: 1.6; word-wrap: break-word; font-size: 0.95rem; animation: fadeIn 0.25s ease; }
    .message.user { align-self: flex-end; background: #2b3148; color: #ffffff; border-bottom-right-radius: 4px; border: 1px solid #3d4563; }
    .message.assistant { align-self: flex-start; background: #232734; color: #d0d5e0; border-bottom-left-radius: 4px; border: 1px solid #2e3347; }
    .message img.chat-img { max-width: 100%; border-radius: 8px; margin-bottom: 0.5rem; max-height: 300px; object-fit: cover; }
    
    .message pre { background: #11131a; padding: 2.5rem 0.8rem 0.8rem; border-radius: 8px; overflow-x: auto; margin: 0.5rem 0; border: 1px solid #2a2d3a; position: relative; }
    .message code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.85em; }
    .copy-btn { position: absolute; top: 8px; right: 8px; background: #2b3148; border: 1px solid #3d4563; color: #c0c5d0; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .copy-btn:hover { background: #3d4563; color: #fff; }
    
    .typing { align-self: flex-start; background: #232734; border: 1px solid #2e3347; padding: 0.7rem 1.4rem; border-radius: 16px; border-bottom-left-radius: 4px; display: flex; gap: 0.3rem; }
    .typing span { display: inline-block; width: 8px; height: 8px; background: #6d8aff; border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .input-wrapper { background: #1a1d27; border-top: 1px solid #2a2d3a; display: flex; flex-direction: column; padding: 0.5rem 2.5rem 1.5rem; flex-shrink: 0; }
    .image-preview-container { display: none; align-items: center; gap: 10px; padding-bottom: 0.5rem; }
    .image-preview-container img { height: 50px; border-radius: 6px; border: 1px solid #3d4563; }
    .remove-image-btn { background: #ff4d4d; border: none; color: white; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: flex; justify-content: center; align-items: center; }
    
    .input-area { display: flex; gap: 0.8rem; align-items: flex-end; }
    .attach-btn { background: #232734; border: 1px solid #2e3347; color: #c0c5d0; font-size: 1.2rem; padding: 0 1rem; border-radius: 12px; cursor: pointer; height: 52px; transition: all 0.2s; display: flex; justify-content: center; align-items: center; }
    .attach-btn:hover { background: #343845; color: white; }
    .input-area textarea { flex: 1; padding: 0.9rem 1.2rem; background: #232734; border: 1px solid #2e3347; border-radius: 12px; font-size: 0.95rem; font-family: inherit; resize: none; outline: none; color: #e0e0e0; transition: border-color 0.2s, background 0.2s; min-height: 52px; max-height: 140px; }
    .input-area textarea:focus { border-color: #6d8aff; background: #262b3a; }
    .input-area button.send-btn { background: #2b3148; border: 1px solid #3d4563; color: #ffffff; padding: 0 1.8rem; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; height: 52px; }
    .input-area button.send-btn:hover { background: #6d8aff; border-color: #6d8aff; }
    
    .footer-note { padding: 0.6rem 2.5rem 0.8rem; text-align: center; font-size: 0.75rem; color: #5a6070; background: #1a1d27; flex-shrink: 0; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #2e3347; border-radius: 10px; }
    
    @media (max-width: 700px) {
      .input-wrapper { padding: 0.5rem 1rem 1rem; }
      .messages { padding: 1.2rem 1rem; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h1>Vexel AI</h1>
    <div class="header-actions">
      <button onclick="clearChat()">🗑️ Clear</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-wrapper">
    <div class="image-preview-container" id="imagePreviewContainer">
      <img id="imagePreview" src="" alt="Preview" />
      <button class="remove-image-btn" onclick="removeImage()">✕</button>
    </div>

    <div class="input-area">
      <input type="file" id="fileInput" accept="image/*" hidden onchange="handleImageSelection(event)">
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach Image">📎</button>
      <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="footer-note">1000 Messages a day! &nbsp;·&nbsp; Supports Text & Images</div>
</div>

<script>
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewContainer = document.getElementById('imagePreviewContainer');
  const imagePreview = document.getElementById('imagePreview');
  const fileInput = document.getElementById('fileInput');

  let isWaiting = false;
  let chatHistory = []; 
  let currentImageBase64 = null;
  let currentImageMimeType = null;

  window.addEventListener('load', () => {
    promptInput.focus();
    loadMemory();
  });

  function loadMemory() {
    messagesDiv.innerHTML = ''; // Clear container
    const saved = localStorage.getItem('vexel_history');
    if (saved) {
      try {
        chatHistory = JSON.parse(saved);
        if(chatHistory.length > 0) {
          chatHistory.forEach(msg => {
            const role = msg.role === 'model' ? 'assistant' : 'user';
            const textPart = msg.parts.find(p => p.text);
            const text = textPart ? textPart.text : '';
            renderMessage(role, text, null, false);
          });
          setTimeout(scrollToBottom, 100);
          return; // Exit here so we don't show the default welcome message
        }
      } catch (e) {
        console.error("Failed to parse history", e);
      }
    }
    // Render default welcome message if no history exists
    renderMessage('assistant', '👋 Hello! I\'m Vexel. Ask me anything or upload an image.', null, false);
  }

  function saveMemory() {
    localStorage.setItem('vexel_history', JSON.stringify(chatHistory));
  }

  function clearChat() {
    if (isWaiting) return;
    messagesDiv.innerHTML = '';
    chatHistory = [];
    localStorage.removeItem('vexel_history');
    removeImage();
    renderMessage('assistant', '✨ Conversation cleared. Ask me anything!', null, false);
  }

  function renderMessage(role, text, imageSrc = null, smoothScroll = true) {
    const div = document.createElement('div');
    div.className = `message ${role}`;

    let contentHtml = '';
    if (imageSrc) contentHtml += `<img src="${imageSrc}" class="chat-img" />`;

    if (role === 'assistant') {
      contentHtml += marked.parse(text);
    } else {
      contentHtml += text.replace(/\n/g, '<br>'); 
    }

    div.innerHTML = contentHtml;
    
    if (role === 'assistant') {
      const preTags = div.querySelectorAll('pre');
      preTags.forEach(pre => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerText = 'Copy';
        btn.onclick = () => {
          const code = pre.querySelector('code').innerText;
          navigator.clipboard.writeText(code);
          btn.innerText = 'Copied!';
          setTimeout(() => btn.innerText = 'Copy', 2000);
        };
        pre.appendChild(btn);
      });
    }

    messagesDiv.appendChild(div);
    if(smoothScroll) scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function handleImageSelection(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imagePreview.src = e.target.result;
        imagePreviewContainer.style.display = 'flex';
        currentImageBase64 = e.target.result.split(',')[1];
        currentImageMimeType = file.type;
      };
      reader.readAsDataURL(file);
    }
  }

  function removeImage() {
    fileInput.value = '';
    imagePreview.src = '';
    imagePreviewContainer.style.display = 'none';
    currentImageBase64 = null;
    currentImageMimeType = null;
  }

  async function sendMessage() {
    const prompt = promptInput.value.trim();
    if ((!prompt && !currentImageBase64) || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    // Render User Message Visually
    renderMessage('user', prompt, imagePreview.src);

    // Prepare payload (Combine existing history + current message)
    const payload = {
      prompt: prompt,
      history: chatHistory, 
      image: currentImageBase64 ? { mimeType: currentImageMimeType, data: currentImageBase64 } : null
    };

    // Cleanup Input
    promptInput.value = '';
    promptInput.style.height = 'auto';
    removeImage();
    showTyping();

    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      removeTyping();

      // IF ERROR (Like 503 High Demand)
      if (!res.ok || data.error) {
        const errorMsg = data.error?.message || JSON.stringify(data, null, 2);
        renderMessage('assistant', `⚠️ **API Error:**\n${errorMsg}\n\n*Note: Your chat history is safe. Try sending your message again in a minute.*`);
        // We do NOT update memory here, keeping the array clean so you can safely retry.
      } 
      // IF SUCCESS
      else if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        
        renderMessage('assistant', reply);

        // Update local history ONLY on success (Ensures strict User -> Assistant alternation)
        chatHistory.push({ role: 'user', parts: [{ text: prompt || "[Attached an Image]" }] });
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        saveMemory();
      } else {
        renderMessage('assistant', `❌ Error parsing response.`);
      }
    } catch (err) {
      removeTyping();
      renderMessage('assistant', `🚨 Network error: ${err.message}`);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  promptInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });
</script>

</body>
</html>
