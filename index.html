<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI – Search & Summarize</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Mobile hamburger -->
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="6" fill="#6c5cf0" />
            <path d="M7 14L12 9L17 14L12 19L7 14Z" fill="white" />
          </svg>
          <span>Vexel AI</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          New Chat
        </button>
      </div>

      <div class="sidebar-search">
        <input type="text" placeholder="Search chats..." disabled />
      </div>

      <div class="chat-history">
        <div class="history-label">Recent Chats</div>
        <ul class="history-list">
          <li class="history-item">Chat about AI trends</li>
          <li class="history-item">Trip planning help</li>
          <li class="history-item">Cooking recipes</li>
          <li class="history-item">Book recommendations</li>
        </ul>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main">
      <div class="chat-container" id="chatContainer">
        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="20" stroke="#6c5cf0" stroke-width="2" />
              <path d="M14 22L22 14L38 30L30 38L14 22Z" fill="#6c5cf0" fill-opacity="0.2" stroke="#6c5cf0" stroke-width="2" stroke-linejoin="round" />
              <circle cx="20" cy="20" r="2" fill="#6c5cf0" />
            </svg>
          </div>
          <h1>Welcome to Vexel AI</h1>
          <p class="subtitle">Search the web & get instant, cited summaries</p>
          <div class="example-prompts">
            <button class="example-card" data-prompt="What is the latest in AI?">What is the latest in AI?</button>
            <button class="example-card" data-prompt="Summarize recent climate change news">Summarize recent climate change news</button>
            <button class="example-card" data-prompt="Best productivity tips 2025">Best productivity tips 2025</button>
            <button class="example-card" data-prompt="How does quantum computing work?">How does quantum computing work?</button>
          </div>
        </div>

        <!-- Messages will be inserted here -->
        <div class="messages" id="messages"></div>
      </div>

      <!-- Composer -->
      <div class="composer">
        <div class="composer-inner">
          <textarea
            id="userInput"
            rows="1"
            placeholder="Ask Vexel AI anything..."
          ></textarea>
          <button id="sendBtn" disabled aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 10L18 2L10 18L8 12L2 10Z" fill="currentColor" />
            </svg>
          </button>
        </div>
        <p class="disclaimer">Vexel AI uses web search and AI. Verify important information.</p>
      </div>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
