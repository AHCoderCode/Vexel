  <style>
:root {
  --sidebar-width: 272px;
  --content-max: 920px;
  --composer-max: 900px;
  --bg: #212121;
  --surface: #2a2a2a;
  --surface-2: #303030;
  --surface-3: #3a3a3a;
  --border: rgba(255,255,255,.10);
  --border-strong: rgba(255,255,255,.16);
  --text: #f7f7f8;
  --text-2: #c5c5cc;
  --muted: #8e8e98;
  --accent: #8b7cf6;
  --accent-2: #a394ff;
  --danger: #ef6a6a;
  --overlay: rgba(0,0,0,.52);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --header-h: 56px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.light-mode {
  --bg: #ffffff;
  --surface: #f7f7f8;
  --surface-2: #ececf1;
  --surface-3: #e0e0e6;
  --border: rgba(0,0,0,.09);
  --border-strong: rgba(0,0,0,.14);
  --text: #202123;
  --text-2: #55565f;
  --muted: #73747c;
  --accent: #6657d9;
  --accent-2: #5344c6;
  --danger: #c83b3b;
  --overlay: rgba(0,0,0,.36);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
body::before, body::after { display: none; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

#appLoading {
  position: fixed; inset: 0; z-index: 900;
  display: grid; place-items: center;
  background: var(--bg); color: var(--text-2);
}
#appLoading[hidden] { display: none; }
.loading-card { text-align: center; }
.loading-mark {
  width: 34px; height: 34px; margin: 0 auto 14px;
  border: 3px solid var(--border-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.app-shell { position: relative; display: flex; width: 100%; height: 100%; min-width: 0; }
.sidebar {
  width: var(--sidebar-width); height: 100%; flex: 0 0 var(--sidebar-width);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-width: 0;
  z-index: 40; transition: transform .22s ease;
}
.sidebar-header { padding: calc(14px + var(--safe-top)) 12px 10px; }
.sidebar-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-weight: 700; letter-spacing: -.02em; display: inline-flex; align-items: center; gap: 8px; }
.brand-mark { width: 24px; height: 24px; display:grid; place-items:center; border-radius: 7px; color: white; background: linear-gradient(145deg, var(--accent), #5f50c8); font-size: 13px; }
.close-sidebar-btn, .menu-toggle, .icon-btn, .profile-button, .tool-icon-btn, .send-btn {
  border: 0; background: transparent; color: var(--text-2);
}
.close-sidebar-btn, .menu-toggle, .icon-btn, .tool-icon-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; }
.close-sidebar-btn:hover, .menu-toggle:hover, .icon-btn:hover, .tool-icon-btn:hover { background: var(--surface-2); color: var(--text); }
.new-chat-btn {
  width: 100%; margin-top: 12px; min-height: 42px; border-radius: 11px;
  display:flex; align-items:center; gap: 10px; padding: 0 12px;
  border: 1px solid var(--border-strong); background: transparent; color: var(--text);
}
.new-chat-btn:hover { background: var(--surface-2); }
.sidebar-tools { display:flex; gap: 7px; margin-top: 10px; }
.search-wrap { flex:1; position: relative; min-width:0; }
.search-box {
  width:100%; height:36px; border:1px solid var(--border); border-radius:9px;
  background: var(--surface-2); color: var(--text); padding: 0 10px 0 32px;
}
.search-box::placeholder { color: var(--muted); }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.icon-only-label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.chat-section-label { padding: 12px 14px 7px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.chat-list { flex:1; overflow:auto; padding: 0 8px 8px; min-height:0; }
.chat-list-item {
  position:relative; display:flex; align-items:center; min-height:40px; gap:8px;
  padding: 8px 9px 8px 11px; margin: 2px 0; border-radius: 9px;
  color: var(--text-2); cursor:pointer; border: 0; background: transparent;
}
.chat-list-item:hover { background: var(--surface-2); color: var(--text); }
.chat-list-item.active { background: var(--surface-3); color: var(--text); }
.chat-list-item .title { min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
.chat-list-item .lock-indicator { flex:0 0 auto; color: var(--muted); }
.chat-row-menu-btn { width:30px; height:30px; flex:0 0 auto; border:0; border-radius:8px; background:transparent; color:var(--muted); opacity:0; display:grid; place-items:center; }
.chat-list-item:hover .chat-row-menu-btn, .chat-row-menu-btn:focus-visible { opacity:1; }
.chat-list-item .chat-row-menu-btn:hover { background: var(--surface-3); color:var(--text); }
.chat-actions { display:none; }
.bulk-mode .chat-row-menu-btn { display:none; }
.bulk-mode .chat-list-item { cursor:default; }
.bulk-mode .chat-actions { display:flex; margin-left:auto; }
.bulk-mode .chat-actions input { width:18px; height:18px; accent-color:var(--accent); }
.bulk-delete-confirm { display:block; margin:8px; width:calc(100% - 16px); padding:9px 12px; border:0; border-radius:9px; background:var(--danger); color:#fff; font-weight:600; }

.sidebar-bottom { padding: 8px; border-top:1px solid var(--border); padding-bottom: calc(8px + var(--safe-bottom)); }
.profile-button {
  width:100%; min-height:48px; display:flex; align-items:center; gap:10px; padding:6px 8px;
  border-radius:10px; color:var(--text); text-align:left;
}
.profile-button:hover, .profile-button[aria-expanded="true"] { background:var(--surface-2); }
.avatar { width:34px; height:34px; border-radius:50%; flex:0 0 34px; display:grid; place-items:center; background:var(--accent); color:#fff; font-size:13px; font-weight:700; overflow:hidden; }
.profile-meta { min-width:0; flex:1; }
.profile-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-state { font-size:11px; color:var(--muted); margin-top:2px; }

.main-area { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; background:var(--bg); }
.header {
  height: calc(var(--header-h) + var(--safe-top)); flex:0 0 auto; padding: var(--safe-top) 14px 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  border-bottom:1px solid var(--border); background: color-mix(in srgb, var(--bg) 92%, transparent);
  position:relative; z-index:20;
}
.header-left, .header-actions { min-width:0; display:flex; align-items:center; gap:6px; }
.header-title { display:flex; align-items:center; gap:8px; min-width:0; }
.header h1 { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-subtitle { color:var(--muted); font-size:12px; white-space:nowrap; }
.header-actions > .desktop-only { display:flex; }
.auth-link { padding:8px 10px; border-radius:8px; color:var(--text-2); font-size:13px; }
.auth-link:hover { background:var(--surface-2); color:var(--text); }
.header-profile { display:none; }
.header.incognito { background: color-mix(in srgb, var(--bg) 84%, #7b4de4 16%); }

.messages { flex:1; min-height:0; overflow:auto; padding: 24px 18px 148px; scroll-behavior:smooth; }
.message-column { width:min(100%, var(--content-max)); margin:0 auto; }
.message { position:relative; max-width:100%; font-size:15px; line-height:1.65; word-break:break-word; animation:messageIn .18s ease; }
.message.user { margin: 0 0 22px auto; width:fit-content; max-width:min(78%, 700px); background:var(--surface-2); border-radius:18px; padding:10px 14px; }
.message.assistant { margin:0 0 28px; padding:0 4px; }
.message.assistant + .message.user { margin-top: 8px; }
@keyframes messageIn { from { opacity:0; transform:translateY(4px);} to {opacity:1; transform:none;} }
.message p { margin: 0 0 12px; }
.message p:last-child { margin-bottom:0; }
.message ul, .message ol { padding-left: 1.5em; margin: 8px 0 14px; }
.message li { margin:4px 0; }
.message blockquote { border-left:3px solid var(--border-strong); padding-left:12px; color:var(--text-2); margin:12px 0; }
.message a { color:var(--accent-2); text-decoration:underline; text-underline-offset:2px; }
.message table { border-collapse:collapse; width:100%; margin:12px 0; overflow:auto; display:block; }
.message th, .message td { border:1px solid var(--border-strong); padding:7px 9px; text-align:left; }
.message img.chat-img { max-width:100%; max-height:420px; object-fit:contain; border-radius:12px; display:block; margin:8px 0; cursor:zoom-in; }
.message pre { position:relative; overflow:auto; margin:12px 0; padding:36px 12px 12px; border-radius:10px; background:#111; border:1px solid var(--border); }
.message code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.message :not(pre) > code { background:var(--surface-2); padding:2px 5px; border-radius:5px; }
.copy-code-btn { position:absolute; top:7px; right:7px; border:1px solid var(--border-strong); border-radius:7px; background:rgba(0,0,0,.25); color:#ddd; padding:5px 8px; font-size:12px; }
.copy-code-btn:hover { background:rgba(255,255,255,.12); }
.message-actions { display:flex; gap:4px; margin-top:7px; opacity:0; transition:opacity .15s; }
.message.assistant:hover .message-actions, .message-actions:focus-within { opacity:1; }
.message-actions button { border:0; border-radius:7px; background:transparent; color:var(--muted); padding:5px 7px; font-size:12px; }
.message-actions button:hover { color:var(--text); background:var(--surface-2); }
.message-actions .liked, .message-actions .disliked { color:var(--accent-2); background:var(--surface-2); }

.empty-state { min-height:55vh; display:grid; place-items:center; padding:30px 0; }
.empty-card { text-align:center; max-width:540px; }
.empty-mark { width:44px; height:44px; margin:0 auto 16px; border-radius:13px; display:grid; place-items:center; background:linear-gradient(145deg,var(--accent),#5f50c8); color:#fff; font-weight:800; }
.empty-card h2 { font-size:24px; letter-spacing:-.02em; margin-bottom:8px; }
.empty-card p { color:var(--muted); font-size:14px; line-height:1.6; }
.empty-card .empty-actions { display:flex; justify-content:center; margin-top:18px; }
.empty-primary { padding:9px 14px; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface-2); color:var(--text); }
.empty-primary:hover { background:var(--surface-3); }

.input-wrapper { position:fixed; left:var(--sidebar-width); right:0; bottom:0; z-index:25; padding:0 16px calc(10px + var(--safe-bottom)); background:linear-gradient(to top, var(--bg) 74%, transparent); }
.composer-shell { width:min(100%, var(--composer-max)); margin:0 auto; }
.image-previews { display:flex; gap:8px; flex-wrap:wrap; padding:0 0 8px; }
.preview-thumb { position:relative; width:58px; height:58px; overflow:hidden; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); }
.preview-thumb img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.preview-thumb .remove-thumb { position:absolute; top:3px; right:3px; width:20px; height:20px; border:0; border-radius:50%; background:rgba(0,0,0,.68); color:#fff; display:grid; place-items:center; font-size:12px; }
.input-area { min-width:0; display:flex; align-items:flex-end; gap:7px; padding:8px; border:1px solid var(--border-strong); border-radius:16px; background:var(--surface); box-shadow:0 4px 24px rgba(0,0,0,.10); }
.input-area textarea { min-width:0; flex:1; max-height:180px; min-height:44px; resize:none; border:0; outline:0; background:transparent; color:var(--text); line-height:1.45; padding:10px 8px; font-size:15px; }
.input-area textarea::placeholder { color:var(--muted); }
.tool-icon-btn { flex:0 0 40px; height:40px; border-radius:11px; }
.plus-toggle { border:1px solid var(--border); background:var(--surface-2); color:var(--text); }
.send-btn { flex:0 0 40px; width:40px; height:40px; border-radius:11px; background:var(--accent); color:#fff; display:grid; place-items:center; }
.send-btn:hover:not(:disabled) { background:var(--accent-2); }
.send-btn:disabled { opacity:.45; cursor:not-allowed; }
.plus-menu { position:absolute; left:50%; bottom:78px; transform:translateX(-50%) translateY(7px); width:min(92vw, 430px); display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:8px; background:var(--surface); border:1px solid var(--border-strong); border-radius:13px; box-shadow:0 18px 60px rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; }
.plus-menu.active { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
.plus-menu-item { min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 5px; border-radius:9px; background:transparent; border:0; color:var(--text-2); font-size:11px; }
.plus-menu-item:hover { background:var(--surface-2); color:var(--text); }
.plus-menu-item .icon { width:22px; height:22px; display:grid; place-items:center; }
.footer-note { text-align:center; color:var(--muted); font-size:11px; padding:6px 0 0; }

.scroll-bottom-btn { position:fixed; right:24px; bottom:100px; width:38px; height:38px; border:1px solid var(--border-strong); border-radius:50%; background:var(--surface); color:var(--text); box-shadow:0 8px 20px rgba(0,0,0,.18); display:none; place-items:center; z-index:24; }
.scroll-bottom-btn.visible { display:grid; }

.account-menu, .context-menu { position:fixed; z-index:70; background:var(--surface); border:1px solid var(--border-strong); border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.25); padding:6px; min-width:210px; }
.account-menu { left:10px; bottom:calc(62px + var(--safe-bottom)); }
.context-menu { min-width:150px; }
.account-menu[hidden], .context-menu[hidden] { display:none; }
.account-menu-header { padding:9px 10px 10px; border-bottom:1px solid var(--border); margin-bottom:4px; }
.account-menu-name { font-size:13px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.account-menu-email { font-size:11px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.menu-item { width:100%; display:flex; align-items:center; gap:9px; padding:9px 10px; border:0; background:transparent; color:var(--text-2); border-radius:8px; text-align:left; font-size:13px; }
.menu-item:hover { background:var(--surface-2); color:var(--text); }
.menu-item.danger:hover { color:var(--danger); }
.context-menu .menu-item { font-size:12px; }

.mobile-backdrop { display:none; position:fixed; inset:0; background:var(--overlay); z-index:35; }
.mobile-backdrop.active { display:block; }
body.modal-open { overflow:hidden; }

.modal-overlay { position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s; }
.modal-overlay.active { opacity:1; pointer-events:auto; }
.modal-box, .pin-modal-content, .crop-modal-content, .camera-modal-content { width:min(100%, 480px); max-height:min(90vh, 760px); overflow:auto; background:var(--surface); color:var(--text); border:1px solid var(--border-strong); border-radius:16px; box-shadow:0 20px 70px rgba(0,0,0,.32); padding:20px; }
.modal-box { text-align:left; }
.modal-box p, .pin-modal-content p { margin-bottom:16px; line-height:1.5; }
.modal-buttons { display:flex; justify-content:flex-end; gap:8px; }
.modal-buttons button, .pin-modal-content button, .crop-buttons button { padding:8px 12px; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface-2); color:var(--text); }
.modal-buttons .confirm-delete { background:var(--danger); border-color:transparent; color:#fff; }
.modal-buttons button:hover, .pin-modal-content button:hover, .crop-buttons button:hover { background:var(--surface-3); }
.pin-input-wrapper { position:relative; width:190px; margin-bottom:12px; }
.pin-input-wrapper input { width:100%; height:42px; padding:0 40px 0 12px; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface-2); color:var(--text); text-align:center; letter-spacing:.25em; }
.toggle-pin { position:absolute; top:50%; right:6px; transform:translateY(-50%); width:30px; height:30px; border:0; background:transparent !important; color:var(--muted); padding:0 !important; }
.lock-overlay { position:absolute; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:var(--bg); }
.lock-overlay p { color:var(--text-2); }
.lock-overlay .error, .error { color:var(--danger); font-size:13px; min-height:18px; }
.crop-modal-content { width:min(92vw, 800px); }
.crop-container { width:100%; height:min(60vh, 500px); background:#000; border-radius:10px; overflow:hidden; }
.crop-container img { max-width:100%; }
.crop-buttons { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:12px; }
.camera-modal-content { width:min(92vw, 520px); }
.camera-modal-content video { width:100%; max-height:60vh; border-radius:10px; background:#000; }
.lightbox-overlay { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.90); cursor:zoom-out; }
.lightbox-overlay[hidden] { display:none; }
.lightbox-overlay img { max-width:95vw; max-height:92vh; border-radius:12px; }

.account-menu.from-header{left:auto;right:10px;bottom:auto;top:calc(var(--header-h) + var(--safe-top) + 8px)}
@media (max-width: 1100px) {
  :root { --sidebar-width: 250px; --content-max: 860px; --composer-max: 840px; }
}
@media (max-width: 768px) {
  .sidebar { position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); box-shadow:14px 0 40px rgba(0,0,0,.26); }
  .sidebar.open { transform:translateX(0); }
  .sidebar.hidden { transform:translateX(-100%); position:fixed; }
  .close-sidebar-btn { display:grid; }
  .header { padding-left:8px; padding-right:8px; }
  .header-subtitle, .header-actions > .desktop-only { display:none; }
  .header-profile { display:grid; }
  .header-title { gap:6px; }
  .messages { padding:16px 12px calc(144px + var(--safe-bottom)); }
  .message.user { max-width:88%; }
  .message.assistant { padding:0 2px; margin-bottom:24px; }
  .input-wrapper { left:0; padding:0 8px calc(8px + var(--safe-bottom)); }
  .input-area { border-radius:15px; }
  .plus-menu { grid-template-columns:repeat(3,1fr); bottom:76px; }
  .scroll-bottom-btn { right:14px; bottom:100px; }
  .account-menu { left:8px; bottom:calc(62px + var(--safe-bottom)); }
}
@media (max-width: 430px) {
  .new-chat-btn { min-height:40px; }
  .header h1 { font-size:14px; }
  .messages { padding-left:10px; padding-right:10px; }
  .message { font-size:14px; }
  .message.user { max-width:92%; padding:9px 12px; }
  .plus-menu { grid-template-columns:repeat(2,1fr); width:min(94vw, 320px); }
}
@media (max-height: 520px) and (orientation: landscape) {
  .messages { padding-bottom:132px; }
  .input-wrapper { padding-bottom:6px; }
  .plus-menu { bottom:70px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>

<div id="appLoading">
  <div class="loading-card"><div class="loading-mark"></div><div>Loading Vexel…</div></div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // ========== DOM refs ==========
  const supabaseClient = window.vexelSupabase;
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewsContainer = document.getElementById('imagePreviews');
  const imageInput = document.getElementById('imageInput');
  const pdfInput = document.getElementById('pdfInput');
  const micMenuItem = document.getElementById('micMenuItem');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menuToggle');
  const mainHeader = document.getElementById('mainHeader');
  const incognitoToggle = document.getElementById('incognitoToggle');
  const lockChatBtn = document.getElementById('lockChatBtn');
  const plusMenu = document.getElementById('plusMenu');
  const plusToggle = document.getElementById('plusToggle');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const pinModal = document.getElementById('pinModal');
  const newPinInput = document.getElementById('newPinInput');
  const confirmPinBtn = document.getElementById('confirmPinBtn');
  const pinErrorEl = document.getElementById('pinError');
  const pinModalTitle = document.getElementById('pinModalTitle');
  const bulkToggleBtn = document.getElementById('bulkToggleBtn');
  const bulkDeleteModal = document.getElementById('bulkDeleteModal');
  const bulkDeleteModalText = document.getElementById('bulkDeleteModalText');
  const confirmBulkDeleteBtn = document.getElementById('confirmBulkDeleteBtn');
  const torchBtn = document.getElementById('torchBtn');
  const appLoading = document.getElementById('appLoading');
  const appShell = document.getElementById('appShell');
  const mobileBackdrop = document.getElementById('mobileBackdrop');
  const profileButton = document.getElementById('profileButton');
  const headerProfileButton = document.getElementById('headerProfileButton');
  const accountMenu = document.getElementById('accountMenu');
  const profileAvatar = document.getElementById('profileAvatar');
  const headerProfileAvatar = document.getElementById('headerProfileAvatar');
  const profileName = document.getElementById('profileName');
  const profileState = document.getElementById('profileState');
  const accountMenuName = document.getElementById('accountMenuName');
  const accountMenuEmail = document.getElementById('accountMenuEmail');
  const menuLoginLink = document.getElementById('menuLoginLink');
  const menuSignupLink = document.getElementById('menuSignupLink');
  const menuLogoutBtn = document.getElementById('menuLogoutBtn');

  let isWaiting = false;
  let selectedImages = [];
  let allChats = [];
  let activeChatId = null;
  let chatHistory = [];
  let lastUserPrompt = null;
  let lastUserParts = null;
  let pendingDeleteChatId = null;
  let isIncognito = false;
  let recognition = null;
  let isRecording = false;
  let currentCropIndex = null;
  let cropper = null;
  let cameraStream = null;
  let unlockedChats = new Set();
  let pendingLockChatId = null;
  let pendingLockReason = '';
  let isBulkMode = false;
  let selectedChats = new Set();
  let scrollBottomBtn = null;
  let currentUser = null;
  let currentSession = null;
  let appInitialized = false;
  let dbReady = true;
  let initToken = 0;
  const saveQueues = new Map();

  const userKey = (suffix) => currentUser ? `vexel:${currentUser.id}:${suffix}` : null;
  const activeChatStorageKey = () => userKey('activeChat');
  const draftStorageKey = (chatId) => currentUser && chatId ? `vexel:${currentUser.id}:draft:${chatId}` : null;
  const feedbackStorageKey = () => userKey('feedback');

  async function initializeApp(session) {
    const token = ++initToken;
    currentSession = session || null;
    currentUser = session?.user || null;
    appShell.setAttribute('aria-hidden', 'false');
    updateAuthUI();

    try {
      if (!supabaseClient) throw new Error('Supabase failed to initialize.');
      await loadAllChats();
      if (token !== initToken) return;

      if (currentUser) {
        const storedId = localStorage.getItem(activeChatStorageKey());
        activeChatId = storedId && allChats.some(c => c.id === storedId) ? storedId : (allChats[0]?.id || null);
        if (activeChatId) localStorage.setItem(activeChatStorageKey(), activeChatId);
        chatHistory = [];
        if (activeChatId) loadActiveChat();
        else renderEmptyState();
      } else {
        activeChatId = null;
        chatHistory = [];
        renderEmptyState(true);
      }

      renderChatList();
      updateLockButtonState();
      clearDraftUI();
      if (activeChatId) loadDraft(activeChatId);
      updateResponsiveLayout();
    } catch (error) {
      console.error('Vexel initialization error:', error);
      dbReady = false;
      allChats = [];
      activeChatId = null;
      chatHistory = [];
      renderSystemError('Chat history is unavailable right now. Your account is still signed in, but cloud history could not be loaded.');
    } finally {
      if (token === initToken) {
        appInitialized = true;
        appLoading.hidden = true;
        promptInput.focus();
      }
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    scrollBottomBtn = document.createElement('button');
    scrollBottomBtn.className = 'scroll-bottom-btn';
    scrollBottomBtn.type = 'button';
    scrollBottomBtn.setAttribute('aria-label', 'Scroll to latest message');
    scrollBottomBtn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m0 0 5-5m-5 5-5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    scrollBottomBtn.onclick = () => messagesDiv.scrollTo({top:messagesDiv.scrollHeight, behavior:'smooth'});
    messagesDiv.appendChild(scrollBottomBtn);
    messagesDiv.addEventListener('scroll', () => {
      const atBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 60;
      scrollBottomBtn.classList.toggle('visible', !atBottom);
    }, { passive: true });

    document.getElementById('confirmDeleteBtn').addEventListener('click', executeDelete);
    confirmBulkDeleteBtn.addEventListener('click', executeBulkDelete);

    confirmPinBtn.addEventListener('click', handlePinConfirmation);
    newPinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handlePinConfirmation(); });

    promptInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    promptInput.addEventListener('input', function() {
      this.style.height = '44px';
      this.style.height = Math.min(this.scrollHeight, 180) + 'px';
      if (!isIncognito && activeChatId) saveDraft(activeChatId);
    });

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = event => {
        promptInput.value = `${promptInput.value}${promptInput.value ? ' ' : ''}${event.results[0][0].transcript}`;
        promptInput.dispatchEvent(new Event('input'));
        promptInput.focus();
        stopRecordingUI();
      };
      recognition.onerror = () => stopRecordingUI();
      recognition.onend = () => stopRecordingUI();
      micMenuItem.style.display = 'flex';
    }

    messagesDiv.addEventListener('click', (e) => {
      const image = e.target.closest('.chat-img');
      if (image) { lightboxImg.src = image.src; lightbox.hidden = false; }
    });

    mobileBackdrop.addEventListener('click', () => toggleSidebar(false));
    lightbox.addEventListener('click', () => { lightbox.hidden = true; lightboxImg.src = ''; });

    window.addEventListener('resize', updateResponsiveLayout);
    document.addEventListener('click', handleGlobalPointerDown);
    document.addEventListener('keydown', handleGlobalKeydown);

    if (!supabaseClient) {
      appLoading.hidden = true;
      renderSystemError('Supabase failed to initialize. Refresh the page and try again.');
      return;
    }

    const { data, error } = await supabaseClient.auth.getSession();
    if (error) console.error('Session load error:', error);
    await initializeApp(data?.session || null);

    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'TOKEN_REFRESHED') {
        currentSession = session;
        return;
      }
      if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') return;
      if (event === 'SIGNED_OUT') {
        initToken++;
        currentUser = null;
        currentSession = null;
        allChats = [];
        activeChatId = null;
        chatHistory = [];
        selectedChats.clear();
        unlockedChats.clear();
        isBulkMode = false;
        isIncognito = false;
        renderChatList();
        updateAuthUI();
        renderEmptyState(true);
      } else if (event === 'USER_UPDATED') {
        currentUser = session?.user || currentUser;
        updateAuthUI();
      }
    });
  });

  function handleGlobalPointerDown(event) {
    if (!accountMenu.hidden && !accountMenu.contains(event.target) && !profileButton.contains(event.target) && !headerProfileButton.contains(event.target)) closeAccountMenu();
    const context = document.getElementById('chatContextMenu');
    if (context && !context.contains(event.target)) closeChatContextMenu();
  }
  function handleGlobalKeydown(event) {
    if (event.key !== 'Escape') return;
    if (!lightbox.hidden) { lightbox.hidden = true; lightboxImg.src = ''; return; }
    const openModal = document.querySelector('.modal-overlay.active');
    if (openModal?.id === 'cameraModal') { closeCamera(); return; }
    if (openModal?.id === 'cropModal') { cancelCrop(); return; }
    if (openModal?.id === 'pinModal') { closePinModal(); return; }
    if (openModal?.id === 'deleteModal') { closeDeleteModal(); return; }
    if (openModal?.id === 'bulkDeleteModal') { closeBulkDeleteModal(); return; }
    if (!plusMenu.classList.contains('active') && accountMenu.hidden) return;
    togglePlusMenu(false);
    closeAccountMenu();
    closeChatContextMenu();
    if (window.innerWidth <= 768) toggleSidebar(false);
  }

  function toggleNewPinVisibility() {
    const input = document.getElementById('newPinInput');
    const btn = document.getElementById('toggleNewPinBtn');
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    btn.textContent = visible ? '◉' : '◎';
    btn.setAttribute('aria-label', visible ? 'Show PIN' : 'Hide PIN');
  }
  function toggleLockPinVisibility(btn) {
    const input = btn.previousElementSibling;
    if (!input) return;
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    btn.textContent = visible ? '◉' : '◎';
    btn.setAttribute('aria-label', visible ? 'Show PIN' : 'Hide PIN');
  }
  function togglePlusMenu(forceState = null) {
    const active = forceState === null ? !plusMenu.classList.contains('active') : forceState;
    plusMenu.classList.toggle('active', active);
    plusToggle.setAttribute('aria-expanded', String(active));
  }

  function updateResponsiveLayout() {
    const mobile = window.innerWidth <= 768;
    if (!mobile) {
      sidebar.classList.remove('hidden', 'open');
      mobileBackdrop.classList.remove('active');
      menuToggle.setAttribute('aria-label', 'Open sidebar');
    } else {
      if (sidebar.classList.contains('open')) mobileBackdrop.classList.add('active');
      else mobileBackdrop.classList.remove('active');
    }
  }
  function handleResponsiveSidebar() { updateResponsiveLayout(); }
  function updateToggleButtonVisibility() { updateResponsiveLayout(); }
  function toggleSidebar(forceState = null) {
    const mobile = window.innerWidth <= 768;
    if (!mobile) {
      sidebar.classList.remove('hidden');
      return;
    }

  function queueCloudSave(chatId) {
    if (!currentUser || !chatId || isIncognito || !dbReady) return Promise.resolve();

    const next = previous.catch(() => {}).then(async () => {
      const chat = getChatById(chatId);
      if (!chat) return;
      const snapshot = mapChatForDb({ ...chat, messages: typeof structuredClone === 'function' ? structuredClone(chat.messages) : JSON.parse(JSON.stringify(chat.messages)) });
      const { error } = await supabaseClient.from('vexel_chats').upsert(snapshot, { onConflict:'id' });
      if (error) throw error;
    });
    saveQueues.set(chatId, next.finally(() => { if (saveQueues.get(chatId) === next) saveQueues.delete(chatId); }));
    return next;
  }

  function addMessageActions(div,content,skipActions){if(skipActions)return;const actions=document.createElement('div');actions.className='message-actions';const copy=document.createElement('button');copy.type='button';copy.textContent='Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(stripHtml(content));copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy',1200);}catch{copy.textContent='Copy failed';setTimeout(()=>copy.textContent='Copy',1200);}};const regen=document.createElement('button');regen.type='button';regen.textContent='Regenerate';regen.onclick=()=>regenerateResponse();const like=document.createElement('button');like.type='button';like.className='like-btn';like.textContent='Like';like.onclick=()=>toggleFeedback('like',like);const dislike=document.createElement('button');dislike.type='button';dislike.className='dislike-btn';dislike.textContent='Dislike';dislike.onclick=()=>toggleFeedback('dislike',dislike);actions.append(copy,regen,like,dislike);div.appendChild(actions);}

  function attachCodeCopyButtons(container){container.querySelectorAll('pre').forEach(pre=>{if(pre.querySelector('.copy-code-btn'))return;const btn=document.createElement('button');btn.className='copy-code-btn';btn.type='button';btn.textContent='Copy';btn.onclick=async()=>{try{await navigator.clipboard.writeText(pre.querySelector('code')?.innerText||'');btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200);}catch{btn.textContent='Failed';setTimeout(()=>btn.textContent='Copy',1200);}};pre.appendChild(btn);});}
  function showTyping(){removeTyping();const div=document.createElement('div');div.className='message assistant';div.id='typingIndicator';div.innerHTML='<span aria-hidden="true">•</span><span aria-hidden="true">•</span><span aria-hidden="true">•</span>';let style=document.getElementById('typingStyle');if(!style){style=document.createElement('style');style.id='typingStyle';style.textContent='.typing-dots{color:var(--muted)}';document.head.appendChild(style);}const column=messagesDiv.querySelector('.message-column')||messagesDiv;column.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight;}
  function removeTyping(){document.getElementById('typingIndicator')?.remove();}
  // ========== IMAGE / PDF / VOICE / CAMERA / CROP ==========
  function handleImageSelection(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      if (selectedImages.length >= 4) { alert('Max 4 images'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = e.target.result.split(',')[1];
        selectedImages.push({ mimeType: file.type, data: base64, previewUrl: e.target.result, id: Date.now()+Math.random() });
        renderImagePreviews();
        saveDraft(activeChatId);
      };
      reader.readAsDataURL(file);
    });
    imageInput.value = '';
  }

  async function handlePDFSelection(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
      }
      promptInput.value = promptInput.value + '\n\n[PDF Content]:\n' + fullText.slice(0,5000);
    } catch(e) { alert('Failed to extract PDF text.'); }
    pdfInput.value = '';
  }

  function startVoiceInput() {
    if (!recognition) return;
    if (isRecording) { recognition.stop(); return; }
    isRecording = true;
    micMenuItem.querySelector('.icon').textContent = '🎙️';
    recognition.start();
  }

  function stopRecordingUI() {
    isRecording = false;
    const el = document.getElementById('micMenuItem');
    if (el) el.querySelector('.icon').textContent = '🎤';
  }

  async function openCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      cameraStream = stream;
      document.getElementById('cameraVideo').srcObject = stream;
      document.getElementById('cameraModal').classList.add('active');
    } catch (err) { alert('Camera access denied.'); }
  }

  function toggleTorch() {
    if (!cameraStream) return;
    const track = cameraStream.getVideoTracks()[0];
    if (!track) return;
    if ('torch' in track.getCapabilities()) {
      track.applyConstraints({ advanced: [{ torch: !track.getSettings().torch }] });
      torchBtn.textContent = track.getSettings().torch ? '💡✅' : '💡';
    } else {
      alert('Torch not supported.');
    }
  }

  function capturePhoto() {
    const video = document.getElementById('cameraVideo');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg');
    if (selectedImages.length >= 4) { alert('Max 4 images'); closeCamera(); return; }
    selectedImages.push({ mimeType: 'image/jpeg', data: dataUrl.split(',')[1], previewUrl: dataUrl, id: Date.now()+Math.random() });
    renderImagePreviews();
    saveDraft(activeChatId);
    closeCamera();
  }

  function closeCamera() {
    if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
    document.getElementById('cameraModal').classList.remove('active');
  }

  function openCropModal(index) {
    currentCropIndex = index;
    const img = selectedImages[index];
    document.getElementById('cropImage').src = img.previewUrl;
    document.getElementById('cropModal').classList.add('active');
    if (cropper) cropper.destroy();
    cropper = new Cropper(document.getElementById('cropImage'), {
      aspectRatio: NaN, viewMode: 1, autoCropArea: 0.8, responsive: true, background: false,
      zoomable: true, rotatable: true, scalable: true
    });
  }

  function applyCrop() {
    if (!cropper || currentCropIndex === null) return;
    const canvas = cropper.getCroppedCanvas();
    const dataUrl = canvas.toDataURL(selectedImages[currentCropIndex].mimeType);
    selectedImages[currentCropIndex].data = dataUrl.split(',')[1];
    selectedImages[currentCropIndex].previewUrl = dataUrl;
    cropper.destroy();
    cropper = null;
    document.getElementById('cropModal').classList.remove('active');
    renderImagePreviews();
    saveDraft(activeChatId);
  }

  function cancelCrop() {
    if (cropper) cropper.destroy();
    cropper = null;
    document.getElementById('cropModal').classList.remove('active');
    currentCropIndex = null;
  }

  // ========== IMAGE GENERATION ==========
  async function generateImage() {
    const description = promptInput.value.trim() || prompt('Describe the image you want to generate:');
    if (!description) return;
    renderMessage('user', escapeHtml(description).replace(/\n/g,'<br>'), null, true, false);
    chatHistory.push({ role: 'user', parts: [{ text: description }] });
    saveCurrentChatIfNeeded();

    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(description)}?width=512&height=512&nologo=true`;
    try {
      const tempDiv = document.createElement('div');
      tempDiv.className = 'typing';
      tempDiv.innerHTML = '<span></span><span></span><span></span>';
      messagesDiv.appendChild(tempDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const response = await fetch(url);
      const blob = await response.blob();
      const dataUrl = URL.createObjectURL(blob);
      tempDiv.remove();

      const imgMsg = document.createElement('div');
      imgMsg.className = 'message assistant';
      imgMsg.innerHTML = `<img src="${dataUrl}" class="chat-img" alt="Generated image" />`;
      messagesDiv.appendChild(imgMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        chatHistory.push({ role: 'model', parts: [{ inline_data: { mime_type: 'image/png', data: base64 } }] });
        saveCurrentChatIfNeeded();
      };
      reader.readAsDataURL(blob);
    } catch(err) { alert('Image generation failed.'); }
  }

  // ========== SHARE & DOWNLOAD ==========
  function shareChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `*${role}:* ${textPart.text}\n\n`;
    });
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
    const choice = confirm('Share via WhatsApp? Click OK for WhatsApp, Cancel to copy to clipboard.');
    if (choice) window.open(whatsappUrl, '_blank');
    else navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
  }
  function downloadChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `**${role}:** ${textPart.text}\n\n`;
    });
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vexel-chat-${Date.now()}.md`;
    a.click();
  }

  // ========== SEND MESSAGE ==========
  async function sendMessage(regenerating=false){
    if(isWaiting)return;
    const prompt=promptInput.value.trim();
    if((!prompt&&selectedImages.length===0&&!regenerating))return;
    if(!activeChatId&&!isIncognito){await createNewChat(true);if(!activeChatId)return;}
    isWaiting=true;sendBtn.disabled=true;promptInput.disabled=true;removeTyping();
    let userParts=[];
    try{
      if(!regenerating){
        if(prompt)userParts.push({text:prompt});
        selectedImages.forEach(img=>userParts.push({inline_data:{mime_type:img.mimeType,data:img.data}}));
        const safePrompt=escapeHtml(prompt).replace(/\n/g,'<br>');
        const safeImages=selectedImages.map(img=>`<img src="${img.previewUrl}" class="chat-img" alt="Attachment">`).join('');
        renderMessage('user',safePrompt+safeImages,null,true,true);
        promptInput.value='';promptInput.style.height='44px';selectedImages=[];renderImagePreviews();
        saveDraft(activeChatId);lastUserPrompt=prompt;lastUserParts=userParts;
      }else{
        if(chatHistory.at(-1)?.role==='model'){chatHistory.pop();getChatById(activeChatId).messages=chatHistory;await queueCloudSave(activeChatId);const lastAssistant=messagesDiv.querySelector('.message.assistant:last-of-type');lastAssistant?.remove();}
        userParts=lastUserParts||[];
      }
      showTyping();
      const payload={prompt:regenerating?(lastUserPrompt||''):prompt,history:regenerating?chatHistory:[...chatHistory,{role:'user',parts:userParts}],images:regenerating?(lastUserParts||[]).filter(p=>p.inline_data).map(p=>({mimeType:p.inline_data.mime_type,data:p.inline_data.data})):[]};
      const res=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      let data=null;try{data=await res.json();}catch{data={error:{message:'The AI returned an invalid response.'}};}
      removeTyping();
      if(!res.ok||data.error){renderMessage('assistant',escapeHtml(data?.error?.message||'Vexel could not complete the request.'),null,true,false);return;}
      const reply=data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(typeof reply!=='string'){renderMessage('assistant','Vexel returned an unexpected response. Please try again.',null,true,false);return;}
      renderMessage('assistant',reply,null,true,false);
      if(!regenerating)chatHistory.push({role:'user',parts:userParts});
      chatHistory.push({role:'model',parts:[{text:reply}]});
      const chat=getChatById(activeChatId);
      if(chat&&!isIncognito){chat.messages=chatHistory;if(chat.title==='New Chat'){const first=chatHistory.find(m=>m.role==='user');const firstText=first?.parts?.find(p=>p.text)?.text;chat.title=firstText?firstText.replace(/\s+/g,' ').trim().slice(0,70):'File chat';}chat.updatedAt=Date.now();renderChatList();await queueCloudSave(activeChatId);}
    }catch(error){console.error('Send message error:',error);removeTyping();renderMessage('assistant',escapeHtml(error?.message?.toLowerCase().includes('network')?'Network error. Check your connection and try again.':'Vexel could not complete that request. Please try again.'),null,true,false);}finally{isWaiting=false;sendBtn.disabled=false;promptInput.disabled=false;promptInput.focus();}
  }
  async function saveCurrentChat(chatId=activeChatId){if(!chatId||isIncognito||!currentUser)return;const chat=getChatById(chatId);if(!chat)return;chat.messages=chatId===activeChatId?chatHistory:chat.messages;chat.updatedAt=Date.now();if(chat.title==='New Chat'&&chat.messages.length){const first=chat.messages.find(m=>m.role==='user');const text=first?.parts?.find(p=>p.text)?.text;chat.title=text?text.replace(/\s+/g,' ').trim().slice(0,70):'File chat';}try{await queueCloudSave(chatId);renderChatList();}catch(error){console.error('Save chat error:',error);throw error;}}
  function saveCurrentChatIfNeeded(){return saveCurrentChat(activeChatId);}
  function regenerateResponse(){if(isWaiting)return;if(!lastUserPrompt&&!(chatHistory.find(m=>m.role==='user'))){return;}sendMessage(true);}
  async function clearCurrentChat(){if(isWaiting||!activeChatId)return;if(!confirm('Clear this conversation?'))return;chatHistory=[];const chat=getChatById(activeChatId);if(chat){chat.messages=[];chat.updatedAt=Date.now();try{await queueCloudSave(activeChatId);}catch(error){console.error('Clear chat error:',error);alert('The chat could not be cleared.');return;}}clearDraftUI();renderAllMessages();renderChatList();}
  function toggleFeedback(type,button){const key=feedbackStorageKey();if(!key||!activeChatId||isIncognito)return;let feedback={};try{feedback=JSON.parse(localStorage.getItem(key)||'{}');}catch{feedback={};}const assistantNodes=[...messagesDiv.querySelectorAll('.message.assistant')];const index=assistantNodes.indexOf(button.closest('.message.assistant'));const feedbackKey=`${activeChatId}:${index}`;feedback[feedbackKey]=feedback[feedbackKey]===type?null:type;localStorage.setItem(key,JSON.stringify(feedback));button.classList.toggle(type==='like'?'liked':'disliked',feedback[feedbackKey]===type);const sibling=type==='like'?button.nextElementSibling:button.previousElementSibling;sibling?.classList.remove(type==='like'?'disliked':'liked');}
  function toggleTheme(){document.body.classList.toggle('light-mode');const theme=document.body.classList.contains('light-mode')?'light':'dark';localStorage.setItem('vexel_theme',theme);updateThemeIcon();}
  function updateThemeIcon(){const light=document.body.classList.contains('light-mode');const button=document.getElementById('themeHeaderBtn');if(button)button.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');const label=document.getElementById('themeMenuLabel');if(label)label.textContent=light?'Use dark theme':'Use light theme';}
  (function(){if(localStorage.getItem('vexel_theme')==='light')document.body.classList.add('light-mode');updateThemeIcon();})();

  function getInitials(username){const value=String(username||'V').trim();const parts=value.split(/[_\s-]+/).filter(Boolean);if(parts.length>=2)return `${parts[0][0]}${parts[1][0]}`.toUpperCase();return value.slice(0,2).toUpperCase();}
  function updateAuthUI(){const loggedIn=Boolean(currentUser);const username=currentUser?.user_metadata?.username||currentUser?.email?.split('@')[0]||'User';const initials=getInitials(username);[profileAvatar,headerProfileAvatar].forEach(el=>{if(el)el.textContent=initials;});profileName.textContent=loggedIn?username:'Guest';profileState.textContent=loggedIn?'Signed in':'Not signed in';accountMenuName.textContent=loggedIn?username:'Guest';accountMenuEmail.textContent=loggedIn?(currentUser.email||'Vexel account'):'Not signed in';menuLoginLink.hidden=loggedIn;menuSignupLink.hidden=loggedIn;menuLogoutBtn.hidden=!loggedIn;document.getElementById('signupLink').style.display=loggedIn?'none':'inline-flex';document.getElementById('loginLink').style.display=loggedIn?'none':'inline-flex';updateLockButtonState();}
  function toggleAccountMenu(forceOpen=null,fromHeader=false){const shouldOpen=forceOpen===null?accountMenu.hidden:forceOpen;accountMenu.hidden=!shouldOpen;accountMenu.classList.toggle('from-header',Boolean(fromHeader&&shouldOpen));profileButton.setAttribute('aria-expanded',String(shouldOpen));headerProfileButton?.setAttribute('aria-expanded',String(shouldOpen));}
  function closeAccountMenu(){accountMenu.hidden=true;accountMenu.classList.remove('from-header');profileButton.setAttribute('aria-expanded','false');headerProfileButton?.setAttribute('aria-expanded','false');}
  async function logout(){
  if(!supabaseClient)return;

  menuLogoutBtn.disabled=true;

  try{
    const {error}=await supabaseClient.auth.signOut();

    if(error)throw error;

  }catch(error){
    console.error('Logout error:',error);
    alert('Vexel could not log you out. Please try again.');

  }finally{
    menuLogoutBtn.disabled=false;
    closeAccountMenu();
  }
}
