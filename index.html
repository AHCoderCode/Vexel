<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vexel AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <!-- js-sha256 for PIN hashing (tiny, no dependencies) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <style>
    :root {
      --bg-deep: #0b0c18; --bg-glass: rgba(18, 20, 42, 0.7); --border-glow: rgba(120, 90, 255, 0.4);
      --accent: #8a6dff; --accent-bright: #b590ff; --text-primary: #f0eefc;
      --text-secondary: #c2c0dd; --text-muted: #7878a0;
      --user-bg: linear-gradient(135deg, #322b6b, #1a1445);
      --assistant-bg: rgba(22, 24, 45, 0.8); --header-bg: rgba(16, 18, 32, 0.9);
      --sidebar-bg: rgba(10, 11, 22, 0.95); --input-bg: rgba(20, 22, 40, 0.6);
      --scroll-thumb: #3a3570; --neon-glow: 0 0 15px rgba(138, 109, 255, 0.5);
      --incognito-color: #b366ff;
    }
    body.light-mode {
      --bg-deep: #f4f6ff; --bg-glass: rgba(255,255,255,0.7); --border-glow: rgba(100, 80, 255, 0.3);
      --accent: #6c5ce7; --accent-bright: #8c7cf0; --text-primary: #181a2e;
      --text-secondary: #4a4b65; --text-muted: #7b7d98;
      --user-bg: linear-gradient(135deg, #e0dcff, #cbc3ff);
      --assistant-bg: rgba(255,255,255,0.85); --header-bg: rgba(255,255,255,0.9);
      --sidebar-bg: rgba(240,242,255,0.95); --input-bg: rgba(255,255,255,0.8);
      --scroll-thumb: #b0acd5; --neon-glow: 0 0 12px rgba(108, 92, 231, 0.4);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep); color: var(--text-primary);
      display: flex; height: 100vh; overflow: hidden;
      transition: background 0.4s, color 0.4s;
      position: relative; width: 100vw;
    }
    body::before, body::after {
      content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px; background: radial-gradient(circle, rgba(138,109,255,0.15) 0%, transparent 70%);
      top: -200px; left: -200px; animation: floatOrb 12s ease-in-out infinite;
    }
    body::after {
      width: 500px; height: 500px; background: radial-gradient(circle, rgba(180,140,255,0.1) 0%, transparent 70%);
      bottom: -150px; right: -150px; animation: floatOrb 15s ease-in-out infinite reverse;
    }
    @keyframes floatOrb {
      0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(40px,-40px) scale(1.1); }
      50% { transform: translate(-30px,30px) scale(0.9); } 75% { transform: translate(-30px,-30px) scale(1.05); }
    }
    button { cursor:pointer; transition:all 0.2s ease; font-family:inherit; }
    a { text-decoration:none; color:inherit; }

    /* Sidebar */
    .sidebar {
      width:280px; background:var(--sidebar-bg); border-right:1px solid var(--border-glow);
      display:flex; flex-direction:column; height:100vh; flex-shrink:0;
      transition:transform 0.3s; z-index:30; backdrop-filter:blur(16px);
      box-shadow:4px 0 30px rgba(0,0,0,0.5), var(--neon-glow);
    }
    .sidebar.hidden { transform:translateX(-100%); position:absolute; }
    .sidebar-header { padding:1.5rem 1.2rem 0.8rem; border-bottom:1px solid var(--border-glow); display:flex; flex-direction:column; gap:0.8rem; }
    .sidebar-title-row { display:flex; justify-content:space-between; align-items:center; }
    .sidebar-header h2 a { font-size:1.3rem; font-weight:700; background:linear-gradient(135deg, #b590ff, #8a6dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .close-sidebar-btn { background:none; border:1px solid var(--border-glow); color:var(--text-secondary); font-size:1.2rem; padding:0.3rem 0.6rem; border-radius:8px; }
    .close-sidebar-btn:hover { background:var(--accent); color:white; }
    .new-chat-btn { background:var(--accent); border:none; color:white; padding:0.7rem 1rem; border-radius:12px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:0.4rem; box-shadow:0 0 15px rgba(138,109,255,0.6); width:100%; }
    .sidebar-tools { display:flex; gap:0.5rem; align-items:center; }
    .incognito-toggle { background:rgba(22,24,45,0.6); border:1px solid var(--border-glow); color:var(--text-secondary); padding:0.4rem 0.8rem; border-radius:8px; font-size:0.9rem; display:flex; align-items:center; gap:0.3rem; }
    .incognito-toggle.active { background:var(--incognito-color); border-color:var(--incognito-color); color:white; }
    .search-box { width:100%; padding:0.5rem 0.8rem; background:var(--input-bg); border:1px solid var(--border-glow); border-radius:10px; color:var(--text-primary); font-size:0.85rem; outline:none; }
    .chat-list { flex:1; overflow-y:auto; padding:0.5rem; }
    .chat-list-item {
      padding:0.8rem 1rem; border-radius:12px; cursor:pointer; color:var(--text-secondary);
      font-size:0.9rem; margin-bottom:0.25rem; display:flex; justify-content:space-between;
      align-items:center; border:1px solid transparent; transition:all 0.2s;
    }
    .chat-list-item:hover { background:rgba(138,109,255,0.15); border-color:var(--border-glow); }
    .chat-list-item.active { background:rgba(138,109,255,0.2); border-color:var(--accent); color:white; }
    .chat-list-item .title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
    .chat-list-item .chat-actions { display:flex; gap:0.3rem; }
    .chat-list-item .chat-actions button { background:rgba(255,70,70,0.2); border:none; color:#ff7575; padding:0.2rem 0.5rem; border-radius:6px; }
    .chat-list-item .chat-actions button:hover { background:#ff4444; color:white; }
    .chat-list-item .chat-actions .lock-btn { background:rgba(255,200,50,0.3); color:#ffcc50; }
    .chat-list-item .chat-actions .lock-btn:hover { background:#ffbb00; color:white; }

    /* Main area */
    .main-area { flex:1; display:flex; flex-direction:column; height:100vh; min-width:0; }
    .header {
      background:var(--header-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--border-glow);
      padding:1rem 1.8rem; display:flex; justify-content:space-between; align-items:center;
      flex-shrink:0; box-shadow:0 4px 30px rgba(0,0,0,0.4);
    }
    .header.incognito { background:rgba(179,102,255,0.2); border-bottom:1px solid var(--incognito-color); }
    .header-left { display:flex; align-items:center; gap:1rem; }
    .menu-toggle { background:none; border:1px solid var(--border-glow); color:var(--text-secondary); font-size:1.3rem; padding:0.3rem 0.6rem; border-radius:8px; }
    .menu-toggle:hover { background:var(--accent); color:white; }
    .menu-toggle.hidden { display:none; }
    .header h1 a { font-size:1.6rem; font-weight:700; background:linear-gradient(135deg, #b590ff, #8a6dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; cursor:pointer; }
    .header-actions { display:flex; gap:0.5rem; }
    .header-actions button { background:rgba(22,24,45,0.6); border:1px solid var(--border-glow); color:var(--text-secondary); padding:0.5rem 0.8rem; border-radius:10px; font-size:0.85rem; white-space:nowrap; }
    .header-actions button:hover { background:var(--accent); border-color:var(--accent-bright); color:white; box-shadow:0 0 12px rgba(138,109,255,0.6); }
    .theme-btn { font-size:1.2rem; padding:0.4rem 0.8rem; }

    .messages {
      flex:1; overflow-y:auto; padding:2rem 2.5rem; display:flex; flex-direction:column; gap:1.5rem;
      background:transparent; scroll-behavior:smooth; position:relative;
    }
    .message {
      max-width:75%; padding:1rem 1.5rem; border-radius:20px; line-height:1.6;
      word-wrap:break-word; font-size:0.95rem; animation:fadeInUp 0.3s ease;
      position:relative; backdrop-filter:blur(10px);
      box-shadow:0 8px 32px rgba(0,0,0,0.3), 0 0 10px var(--border-glow);
      border:1px solid var(--border-glow);
    }
    .message.user { align-self:flex-end; background:var(--user-bg); color:white; border-bottom-right-radius:6px; }
    .message.assistant { align-self:flex-start; background:var(--assistant-bg); color:var(--text-primary); border-bottom-left-radius:6px; }
    .message img.chat-img { max-width:100%; border-radius:10px; margin:0.5rem 0; max-height:300px; object-fit:cover; display:block; cursor:pointer; transition:transform 0.2s; }
    .message img.chat-img:hover { transform:scale(1.02); }
    .message pre { background:rgba(0,0,0,0.35); padding:2.5rem 0.8rem 0.8rem; border-radius:10px; overflow:auto; margin:0.5rem 0; border:1px solid var(--border-glow); position:relative; white-space:pre; word-wrap:normal; }
    .message code { font-family:'JetBrains Mono', monospace; font-size:0.85em; }
    .copy-code-btn {
      position:sticky; top:8px; right:8px; float:right; z-index:5;
      background:var(--accent); border:none; color:white; padding:0.3rem 0.6rem;
      border-radius:6px; font-size:0.75rem; cursor:pointer; box-shadow:0 0 8px rgba(138,109,255,0.6);
    }
    .copy-code-btn:hover { background:var(--accent-bright); }
    .message-actions {
      display:flex; gap:0.4rem; margin-top:0.7rem; opacity:0; transition:opacity 0.2s;
    }
    .message.assistant:hover .message-actions { opacity:1; }
    @media (pointer: coarse) { .message-actions { opacity:1; } }
    .message-actions button { background:rgba(22,24,45,0.7); border:1px solid var(--border-glow); color:var(--text-secondary); padding:0.3rem 0.7rem; border-radius:8px; font-size:0.8rem; }
    .message-actions button:hover { background:var(--accent); border-color:var(--accent-bright); color:white; box-shadow:0 0 8px rgba(138,109,255,0.6); }
    .like-btn.liked, .dislike-btn.disliked { background:var(--accent); color:white; border-color:var(--accent-bright); }

    .typing { align-self:flex-start; background:var(--assistant-bg); border:1px solid var(--border-glow); padding:0.8rem 1.5rem; border-radius:16px 16px 16px 4px; display:flex; gap:0.3rem; }
    .typing span { width:8px; height:8px; background:var(--accent-bright); border-radius:50%; animation:bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay:0.2s; }
    .typing span:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-8px); } }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    .input-wrapper { border-top:1px solid var(--border-glow); padding:0.8rem 2.5rem 1.5rem; background:transparent; backdrop-filter:blur(8px); }
    .image-previews { display:flex; gap:8px; flex-wrap:wrap; padding-bottom:0.5rem; }
    .preview-thumb { position:relative; width:56px; height:56px; border-radius:8px; border:2px solid var(--accent); overflow:hidden; cursor:pointer; box-shadow:0 0 10px rgba(138,109,255,0.4); }
    .preview-thumb img { width:100%; height:100%; object-fit:cover; }
    .preview-thumb .remove-thumb { position:absolute; top:-4px; right:-4px; background:#ff4d4d; color:white; border:none; width:18px; height:18px; border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; }
    .input-area { display:flex; gap:0.5rem; align-items:flex-end; }
    .tool-btn { background:linear-gradient(135deg, #2b3148, #1e2230); border:1px solid var(--accent); color:var(--text-secondary); font-size:1.2rem; padding:0 0.8rem; border-radius:14px; height:52px; box-shadow:0 0 8px rgba(138,109,255,0.3); flex-shrink:0; }
    .tool-btn:hover { border-color:var(--accent-bright); color:white; background:linear-gradient(135deg, #3b3f5c, #2b3148); box-shadow:0 0 15px rgba(138,109,255,0.6); }
    .tool-btn.recording { background:#ff4444; border-color:#ff4444; color:white; animation:pulse 1s infinite; }
    @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(255,68,68,0.6); } 70% { box-shadow:0 0 0 10px rgba(255,68,68,0); } 100% { box-shadow:0 0 0 0 rgba(255,68,68,0); } }
    .input-area textarea { flex:1; padding:0.9rem 1.2rem; background:var(--input-bg); border:1px solid var(--border-glow); border-radius:14px; color:var(--text-primary); resize:none; outline:none; min-height:52px; max-height:140px; font-size:0.95rem; }
    .input-area textarea:focus { border-color:var(--accent-bright); box-shadow:0 0 12px rgba(138,109,255,0.4); }
    .send-btn { background:linear-gradient(135deg, #8a6dff, #a78bfa); border:none; color:white; padding:0 1.8rem; border-radius:14px; height:52px; font-weight:600; box-shadow:0 0 15px rgba(138,109,255,0.5); }
    .send-btn:hover { background:linear-gradient(135deg, #9b7efc, #b590ff); box-shadow:0 0 25px rgba(138,109,255,0.8); transform:translateY(-2px); }
    .send-btn:disabled { opacity:0.6; pointer-events:none; }

    .footer-note { padding:0.6rem 2.5rem; text-align:center; font-size:0.75rem; color:var(--text-muted); border-top:1px solid var(--border-glow); background:transparent; backdrop-filter:blur(5px); }

    /* Lock overlay */
    .lock-overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.8); backdrop-filter:blur(10px);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:15; gap:1rem;
    }
    .lock-overlay input { background:var(--input-bg); border:1px solid var(--border-glow); color:var(--text-primary); padding:0.8rem; border-radius:10px; text-align:center; font-size:1.2rem; width:150px; }
    .lock-overlay button { background:var(--accent); border:none; color:white; padding:0.7rem 1.5rem; border-radius:12px; font-weight:600; box-shadow:var(--neon-glow); }
    .lock-overlay .error { color:#ff6b6b; font-size:0.9rem; }

    /* Modals (delete, crop, camera) unchanged ... (include all from previous) */
    .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s; }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal-box { background:var(--bg-glass); border:1px solid var(--border-glow); border-radius:20px; padding:2rem; text-align:center; max-width:320px; box-shadow:var(--neon-glow); }
    .modal-box p { margin-bottom:1.5rem; color:var(--text-primary); }
    .modal-buttons { display:flex; justify-content:center; gap:1rem; }
    .modal-buttons button { padding:0.7rem 1.5rem; border:1px solid var(--border-glow); border-radius:12px; background:rgba(22,24,45,0.6); color:var(--text-primary); font-weight:600; }
    .modal-buttons button.confirm-delete { background:#ff4444; border-color:#ff4444; color:white; }
    .crop-modal-content { display:flex; flex-direction:column; align-items:center; background:#1a1d27; border-radius:20px; padding:1rem; max-width:95vw; max-height:95vh; width:800px; }
    .crop-container { width:100%; height:60vh; max-height:500px; background:#000; border-radius:12px; overflow:hidden; }
    .crop-container img { max-width:100%; display:block; }
    .crop-buttons { margin-top:1rem; display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
    .crop-buttons button { background:var(--accent); border:none; color:white; padding:0.7rem 1.5rem; border-radius:12px; font-weight:600; box-shadow:0 0 12px rgba(138,109,255,0.5); }
    .crop-buttons button:last-child { background:#ff4444; }
    .camera-modal-content { display:flex; flex-direction:column; align-items:center; background:#1a1d27; border-radius:20px; padding:1rem; }
    video { width:100%; max-width:400px; border-radius:10px; }
    .lightbox-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:200; display:flex; align-items:center; justify-content:center; cursor:zoom-out; }
    .lightbox-overlay img { max-width:90vw; max-height:90vh; border-radius:12px; box-shadow:0 0 30px rgba(138,109,255,0.5); }

    @media (max-width:768px) {
      .sidebar { position:absolute; left:0; top:0; height:100%; z-index:40; width:min(260px, 80vw); }
      .sidebar.hidden { transform:translateX(-100%); }
      .header { padding:0.8rem 1rem; }
      .header h1 a { font-size:1.3rem; }
      .messages { padding:1.2rem 1rem; gap:1rem; }
      .message { max-width:92%; font-size:0.95rem; padding:0.8rem 1rem; }
      .input-wrapper { padding:0.5rem 0.8rem 0.8rem; }
      .input-area { flex-wrap:wrap; }
      .tool-btn { height:44px; padding:0 0.6rem; font-size:1rem; }
      .input-area textarea { min-height:44px; }
      .send-btn { height:44px; padding:0 1rem; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <h2><a href="https://vexelai-zeta.vercel.app/" target="_blank">◈ Vexel AI</a></h2>
      <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div class="sidebar-tools">
      <input type="text" class="search-box" placeholder="🔍 Search chats..." id="searchInput" oninput="filterChats()">
      <button class="incognito-toggle" id="incognitoToggle" onclick="toggleIncognito()" title="Incognito Mode">🕶️</button>
    </div>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <p>Are you sure you want to delete this chat?</p>
    <div class="modal-buttons">
      <button onclick="closeDeleteModal()">Cancel</button>
      <button class="confirm-delete" id="confirmDeleteBtn">Yes, delete</button>
    </div>
  </div>
</div>

<!-- Crop Modal -->
<div class="modal-overlay" id="cropModal">
  <div class="crop-modal-content">
    <div class="crop-container"><img id="cropImage" /></div>
    <div class="crop-buttons">
      <button onclick="applyCrop()">Crop & Save</button>
      <button onclick="cancelCrop()">Cancel</button>
    </div>
  </div>
</div>

<!-- Camera Modal -->
<div class="modal-overlay" id="cameraModal">
  <div class="camera-modal-content">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="crop-buttons" style="margin-top:1rem;">
      <button onclick="capturePhoto()">📸 Capture</button>
      <button onclick="closeCamera()">Cancel</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox-overlay" style="display:none" onclick="this.style.display='none'">
  <img id="lightboxImg" src="" />
</div>

<!-- Main Chat Area -->
<div class="main-area">
  <div class="header" id="mainHeader">
    <div class="header-left">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰</button>
      <h1><a href="https://vexelai-zeta.vercel.app/" target="_blank">Vexel AI</a></h1>
    </div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleTheme()">🌙</button>
      <button onclick="downloadChat()">⬇️ Download</button>
      <button onclick="shareChat()">📋 Share</button>
      <button onclick="clearCurrentChat()">🗑️ Clear</button>
      <button id="lockChatBtn" onclick="toggleLockChat()">🔒</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <!-- Lock overlay will be inserted here dynamically if needed -->
  </div>

  <div class="input-wrapper">
    <div class="image-previews" id="imagePreviews"></div>
    <div class="input-area">
      <input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleImageSelection(event)">
      <input type="file" id="pdfInput" accept="application/pdf" hidden onchange="handlePDFSelection(event)">
      <button class="tool-btn" onclick="document.getElementById('imageInput').click()" title="Attach Images">📎</button>
      <button class="tool-btn" onclick="document.getElementById('pdfInput').click()" title="Attach PDF">📄</button>
      <button class="tool-btn" id="micBtn" onclick="startVoiceInput()" title="Voice Input">🎤</button>
      <button class="tool-btn" id="cameraBtn" onclick="openCamera()" title="Take Photo">📷</button>
      <button class="tool-btn" id="genImgBtn" onclick="generateImage()" title="Generate Image">🎨</button>
      <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <div class="footer-note">1000 Messages a day! · Voice, Camera, Crop, PDF, Generate Image, Lockable Chats</div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // DOM refs
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewsContainer = document.getElementById('imagePreviews');
  const imageInput = document.getElementById('imageInput');
  const pdfInput = document.getElementById('pdfInput');
  const micBtn = document.getElementById('micBtn');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menuToggle');
  const mainHeader = document.getElementById('mainHeader');
  const incognitoToggle = document.getElementById('incognitoToggle');
  const lockChatBtn = document.getElementById('lockChatBtn');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  let isWaiting = false;
  let selectedImages = [];
  let allChats = [];
  let activeChatId = null;
  let chatHistory = [];
  let lastUserPrompt = null;
  let lastUserParts = null;
  let pendingDeleteChatId = null;
  let isIncognito = false;
  let recognition = null;
  let isRecording = false;
  let currentCropIndex = null;
  let cropper = null;
  let cameraStream = null;
  // Locked chats session unlock state: set of chat IDs that are currently unlocked
  let unlockedChats = new Set();

  // INIT
  window.addEventListener('load', () => {
    loadAllChats();
    if (allChats.length === 0) {
      createNewChat(true);
    } else {
      const storedId = localStorage.getItem('vexel_activeChatId');
      if (storedId && allChats.some(c => c.id === storedId)) {
        activeChatId = storedId;
      } else {
        activeChatId = allChats[0].id;
        localStorage.setItem('vexel_activeChatId', activeChatId);
      }
      loadActiveChat();
    }
    renderChatList();
    updateThemeIcon();
    handleResponsiveSidebar();
    updateLockButtonState();
    promptInput.focus();

    window.addEventListener('resize', () => {
      handleResponsiveSidebar();
      updateToggleButtonVisibility();
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', executeDelete);

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = event => {
        promptInput.value = promptInput.value + ' ' + event.results[0][0].transcript;
        promptInput.focus();
        stopRecordingUI();
      };
      recognition.onerror = () => stopRecordingUI();
      recognition.onend = () => stopRecordingUI();
    } else {
      micBtn.style.display = 'none';
    }

    messagesDiv.addEventListener('click', (e) => {
      if (e.target.classList.contains('chat-img')) {
        lightboxImg.src = e.target.src;
        lightbox.style.display = 'flex';
      }
    });
  });

  function handleResponsiveSidebar() {
    if (window.innerWidth <= 768) sidebar.classList.add('hidden');
    else sidebar.classList.remove('hidden');
    updateToggleButtonVisibility();
  }

  function updateToggleButtonVisibility() {
    menuToggle.classList.toggle('hidden', !sidebar.classList.contains('hidden'));
  }

  function toggleSidebar() {
    sidebar.classList.toggle('hidden');
    updateToggleButtonVisibility();
  }

  // ---------- CHATS & LOCKING ----------
  function loadAllChats() {
    const stored = localStorage.getItem('vexel_chats');
    allChats = stored ? JSON.parse(stored) : [];
  }

  function saveAllChats() {
    if (!isIncognito) localStorage.setItem('vexel_chats', JSON.stringify(allChats));
  }

  function isChatLocked(chatId) {
    if (!chatId) return false;
    const chat = allChats.find(c => c.id === chatId);
    return chat && chat.lockHash && !unlockedChats.has(chatId);
  }

  function loadActiveChat() {
    if (isIncognito) {
      chatHistory = [];
      renderAllMessages();
      removeLockOverlay();
      return;
    }
    const chat = allChats.find(c => c.id === activeChatId);
    if (!chat) return;
    chatHistory = chat.messages || [];
    if (isChatLocked(activeChatId)) {
      showLockOverlay();
    } else {
      removeLockOverlay();
      renderAllMessages();
    }
    updateLockButtonState();
    loadDraft(activeChatId);
  }

  function showLockOverlay() {
    removeLockOverlay();
    const overlay = document.createElement('div');
    overlay.className = 'lock-overlay';
    overlay.id = 'lockOverlay';
    overlay.innerHTML = `
      <p>🔒 This chat is locked</p>
      <input type="password" id="lockPinInput" maxlength="4" inputmode="numeric" placeholder="Enter PIN" />
      <button id="unlockBtn">Unlock</button>
      <p class="error" id="lockError"></p>
    `;
    messagesDiv.style.position = 'relative';
    messagesDiv.appendChild(overlay);
    document.getElementById('unlockBtn').addEventListener('click', () => attemptUnlock());
    document.getElementById('lockPinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptUnlock(); });
  }

  function attemptUnlock() {
    const pin = document.getElementById('lockPinInput').value.trim();
    const chat = allChats.find(c => c.id === activeChatId);
    if (!chat || !chat.lockHash) return;
    if (sha256(pin) === chat.lockHash) {
      unlockedChats.add(activeChatId);
      removeLockOverlay();
      renderAllMessages();
      updateLockButtonState();
    } else {
      document.getElementById('lockError').textContent = 'Wrong PIN.';
    }
  }

  function removeLockOverlay() {
    const overlay = document.getElementById('lockOverlay');
    if (overlay) overlay.remove();
    messagesDiv.style.position = '';
  }

  function toggleLockChat() {
    if (!activeChatId || isIncognito) return;
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat.lockHash) {
      // Unlock permanently (remove lock)
      chat.lockHash = null;
      unlockedChats.delete(activeChatId);
      saveAllChats();
      renderAllMessages();
    } else {
      // Lock: ask for a new PIN
      const pin = prompt('Set a 4-digit PIN to lock this chat:');
      if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) {
        alert('PIN must be exactly 4 digits.');
        return;
      }
      chat.lockHash = sha256(pin);
      // When locking, we keep the messages but the chat becomes locked from now on
      unlockedChats.delete(activeChatId);
      saveAllChats();
      // Immediately lock: show overlay
      showLockOverlay();
    }
    updateLockButtonState();
  }

  function updateLockButtonState() {
    if (!activeChatId || isIncognito) {
      lockChatBtn.style.display = 'none';
      return;
    }
    lockChatBtn.style.display = 'inline-block';
    const chat = allChats.find(c => c.id === activeChatId);
    if (chat && chat.lockHash) {
      lockChatBtn.textContent = '🔓 Unlock';
      lockChatBtn.title = 'Remove lock';
    } else {
      lockChatBtn.textContent = '🔒 Lock';
      lockChatBtn.title = 'Lock this chat';
    }
  }

  // ---------- CHAT MANAGEMENT (unchanged except for lock) ----------
  function createNewChat(switchTo = true) {
    if (isIncognito) {
      chatHistory = [];
      activeChatId = null;
      renderAllMessages();
      clearDraftUI();
      lastUserPrompt = null; lastUserParts = null;
      return;
    }
    const id = Date.now().toString(36) + Math.random().toString(36).substr(2,5);
    const newChat = { id, title: 'New Chat', createdAt: Date.now(), messages: [], lockHash: null };
    allChats.unshift(newChat);
    saveAllChats();
    if (switchTo) {
      saveDraft(activeChatId);
      activeChatId = id;
      localStorage.setItem('vexel_activeChatId', id);
      chatHistory = [];
      renderAllMessages();
      renderChatList();
      clearDraftUI();
      updateLockButtonState();
      loadDraft(activeChatId);
    }
  }

  function switchToChat(chatId) {
    if (isIncognito) toggleIncognito(false);
    saveDraft(activeChatId);
    if (activeChatId) {
      const currentChat = allChats.find(c => c.id === activeChatId);
      if (currentChat) currentChat.messages = chatHistory;
      saveAllChats();
    }
    activeChatId = chatId;
    localStorage.setItem('vexel_activeChatId', chatId);
    loadActiveChat();
    renderChatList();
    lastUserPrompt = null; lastUserParts = null;
    if (window.innerWidth <= 768) {
      sidebar.classList.add('hidden');
      updateToggleButtonVisibility();
    }
  }

  function deleteChat(chatId, event) {
    event.stopPropagation();
    if (allChats.length <= 1) return;
    pendingDeleteChatId = chatId;
    document.getElementById('deleteModal').classList.add('active');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
    pendingDeleteChatId = null;
  }

  function executeDelete() {
    if (!pendingDeleteChatId) return;
    allChats = allChats.filter(c => c.id !== pendingDeleteChatId);
    if (activeChatId === pendingDeleteChatId) {
      activeChatId = allChats[0].id;
      localStorage.setItem('vexel_activeChatId', activeChatId);
      localStorage.removeItem(`vexel_draft_${pendingDeleteChatId}`);
    }
    unlockedChats.delete(pendingDeleteChatId);
    saveAllChats();
    loadActiveChat();
    renderChatList();
    closeDeleteModal();
  }

  function renderChatList(filteredChats = null) {
    if (isIncognito) { chatListEl.innerHTML = ''; return; }
    const chats = filteredChats || allChats;
    chatListEl.innerHTML = '';
    chats.forEach(chat => {
      const item = document.createElement('div');
      const locked = chat.lockHash && !unlockedChats.has(chat.id);
      item.className = `chat-list-item${chat.id === activeChatId ? ' active' : ''}`;
      item.innerHTML = `
        <span class="title">${locked ? '🔒 ' : ''}${escapeHtml(chat.title)}</span>
        <div class="chat-actions">
          <button class="delete-chat" title="Delete">🗑️</button>
          <button class="lock-btn" title="${locked ? 'Unlock' : 'Lock'}">${locked ? '🔓' : '🔒'}</button>
        </div>
      `;
      item.addEventListener('click', () => switchToChat(chat.id));
      item.querySelector('.delete-chat').addEventListener('click', (e) => deleteChat(chat.id, e));
      item.querySelector('.lock-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        switchToChat(chat.id);
        toggleLockChat();
      });
      chatListEl.appendChild(item);
    });
  }

  function filterChats() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (!q) renderChatList();
    else renderChatList(allChats.filter(chat => chat.title.toLowerCase().includes(q)));
  }

  function toggleIncognito(forceState = null) { /* unchanged */ }
  function escapeHtml(text) { return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- DRAFT ----------
  function saveDraft(chatId) { if (!chatId || isIncognito) return; /* ... */ }
  function loadDraft(chatId) { /* ... */ }
  function clearDraftUI() { promptInput.value=''; selectedImages=[]; renderImagePreviews(); }

  // ---------- RENDERING ----------
  function renderImagePreviews() { /* ... */ }
  function renderAllMessages() { /* unchanged */ }
  function renderMessage(role, content, unused, smoothScroll = true, skipActions = false) { /* unchanged */ }
  function showTyping() { /* unchanged */ }
  function removeTyping() { /* unchanged */ }
  function scrollToBottom() { messagesDiv.scrollTop = messagesDiv.scrollHeight; }

  // ---------- IMAGE CROP ----------
  function openCropModal(index) { /* unchanged */ }
  function applyCrop() { /* unchanged */ }
  function cancelCrop() { /* unchanged */ }

  // ---------- CAMERA ----------
  async function openCamera() { /* unchanged */ }
  function capturePhoto() { /* unchanged */ }
  function closeCamera() { /* unchanged */ }

  // ---------- PDF ----------
  async function handlePDFSelection(event) { /* unchanged */ }

  // ---------- VOICE ----------
  function startVoiceInput() { /* unchanged */ }
  function stopRecordingUI() { /* unchanged */ }

  // ---------- IMAGE GENERATION ----------
  async function generateImage() {
    const description = promptInput.value.trim() || prompt('Describe the image you want to generate:');
    if (!description) return;
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(description)}?width=512&height=512&nologo=true`;
    try {
      // Show a temporary message
      const tempDiv = document.createElement('div');
      tempDiv.className = 'message assistant';
      tempDiv.innerHTML = '🎨 Generating image…';
      messagesDiv.appendChild(tempDiv);
      scrollToBottom();

      const response = await fetch(url);
      const blob = await response.blob();
      const dataUrl = URL.createObjectURL(blob);
      // Remove temporary message
      tempDiv.remove();
      // Add the generated image as an assistant message
      const imgMsg = document.createElement('div');
      imgMsg.className = 'message assistant';
      imgMsg.innerHTML = `<img src="${dataUrl}" class="chat-img" alt="Generated image" />`;
      messagesDiv.appendChild(imgMsg);
      scrollToBottom();

      // Add to chat history so it's saved
      chatHistory.push({ role: 'model', parts: [{ inline_data: { mime_type: 'image/png', data: '' } }] });
      // We'll store the URL as a text part for retrieval later (simplified)
      // Actually, we'll replace the empty data with a proper base64 for persistence.
      // But for simplicity, we'll just convert blob to base64 and store.
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        // Update the last message part
        const lastMsg = chatHistory[chatHistory.length-1];
        lastMsg.parts[0] = { inline_data: { mime_type: 'image/png', data: base64 } };
        saveCurrentChatIfNeeded();
      };
      reader.readAsDataURL(blob);
    } catch(err) {
      alert('Image generation failed. Please try again.');
    }
  }

  // ---------- DOWNLOAD & SHARE ----------
  function downloadChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      const imageParts = msg.parts.filter(p => p.inline_data);
      if (textPart) text += `**${role}:** ${textPart.text}\n\n`;
      if (imageParts.length) text += `**${role}:** [Image attached]\n\n`;
    });
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vexel-chat-${Date.now()}.md`;
    a.click();
  }

  function shareChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `**${role}:** ${textPart.text}\n\n`;
    });
    navigator.clipboard.writeText(text).then(() => {
      alert('Chat copied to clipboard!');
    });
  }

  // ---------- SEND MESSAGE (unchanged) ----------
  async function sendMessage(regenerating = false) {
    const prompt = promptInput.value.trim();
    if ((!prompt && selectedImages.length === 0 && !regenerating) || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    const userParts = [];
    if (!regenerating) {
      if (prompt) userParts.push({ text: prompt });
      selectedImages.forEach(img => userParts.push({ inline_data: { mime_type: img.mimeType, data: img.data } }));

      let combinedHtml = prompt ? prompt.replace(/\n/g, '<br>') : '';
      selectedImages.forEach(img => combinedHtml += `<img src="${img.previewUrl}" class="chat-img" />`);
      renderMessage('user', combinedHtml, null, true, false);

      promptInput.value = '';
      selectedImages = [];
      renderImagePreviews();
      if (!isIncognito) saveDraft(activeChatId);
      lastUserPrompt = prompt;
      lastUserParts = userParts;
    } else {
      if (chatHistory.length > 0 && chatHistory[chatHistory.length-1].role === 'model') {
        chatHistory.pop();
        saveCurrentChatIfNeeded();
        const lastAssistant = messagesDiv.querySelector('.message.assistant:last-child');
        if (lastAssistant) lastAssistant.remove();
      }
    }

    showTyping();

    const payload = {
      prompt: regenerating ? (lastUserPrompt || '') : prompt,
      history: regenerating ? chatHistory : [...chatHistory, { role: 'user', parts: userParts }],
      images: regenerating ? (lastUserParts ? lastUserParts.filter(p => p.inline_data).map(p => ({ mimeType: p.inline_data.mime_type, data: p.inline_data.data })) : []) : []
    };

    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        renderMessage('assistant', `⚠️ **API Error:**\n${data.error?.message || JSON.stringify(data)}`);
      } else if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        renderMessage('assistant', reply);
        if (!regenerating) chatHistory.push({ role: 'user', parts: userParts });
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        saveCurrentChatIfNeeded();
        renderChatList();
      } else {
        renderMessage('assistant', '❌ Unexpected response format.');
      }
    } catch (err) {
      removeTyping();
      renderMessage('assistant', `🚨 Network error: ${err.message}`);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  function saveCurrentChatIfNeeded() { if (!isIncognito) saveCurrentChat(); }
  function saveCurrentChat() { /* unchanged */ }
  function regenerateResponse() { sendMessage(true); }
  function clearCurrentChat() {
    if (isWaiting) return;
    chatHistory = [];
    messagesDiv.innerHTML = '';
    renderMessage('assistant', '✨ Conversation cleared.', null, false, true);
    clearDraftUI();
    if (!isIncognito) saveCurrentChat();
  }
  function toggleFeedback(type, button) { /* unchanged */ }
  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    updateThemeIcon();
    localStorage.setItem('vexel_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
  }
  function updateThemeIcon() {
    const btn = document.querySelector('.theme-btn');
    if (btn) btn.innerHTML = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
  }

  (function() {
    if (localStorage.getItem('vexel_theme') === 'light') document.body.classList.add('light-mode');
    updateThemeIcon();
  })();

  promptInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    if (!isIncognito && activeChatId) saveDraft(activeChatId);
  });
</script>
