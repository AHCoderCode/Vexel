<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI</title>

  <!-- Markdown library for nice formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ================================================================
       🧠  PROFESSIONAL DEEPSEEK‑STYLE LAYOUT – VEXEL AI
       ================================================================ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #13151a;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Full‑screen container */
    .chat-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1a1d27;
      border: none;
      box-shadow: none;
    }

    /* Header – professional, solid */
    .header {
      background: #1f2230;
      border-bottom: 1px solid #2a2d3a;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header h1::before {
      content: '◈';
      font-size: 1.4rem;
      color: #6d8aff;
    }

    .header-actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    /* Professional buttons – clean, subtle hover */
    .header-actions button {
      background: #2a2d3a;
      border: 1px solid #3a3d4a;
      color: #c0c5d0;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
    }

    .header-actions button:hover {
      background: #343845;
      border-color: #5a5f72;
      color: #ffffff;
    }

    .header-actions button:active {
      transform: scale(0.97);
    }

    /* Messages area – spacious, clean */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: #1a1d27;
    }

    /* Message bubbles – professional, soft */
    .message {
      max-width: 75%;
      padding: 0.9rem 1.4rem;
      border-radius: 16px;
      line-height: 1.6;
      word-wrap: break-word;
      font-size: 0.95rem;
      animation: fadeIn 0.25s ease;
      position: relative;
    }

    .message.user {
      align-self: flex-end;
      background: #2b3148;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      border: 1px solid #3d4563;
    }

    .message.assistant {
      align-self: flex-start;
      background: #232734;
      color: #d0d5e0;
      border-bottom-left-radius: 4px;
      border: 1px solid #2e3347;
    }

    .message pre {
      background: #11131a;
      padding: 0.8rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5rem 0;
      border: 1px solid #2a2d3a;
    }

    .message code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85em;
    }

    /* Typing indicator – simple dots */
    .typing {
      align-self: flex-start;
      background: #232734;
      border: 1px solid #2e3347;
      padding: 0.7rem 1.4rem;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 0.3rem;
    }

    .typing span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #6d8aff;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Input area – clean, minimal */
    .input-area {
      display: flex;
      gap: 0.8rem;
      padding: 1.2rem 2.5rem 1.5rem;
      background: #1a1d27;
      border-top: 1px solid #2a2d3a;
      flex-shrink: 0;
    }

    .input-area textarea {
      flex: 1;
      padding: 0.9rem 1.2rem;
      background: #232734;
      border: 1px solid #2e3347;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      color: #e0e0e0;
      transition: border-color 0.2s, background 0.2s;
      min-height: 52px;
      max-height: 140px;
    }

    .input-area textarea:focus {
      border-color: #6d8aff;
      background: #262b3a;
    }

    .input-area textarea::placeholder {
      color: #5a6070;
    }

    /* Send button – professional accent */
    .input-area button {
      background: #2b3148;
      border: 1px solid #3d4563;
      color: #ffffff;
      padding: 0 1.8rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-height: 52px;
      letter-spacing: 0.3px;
    }

    .input-area button:hover {
      background: #6d8aff;
      border-color: #6d8aff;
      color: #fff;
    }

    .input-area button:active {
      transform: scale(0.97);
    }

    .input-area button:disabled {
      opacity: 0.6;
      pointer-events: none;
      background: #2a2d3a;
      border-color: #3a3d4a;
    }

    /* Footer – light, discreet */
    .footer-note {
      padding: 0.6rem 2.5rem 0.8rem;
      text-align: center;
      font-size: 0.75rem;
      color: #5a6070;
      background: #1a1d27;
      border-top: 1px solid #2a2d3a;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }

    /* Custom scrollbar – subtle */
    .messages::-webkit-scrollbar {
      width: 6px;
    }
    .messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #2e3347;
      border-radius: 10px;
    }
    .messages::-webkit-scrollbar-thumb:hover {
      background: #3d4563;
    }

    /* Responsive adjustments */
    @media (max-width: 700px) {
      .header {
        padding: 0.8rem 1.2rem;
      }
      .header h1 {
        font-size: 1.3rem;
      }
      .messages {
        padding: 1.2rem 1rem;
      }
      .message {
        max-width: 90%;
      }
      .input-area {
        padding: 0.8rem 1rem 1rem;
      }
    }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <h1>Vexel AI</h1>
    <div class="header-actions">
      <button onclick="clearChat()">🗑️ Clear</button>
      <button onclick="toggleDark()">🌙 Dark</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="message assistant">
      👋 Hello! I'm Vexel. Ask me anything.
    </div>
  </div>

  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

  <!-- Input -->
  <div class="input-area">
    <textarea id="promptInput" rows="1" placeholder="Type your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Footer -->
  <div class="footer-note">
    1000 Messages a day! &nbsp;·&nbsp; Responses may take a few seconds
  </div>
</div>

<script>
  // =============================================================
  // 🔐 NO API KEY HERE – it's safely stored on the Vercel backend
  // =============================================================

  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');

  let isDark = false;
  let isWaiting = false;

  // -------------------------------------------------------------
  // Render helpers
  // -------------------------------------------------------------
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;

    if (role === 'assistant') {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }

    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function clearChat() {
    if (isWaiting) return;
    messagesDiv.innerHTML = '';
    addMessage('assistant', '✨ Conversation cleared. Ask me anything!');
  }

  function toggleDark() {
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    const btn = document.querySelector('.header-actions button:last-child');
    btn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
  }

  // -------------------------------------------------------------
  // Send message to OUR OWN BACKEND (not Google directly)
  // -------------------------------------------------------------
  async function sendMessage() {
    const prompt = promptInput.value.trim();
    if (!prompt || isWaiting) return;

    isWaiting = true;
    sendBtn.disabled = true;
    promptInput.disabled = true;

    addMessage('user', prompt);
    promptInput.value = '';
    promptInput.style.height = 'auto';
    showTyping();

    try {
      // 🟢 Call your Vercel serverless function
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });

      const data = await res.json();

      removeTyping();

      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        const reply = data.candidates[0].content.parts[0].text;
        addMessage('assistant', reply);
      } else {
        const errorMsg = data.error?.message || JSON.stringify(data, null, 2);
        addMessage('assistant', `❌ Error:\n\`\`\`\n${errorMsg}\n\`\`\``);
      }
    } catch (err) {
      removeTyping();
      addMessage('assistant', `🚨 Network error:\n\`\`\`\n${err.message}\n\`\`\``);
    }

    isWaiting = false;
    sendBtn.disabled = false;
    promptInput.disabled = false;
    promptInput.focus();
  }

  // Auto-resize textarea
  promptInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });

  window.addEventListener('load', () => promptInput.focus());
</script>

</body>
</html>
