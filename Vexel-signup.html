<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI — Sign up</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5962202637347912" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#212121;--surface:#2a2a2a;--surface2:#303030;--border:rgba(255,255,255,.11);--text:#f7f7f8;--muted:#9b9ba3;--accent:#8b7cf6;--danger:#ef6a6a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,420px)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;font-weight:750;font-size:20px;letter-spacing:-.02em}.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#5f50c8);color:#fff;font-size:14px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.2)}h1{font-size:25px;letter-spacing:-.03em;text-align:center;margin:0 0 8px}.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
    form{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}.field input{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);padding:0 12px;outline:none}.field input:focus{border-color:var(--accent)}
    .password-field{position:relative}.password-field input{padding-right:42px}.eye{position:absolute;right:5px;top:5px;width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}.eye:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .hint{color:#777780;font-size:11px;margin-top:5px;line-height:1.4}.error{min-height:18px;color:var(--danger);font-size:13px;line-height:1.4}.submit{height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:650}.submit:hover{background:#9c8df9}.submit:disabled{opacity:.55;cursor:not-allowed}
    .switch{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 0}.switch a{color:#b8afff;text-decoration:none}.switch a:hover{text-decoration:underline}.note{text-align:center;color:#777780;font-size:11px;margin-top:14px;line-height:1.5}
    @media(max-width:460px){.row{grid-template-columns:1fr}.card{padding:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">V</span> Vexel</div>
    <section class="card">
      <h1>Create your account</h1>
      <p class="subtitle">Start with a username-based Vexel account.</p>
      <div class="error" id="error" aria-live="polite"></div>
      <form id="signupForm" novalidate>
        <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" maxlength="20" placeholder="e.g. Alex123" required /><div class="hint">3–20 characters: letters, numbers, or underscore.</div></div>
        <div class="row"><div class="field"><label for="age">Age</label><input id="age" name="age" type="number" inputmode="numeric" min="5" max="120" autocomplete="off" placeholder="Age" required /></div><div class="field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required /><button type="button" class="eye" id="passwordEye" aria-label="Show password" aria-pressed="false">◎</button></div></div></div>
        <div class="field"><label for="confirmPassword">Retype password</label><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Retype your password" required /><button type="button" class="eye" id="confirmEye" aria-label="Show password" aria-pressed="false">◎</button></div></div>
        <button class="submit" id="submitButton" type="submit">Create account</button>
      </form>
      <p class="switch">Already have an account? <a href="/login.html">Log in</a></p>
      <p class="note">Vexel stores your username and age in Supabase user metadata and uses a private internal email identity for authentication.</p>
    </section>
  </main>
  <script>
    const client=window.vexelSupabase;const form=document.getElementById('signupForm');const usernameInput=document.getElementById('username');const ageInput=document.getElementById('age');const passwordInput=document.getElementById('password');const confirmInput=document.getElementById('confirmPassword');const errorEl=document.getElementById('error');const button=document.getElementById('submitButton');
    function setupEye(button,input){button.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'●':'◎';button.setAttribute('aria-label',show?'Hide password':'Show password');button.setAttribute('aria-pressed',String(show));input.focus();});}
    setupEye(document.getElementById('passwordEye'),passwordInput);setupEye(document.getElementById('confirmEye'),confirmInput);
    (async()=>{if(!client){errorEl.textContent='Supabase failed to initialize. Refresh the page and try again.';return;}const {data}=await client.auth.getSession();if(data.session)window.location.href='/';usernameInput.focus();})();
    form.addEventListener('submit',async(event)=>{event.preventDefault();errorEl.textContent='';const username=usernameInput.value.trim();const age=Number(ageInput.value);const password=passwordInput.value;const confirm=confirmInput.value;if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){errorEl.textContent='Username must be 3–20 characters and use only letters, numbers, or _.';return;}if(!Number.isInteger(age)||age<5||age>120){errorEl.textContent='Age must be a whole number between 5 and 120.';return;}if(password.length<6){errorEl.textContent='Password must be at least 6 characters.';return;}if(password!==confirm){errorEl.textContent='Passwords do not match.';return;}if(!client){errorEl.textContent='Supabase failed to initialize. Refresh the page and try again.';return;}button.disabled=true;button.textContent='Creating account…';try{const email=`${username.toLowerCase()}@vexel.ai`;const {data,error}=await client.auth.signUp({email,password,options:{data:{username,age}}});if(error){console.error('Signup error:',error);const msg=(error.message||'').toLowerCase();errorEl.textContent=(msg.includes('already registered')||msg.includes('already exists')||msg.includes('duplicate')||msg.includes('unique'))?'Username is already taken.':'Account could not be created. Please try again.';return;}if(!data.session){errorEl.textContent='Account created, but no session was returned. In Supabase, disable Confirm email for this username-based login flow.';return;}window.location.replace('/');}catch(error){console.error('Signup crashed:',error);errorEl.textContent='Something went wrong. Please try again.';}finally{button.disabled=false;button.textContent='Create account';}});
  </script>
</body>
</html>
