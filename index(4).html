  <style>
:root {
  --sidebar-width: 260px;
  --content-max: 860px;
  --composer-max: 820px;
  --bg: #212121;
  --surface: #2a2a2a;
  --surface-2: #303030;
  --surface-3: #3a3a3a;
  --surface-soft: rgba(255,255,255,.045);
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.14);
  --text: #f7f7f8;
  --text-2: #c5c5cc;
  --muted: #8e8e98;
  --accent: #8b7cf6;
  --accent-2: #a394ff;
  --danger: #ef6a6a;
  --success: #72d6a1;
  --overlay: rgba(0,0,0,.55);
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --header-h: 56px;
  --composer-radius: 24px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --viewport-height: 100dvh;
}

body.light-mode {
  --bg: #ffffff;
  --surface: #f7f7f8;
  --surface-2: #ececf1;
  --surface-3: #e1e1e6;
  --surface-soft: rgba(0,0,0,.035);
  --border: rgba(0,0,0,.08);
  --border-strong: rgba(0,0,0,.14);
  --text: #202123;
  --text-2: #50515a;
  --muted: #74757d;
  --accent: #6657d9;
  --accent-2: #5344c6;
  --danger: #c83b3b;
  --success: #287a55;
  --overlay: rgba(0,0,0,.36);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; }
body {
  margin: 0;
  min-height: var(--viewport-height);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before, body::after { display: none; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

#appLoading {
  position: fixed; inset: 0; z-index: 900;
  display: grid; place-items: center;
  background: var(--bg); color: var(--text-2);
}
#appLoading[hidden] { display: none; }
.loading-card { text-align: center; font-size: 13px; }
.loading-mark {
  width: 28px; height: 28px; margin: 0 auto 12px;
  border: 2.5px solid var(--border-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .72s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.app-shell { position: relative; display: flex; width: 100%; height: var(--viewport-height); min-width: 0; }

.sidebar {
  width: var(--sidebar-width); height: 100%; flex: 0 0 var(--sidebar-width);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-width: 0;
  z-index: 40; transition: transform .18s ease, width .18s ease;
}
.sidebar-header { padding: calc(11px + var(--safe-top)) 10px 9px; }
.sidebar-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.brand { font-weight: 720; letter-spacing:-.02em; display:inline-flex; align-items:center; gap:8px; min-width:0; }
.brand-mark {
  width:24px; height:24px; display:grid; place-items:center; border-radius:7px;
  background: linear-gradient(145deg, var(--accent), #5f50c8); color:#fff; font-size:12px; font-weight:800;
}
.close-sidebar-btn, .menu-toggle, .icon-btn, .profile-button, .tool-icon-btn, .send-btn {
  border:0; background:transparent; color:var(--text-2); -webkit-tap-highlight-color:transparent;
}
.close-sidebar-btn, .menu-toggle, .icon-btn, .tool-icon-btn {
  width:36px; height:36px; border-radius:9px; display:grid; place-items:center;
}
.close-sidebar-btn:hover, .menu-toggle:hover, .icon-btn:hover, .tool-icon-btn:hover { background:var(--surface-2); color:var(--text); }
.new-chat-btn {
  width:100%; margin-top:10px; min-height:40px; border-radius:10px;
  display:flex; align-items:center; gap:10px; padding:0 11px;

  transition:background .15s ease, border-color .15s ease;
}
.new-chat-btn:hover { background:var(--surface-2); border-color:var(--border-strong); }
.sidebar-tools { display:flex; gap:6px; margin-top:8px; }
.search-wrap { flex:1; position:relative; min-width:0; }
.search-box {
  width:100%; height:36px; border:1px solid transparent; border-radius:9px;
  background:var(--surface-2); color:var(--text); padding:0 10px 0 31px; outline:none; font-size:13px;
}
.search-box:focus { border-color:var(--border-strong); background:var(--surface-3); }
.search-box::placeholder { color:var(--muted); }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.chat-section-label { padding:13px 12px 7px; font-size:11px; color:var(--muted); font-weight:650; letter-spacing:.02em; text-transform:uppercase; }
.chat-list { flex:1; overflow:auto; padding:0 7px 8px; min-height:0; scrollbar-width:thin; }
.chat-list::-webkit-scrollbar, .messages::-webkit-scrollbar { width:9px; }
.chat-list::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:999px; border:3px solid transparent; background-clip:padding-box; }
.chat-list-item {
  position:relative; display:flex; align-items:center; min-height:38px; gap:8px;
  padding:7px 8px 7px 10px; margin:1px 0; border-radius:8px; color:var(--text-2);
  cursor:pointer; border:0; background:transparent; transition:background .12s ease, color .12s ease;
}
.chat-list-item:hover { background:var(--surface-2); color:var(--text); }
.chat-list-item.active { background:var(--surface-3); color:var(--text); }
.chat-list-item .title { min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
.chat-list-item .lock-indicator { flex:0 0 auto; color:var(--muted); display:grid; place-items:center; font-size:0; }
.chat-list-item .lock-indicator::before { content:'🔒'; font-size:11px; filter:grayscale(1); opacity:.8; }
.chat-row-menu-btn { width:30px; height:30px; flex:0 0 auto; border:0; border-radius:8px; background:transparent; color:var(--muted); opacity:0; display:grid; place-items:center; }
.chat-list-item:hover .chat-row-menu-btn, .chat-row-menu-btn:focus-visible { opacity:1; }
.chat-list-item .chat-row-menu-btn:hover { background:var(--surface-3); color:var(--text); }
.chat-actions { display:none; }
.bulk-mode .chat-row-menu-btn { display:none; }
.bulk-mode .chat-list-item { cursor:default; }
.bulk-mode .chat-actions { display:flex; margin-left:auto; }
.bulk-mode .chat-actions input { width:18px; height:18px; accent-color:var(--accent); }
.bulk-delete-confirm { display:block; margin:8px; width:calc(100% - 16px); padding:9px 12px; border:0; border-radius:9px; background:var(--danger); color:#fff; font-weight:650; font-size:12px; }
.sidebar-bottom { padding:8px; border-top:1px solid var(--border); padding-bottom:calc(8px + var(--safe-bottom)); }
.profile-button {
  width:100%; min-height:46px; display:flex; align-items:center; gap:10px; padding:5px 7px;
  border-radius:9px; color:var(--text); text-align:left;
}
.profile-button:hover, .profile-button[aria-expanded="true"] { background:var(--surface-2); }
.avatar { width:32px; height:32px; border-radius:50%; flex:0 0 32px; display:grid; place-items:center; background:var(--accent); color:#fff; font-size:12px; font-weight:750; overflow:hidden; }
.profile-meta { min-width:0; flex:1; }
.profile-name { font-size:12px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-state { font-size:10px; color:var(--muted); margin-top:2px; }

.main-area { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; background:var(--bg); position:relative; }
.header {
  height:calc(var(--header-h) + var(--safe-top)); flex:0 0 auto; padding:var(--safe-top) 16px 0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--bg); position:relative; z-index:20;
}
.header-left, .header-actions { min-width:0; display:flex; align-items:center; gap:4px; }
.header-title { display:flex; align-items:baseline; gap:7px; min-width:0; }
.header h1 { font-size:15px; line-height:1; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.header-subtitle { color:var(--muted); font-size:11px; white-space:nowrap; }
.header-actions > .desktop-only { display:grid; }
.auth-link { padding:7px 9px; border-radius:8px; color:var(--text-2); font-size:12px; }
.auth-link:hover { background:var(--surface-2); color:var(--text); }
.header-profile { display:none; }
.header.incognito { background:linear-gradient(to bottom, rgba(119,74,197,.14), transparent); }

.messages { flex:1; min-height:0; overflow:auto; padding:10px 18px 154px; scroll-behavior:smooth; overscroll-behavior:contain; }
.message-column { width:min(100%, var(--content-max)); margin:0 auto; }
.message { position:relative; max-width:100%; font-size:15px; line-height:1.68; word-break:break-word; animation:messageIn .16s ease; }
.message.user {
  margin:0 0 26px auto; width:fit-content; max-width:min(78%, 700px);
  background:var(--surface-2); border-radius:18px; padding:10px 14px; color:var(--text);
}
.message.assistant { margin:0 0 30px; padding:0 4px; }
.message.assistant + .message.user { margin-top:6px; }
@keyframes messageIn { from { opacity:0; transform:translateY(3px);} to {opacity:1; transform:none;} }
.message p { margin:0 0 13px; }
.message p:last-child { margin-bottom:0; }
.message h1, .message h2, .message h3, .message h4 { letter-spacing:-.02em; line-height:1.25; margin:22px 0 10px; }
.message h1 { font-size:24px; } .message h2 { font-size:20px; } .message h3 { font-size:17px; } .message h4 { font-size:15px; }
.message > :first-child { margin-top:0; }
.message ul, .message ol { padding-left:1.45em; margin:8px 0 14px; }
.message li { margin:4px 0; padding-left:2px; }
.message blockquote { border-left:3px solid var(--border-strong); padding-left:13px; color:var(--text-2); margin:13px 0; }
.message a { color:var(--accent-2); text-decoration:underline; text-underline-offset:2px; }
.message table { border-collapse:collapse; width:100%; margin:14px 0; display:block; overflow:auto; max-width:100%; }
.message th, .message td { border:1px solid var(--border-strong); padding:7px 9px; text-align:left; white-space:nowrap; }
.message img.chat-img { max-width:100%; max-height:420px; object-fit:contain; border-radius:12px; display:block; margin:9px 0; cursor:zoom-in; }
.message pre { position:relative; overflow:auto; margin:14px 0; padding:37px 13px 13px; border-radius:11px; background:#151515; border:1px solid var(--border); max-width:100%; }
.message code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:.92em; }
.message :not(pre) > code { background:var(--surface-2); padding:2px 5px; border-radius:5px; }
.copy-code-btn { position:absolute; top:7px; right:7px; border:1px solid var(--border-strong); border-radius:7px; background:rgba(0,0,0,.26); color:#ddd; padding:5px 8px; font-size:11px; }
.copy-code-btn:hover { background:rgba(255,255,255,.10); color:#fff; }
.message-actions { display:flex; gap:2px; margin-top:8px; opacity:0; transition:opacity .12s ease; }
.message.assistant:hover .message-actions, .message-actions:focus-within { opacity:1; }
.message-actions button { width:30px; height:30px; border:0; border-radius:7px; background:transparent; color:var(--muted); padding:0; display:grid; place-items:center; font-size:0; }
.message-actions button::after { font-size:15px; line-height:1; }
.message-actions button:hover { color:var(--text); background:var(--surface-2); }
.message-actions .liked, .message-actions .disliked { color:var(--accent-2); background:var(--surface-2); }

.empty-state { min-height:min(62vh, 620px); display:grid; place-items:center; padding:32px 0; }
.empty-card { text-align:center; max-width:580px; margin:0 auto; }
.empty-mark { width:44px; height:44px; margin:0 auto 18px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(145deg,var(--accent),#5f50c8); color:#fff; font-weight:800; box-shadow:0 7px 24px rgba(0,0,0,.18); }
.empty-card h2 { font-size:28px; letter-spacing:-.03em; margin-bottom:9px; }
.empty-card p { color:var(--muted); font-size:14px; line-height:1.6; }
.empty-card .empty-actions { display:flex; justify-content:center; margin-top:18px; }
.empty-primary { padding:9px 13px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); color:var(--text); font-size:13px; }
.empty-primary:hover { background:var(--surface-3); border-color:var(--border-strong); }

.input-wrapper {
  position:fixed; left:var(--sidebar-width); right:0; bottom:0; z-index:25;
  padding:0 16px calc(10px + var(--safe-bottom));
  background:linear-gradient(to top, var(--bg) 52%, rgba(33,33,33,0));
  pointer-events:none;
}
.composer-shell { width:min(100%, var(--composer-max)); margin:0 auto; pointer-events:auto; }
.image-previews { display:flex; gap:8px; flex-wrap:wrap; max-height:86px; overflow:auto; padding:0 0 8px; }
.preview-thumb { position:relative; width:56px; height:56px; flex:0 0 56px; overflow:hidden; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); }
.preview-thumb img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
.preview-thumb .remove-thumb { position:absolute; top:3px; right:3px; width:20px; height:20px; border:0; border-radius:50%; background:rgba(0,0,0,.68); color:#fff; display:grid; place-items:center; font-size:12px; }
.input-area {
  min-width:0; display:flex; align-items:flex-end; gap:7px; padding:7px;
  border:1px solid var(--border-strong); border-radius:var(--composer-radius); background:var(--surface);
  box-shadow:0 8px 30px rgba(0,0,0,.16);
}
.input-area:focus-within { border-color:rgba(255,255,255,.20); }
.light-mode .input-area:focus-within { border-color:rgba(0,0,0,.18); }
.input-area textarea { min-width:0; flex:1; max-height:180px; min-height:42px; resize:none; border:0; outline:0; background:transparent; color:var(--text); line-height:1.45; padding:9px 8px; font-size:15px; overflow-y:auto; }
.input-area textarea::placeholder { color:var(--muted); }
.tool-icon-btn { flex:0 0 38px; height:38px; border-radius:11px; }
.plus-toggle { border:1px solid transparent; background:transparent; color:var(--text-2); }

.send-btn { flex:0 0 38px; width:38px; height:38px; border-radius:12px; background:var(--text); color:var(--bg); display:grid; place-items:center; transition:opacity .15s ease, transform .06s ease; }
.send-btn:hover:not(:disabled) { opacity:.9; }
.send-btn:active:not(:disabled) { transform:scale(.97); }
.send-btn:disabled { opacity:.42; cursor:not-allowed; }
.plus-menu {
  position:absolute; left:calc(50% - min(100%, var(--composer-max))/2); bottom:82px;
  width:min(100%, 360px); display:grid; grid-template-columns:repeat(2,1fr); gap:3px;

.plus-menu-item:hover { background:var(--surface-2); color:var(--text); }
.plus-menu-item .icon { width:21px; height:21px; display:grid; place-items:center; border-radius:6px; background:var(--surface-2); color:var(--text-2); font-size:12px; }
.footer-note { text-align:center; color:var(--muted); font-size:10px; padding:6px 0 0; }

.scroll-bottom-btn { position:fixed; right:22px; bottom:101px; width:36px; height:36px; border:1px solid var(--border-strong); border-radius:50%; background:var(--surface); color:var(--text); box-shadow:0 8px 20px rgba(0,0,0,.18); display:none; place-items:center; z-index:24; }
.scroll-bottom-btn.visible { display:grid; }

.account-menu, .context-menu {

  border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.26); padding:5px; min-width:210px;
}
.account-menu { left:9px; bottom:calc(61px + var(--safe-bottom)); }
.context-menu { min-width:150px; }
.account-menu[hidden], .context-menu[hidden] { display:none; }
.account-menu-header { padding:9px 10px 10px; border-bottom:1px solid var(--border); margin-bottom:4px; }
.account-menu-name { font-size:12px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.account-menu-email { font-size:10px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.menu-item { width:100%; display:flex; align-items:center; gap:9px; padding:8px 9px; border:0; background:transparent; color:var(--text-2); border-radius:8px; text-align:left; font-size:12px; }
.menu-item:hover { background:var(--surface-2); color:var(--text); }
.menu-item.danger:hover { color:var(--danger); }
.context-menu .menu-item { font-size:12px; }

.mobile-backdrop { display:none; position:fixed; inset:0; background:var(--overlay); z-index:35; opacity:0; }
.mobile-backdrop.active { display:block; opacity:1; }
body.modal-open { overflow:hidden; }

.modal-overlay {
  position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:center; justify-content:center;
  padding:18px; opacity:0; pointer-events:none; transition:opacity .12s ease;
}
.modal-overlay.active { opacity:1; pointer-events:auto; }
.modal-box, .pin-modal-content, .crop-modal-content, .camera-modal-content {
  width:min(100%, 480px); max-height:min(88vh, 760px); overflow:auto; background:var(--surface); color:var(--text);
  border:1px solid var(--border-strong); border-radius:14px; box-shadow:0 24px 80px rgba(0,0,0,.34); padding:19px;
}
.modal-box p, .pin-modal-content p { margin-bottom:15px; line-height:1.5; font-size:13px; }
.modal-buttons { display:flex; justify-content:flex-end; gap:7px; }

.modal-buttons button:hover, .pin-modal-content button:hover, .crop-buttons button:hover { background:var(--surface-3); }
.pin-input-wrapper { position:relative; width:190px; margin-bottom:12px; }
.pin-input-wrapper input { width:100%; height:42px; padding:0 40px 0 12px; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface-2); color:var(--text); text-align:center; letter-spacing:.25em; }
.toggle-pin { position:absolute; top:50%; right:6px; transform:translateY(-50%); width:30px; height:30px; border:0; background:transparent !important; color:var(--muted); padding:0 !important; }
.lock-overlay { position:absolute; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px; background:var(--bg); }
.lock-overlay p { color:var(--text-2); font-size:13px; }
.lock-overlay .error, .error { color:var(--danger); font-size:12px; min-height:18px; }
.crop-modal-content { width:min(92vw, 800px); }
.crop-container { width:100%; height:min(60vh, 500px); background:#000; border-radius:10px; overflow:hidden; }
.crop-container img { max-width:100%; }
.crop-buttons { display:flex; justify-content:center; flex-wrap:wrap; gap:7px; margin-top:12px; }
.camera-modal-content { width:min(92vw, 520px); }
.camera-modal-content video { width:100%; max-height:60vh; border-radius:10px; background:#000; }
.lightbox-overlay { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.90); cursor:zoom-out; }
.lightbox-overlay[hidden] { display:none; }
.lightbox-overlay img { max-width:95vw; max-height:92vh; border-radius:12px; }

.typing-message { display:flex; align-items:center; gap:4px; min-height:24px; color:var(--muted); }
.typing-dots { display:inline-flex; gap:3px; align-items:center; }
.typing-dots span { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.32; animation:typingPulse 1.05s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay:.12s; }
.typing-dots span:nth-child(3) { animation-delay:.24s; }
@keyframes typingPulse { 0%,60%,100%{opacity:.28;transform:translateY(0)} 30%{opacity:.9;transform:translateY(-2px)} }

@media (max-width: 1250px) {
  :root { --sidebar-width:248px; --content-max:820px; --composer-max:780px; }
}
@media (max-width: 1000px) {
  :root { --sidebar-width:232px; --content-max:760px; --composer-max:730px; }
  .header-actions > .desktop-only { display:none; }
  .header-profile { display:grid; }
}
@media (max-width: 768px) {
  .app-shell { height:var(--viewport-height); }
  .sidebar { position:fixed; top:0; left:0; bottom:0; width:min(86vw, 318px); flex-basis:auto; transform:translateX(-100%); box-shadow:18px 0 44px rgba(0,0,0,.28); }
  .sidebar.open { transform:translateX(0); }
  .sidebar.hidden { transform:translateX(-100%); }
  .close-sidebar-btn { display:grid; }
  .header { padding-left:7px; padding-right:7px; }
  .header h1 { font-size:14px; }
  .header-subtitle { display:none; }
  .messages { padding:8px 12px calc(148px + var(--safe-bottom)); }
  .message { font-size:15px; }
  .message.user { max-width:88%; }
  .message.assistant { padding:0 2px; margin-bottom:25px; }
  .input-wrapper { left:0; padding:0 8px calc(8px + var(--safe-bottom)); }
  .input-area { border-radius:22px; }
  .plus-menu { left:8px; width:min(94vw, 320px); bottom:79px; }
  .scroll-bottom-btn { right:14px; bottom:99px; }
  .message-actions { opacity:1; }
  .account-menu { left:8px; bottom:calc(61px + var(--safe-bottom)); }
}
@media (max-width: 430px) {
  .messages { padding-left:10px; padding-right:10px; }
  .message { font-size:14px; line-height:1.62; }
  .message.user { max-width:92%; padding:9px 12px; }
  .empty-card h2 { font-size:24px; }
  .input-area { gap:5px; padding:6px; }
  .tool-icon-btn, .send-btn { flex-basis:36px; width:36px; height:36px; }
  .input-area textarea { padding:8px 6px; }
}
@media (max-height: 520px) and (orientation:landscape) {
  .messages { padding-bottom:132px; }
  .input-wrapper { padding-bottom:6px; }
  .plus-menu { bottom:70px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div id="appLoading">
  <div class="loading-card"><div class="loading-mark"></div><div>Loading Vexel…</div></div>
</div>
<div class="app-shell" id="appShell" aria-hidden="true">
  <div class="mobile-backdrop" id="mobileBackdrop" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="sidebar-header">
      <div class="sidebar-top">
        <a href="/" class="brand" aria-label="Vexel AI home"><span class="brand-mark">V</span><span>Vexel</span></a>
        <button class="close-sidebar-btn" id="closeSidebarBtn" type="button" aria-label="Close sidebar" onclick="toggleSidebar(false)">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="new-chat-btn" type="button" onclick="createNewChat(true)">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>New chat</span>
      </button>
      <div class="sidebar-tools">
        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input class="search-box" id="searchInput" type="search" placeholder="Search chats" autocomplete="off" oninput="filterChats()" aria-label="Search chats">
        </div>
        <button class="tool-icon-btn" id="incognitoToggle" type="button" onclick="toggleIncognito()" title="Incognito mode" aria-label="Toggle incognito mode" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M6 12l1.4-4h9.2L18 12M8 16.5a2.5 2.5 0 1 0 0-5M16 16.5a2.5 2.5 0 1 0 0-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-icon-btn" id="bulkToggleBtn" type="button" onclick="toggleBulkMode()" title="Select chats to delete" aria-label="Bulk delete chats" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="chat-section-label">Recent chats</div>
    <div class="chat-list" id="chatList" role="list"></div>
    <div class="sidebar-bottom">
      <button class="profile-button" id="profileButton" type="button" aria-haspopup="menu" aria-expanded="false" onclick="toggleAccountMenu()">
        <span class="avatar" id="profileAvatar">V</span>
        <span class="profile-meta"><span class="profile-name" id="profileName">Guest</span><span class="profile-state" id="profileState">Not signed in</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="account-menu" id="accountMenu" hidden role="menu" aria-label="Account menu">
        <div class="account-menu-header"><div class="account-menu-name" id="accountMenuName">Guest</div><div class="account-menu-email" id="accountMenuEmail">Not signed in</div></div>
        <button class="menu-item" type="button" role="menuitem" id="themeMenuBtn" onclick="toggleTheme(); closeAccountMenu();">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M16.5 12a4.5 4.5 0 1 1-5.8-4.3A5.5 5.5 0 0 0 16.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="themeMenuLabel">Switch theme</span>
        </button>
        <a class="menu-item" role="menuitem" id="menuLoginLink" href="/login.html">Log in</a>
        <a class="menu-item" role="menuitem" id="menuSignupLink" href="/signup.html">Sign up</a>
        <button class="menu-item danger" type="button" role="menuitem" id="menuLogoutBtn" onclick="logout()" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M13 8l4 4-4 4M7 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="main-area">
    <header class="header" id="mainHeader">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" type="button" onclick="toggleSidebar()" aria-label="Open sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="header-title"><h1>Vexel</h1><span class="header-subtitle" id="headerSubtitle">AI assistant</span></div>
      </div>
      <div class="header-actions" id="authButtonsContainer">
        <a href="/signup.html" class="auth-link desktop-only" id="signupLink">Sign up</a>
        <a href="/login.html" class="auth-link desktop-only" id="loginLink">Log in</a>
        <button class="icon-btn desktop-only" type="button" onclick="toggleTheme()" title="Switch theme" aria-label="Switch theme" id="themeHeaderBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M16.5 12a4.5 4.5 0 1 1-5.8-4.3A5.5 5.5 0 0 0 16.5 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn desktop-only" type="button" onclick="downloadChat()" title="Download chat" aria-label="Download chat">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn desktop-only" type="button" onclick="shareChat()" title="Share chat" aria-label="Share chat">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0 4 4m-4-4L8 8M5 12v7h14v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn desktop-only" type="button" onclick="clearCurrentChat()" title="Clear current chat" aria-label="Clear current chat">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3M8 7l1 13h6l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn desktop-only" type="button" id="lockChatBtn" onclick="toggleLockChat()" title="Lock current chat" aria-label="Lock current chat">
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="profile-button header-profile" id="headerProfileButton" type="button" aria-haspopup="menu" aria-label="Open account menu" onclick="toggleAccountMenu(true, true)" style="width:40px; padding:3px; justify-content:center;">
          <span class="avatar" id="headerProfileAvatar">V</span>
        </button>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite"></section>

    <div class="input-wrapper">
      <div class="composer-shell">
        <div class="image-previews" id="imagePreviews"></div>
        <input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleImageSelection(event)">
        <input type="file" id="pdfInput" accept="application/pdf" hidden onchange="handlePDFSelection(event)">
        <div class="input-area">
          <button class="tool-icon-btn plus-toggle" id="plusToggle" type="button" onclick="togglePlusMenu()" aria-label="Open tools" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <textarea id="promptInput" rows="1" placeholder="Message Vexel…" aria-label="Message Vexel"></textarea>
          <button id="sendBtn" class="send-btn" type="button" onclick="sendMessage()" aria-label="Send message">
            <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-5 16-3.5-6.5L4 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m11.5 13.5 8.5-9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="plus-menu" id="plusMenu" role="menu" aria-label="Message tools">
          <button class="plus-menu-item" type="button" role="menuitem" onclick="document.getElementById('imageInput').click(); togglePlusMenu(false);"><span class="icon">↥</span><span>Images</span></button>
          <button class="plus-menu-item" type="button" role="menuitem" onclick="document.getElementById('pdfInput').click(); togglePlusMenu(false);"><span class="icon">▤</span><span>PDF</span></button>
          <button class="plus-menu-item" id="micMenuItem" type="button" role="menuitem" onclick="startVoiceInput(); togglePlusMenu(false);" style="display:none;"><span class="icon">●</span><span>Voice</span></button>
          <button class="plus-menu-item" type="button" role="menuitem" onclick="openCamera(); togglePlusMenu(false);"><span class="icon">▣</span><span>Camera</span></button>
          <button class="plus-menu-item" type="button" role="menuitem" onclick="generateImage(); togglePlusMenu(false);"><span class="icon">✦</span><span>Create image</span></button>
        </div>
        <div class="footer-note">Vexel can make mistakes. Check important information.</div>
      </div>
    </div>
  </main>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalText">
  <div class="modal-box"><p id="deleteModalText">Are you sure you want to delete this chat?</p><div class="modal-buttons"><button type="button" onclick="closeDeleteModal()">Cancel</button><button type="button" class="confirm-delete" id="confirmDeleteBtn">Delete</button></div></div>
</div>

<!-- Bulk delete modal -->
<div class="modal-overlay" id="bulkDeleteModal" role="dialog" aria-modal="true" aria-labelledby="bulkDeleteModalText">
  <div class="modal-box"><p id="bulkDeleteModalText">Are you sure you want to delete the selected chats?</p><div class="modal-buttons"><button type="button" onclick="closeBulkDeleteModal()">Cancel</button><button type="button" class="confirm-delete" id="confirmBulkDeleteBtn">Delete</button></div></div>
</div>

<!-- Crop modal -->
<div class="modal-overlay" id="cropModal" role="dialog" aria-modal="true" aria-label="Crop image">
  <div class="crop-modal-content"><div class="crop-container"><img id="cropImage" alt="Image to crop"></div><div class="crop-buttons"><button type="button" onclick="applyCrop()">Crop &amp; save</button><button type="button" onclick="cancelCrop()">Cancel</button></div></div>
</div>

<!-- Camera modal -->
<div class="modal-overlay" id="cameraModal" role="dialog" aria-modal="true" aria-label="Camera">
  <div class="camera-modal-content"><video id="cameraVideo" autoplay playsinline aria-label="Camera preview"></video><div class="crop-buttons"><button type="button" onclick="capturePhoto()">Capture</button><button type="button" onclick="closeCamera()">Cancel</button><button id="torchBtn" type="button" onclick="toggleTorch()" aria-label="Toggle torch">Torch</button></div></div>
</div>

<!-- PIN modal -->
<div class="modal-overlay" id="pinModal" role="dialog" aria-modal="true" aria-labelledby="pinModalTitle">
  <div class="pin-modal-content"><p id="pinModalTitle">Set a 4-digit PIN to lock this chat:</p><div class="pin-input-wrapper"><input type="password" id="newPinInput" maxlength="4" inputmode="numeric" placeholder="PIN" autocomplete="off" aria-label="PIN"><button type="button" class="toggle-pin" id="toggleNewPinBtn" aria-label="Show PIN" onclick="toggleNewPinVisibility()">◉</button></div><div class="error" id="pinError"></div><div class="modal-buttons"><button type="button" onclick="closePinModal()">Cancel</button><button type="button" id="confirmPinBtn">Continue</button></div></div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox-overlay" hidden role="dialog" aria-modal="true" aria-label="Image preview"><img id="lightboxImg" src="" alt="Expanded attachment"></div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // ========== DOM refs ==========
  const supabaseClient = window.vexelSupabase;
  const messagesDiv = document.getElementById('messages');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const imagePreviewsContainer = document.getElementById('imagePreviews');
  const imageInput = document.getElementById('imageInput');
  const pdfInput = document.getElementById('pdfInput');
  const micMenuItem = document.getElementById('micMenuItem');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menuToggle');
  const mainHeader = document.getElementById('mainHeader');
  const incognitoToggle = document.getElementById('incognitoToggle');
  const lockChatBtn = document.getElementById('lockChatBtn');
  const plusMenu = document.getElementById('plusMenu');
  const plusToggle = document.getElementById('plusToggle');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const pinModal = document.getElementById('pinModal');
  const newPinInput = document.getElementById('newPinInput');
  const confirmPinBtn = document.getElementById('confirmPinBtn');
  const pinErrorEl = document.getElementById('pinError');
  const pinModalTitle = document.getElementById('pinModalTitle');
  const bulkToggleBtn = document.getElementById('bulkToggleBtn');
  const bulkDeleteModal = document.getElementById('bulkDeleteModal');
  const bulkDeleteModalText = document.getElementById('bulkDeleteModalText');
  const confirmBulkDeleteBtn = document.getElementById('confirmBulkDeleteBtn');
  const torchBtn = document.getElementById('torchBtn');
  const appLoading = document.getElementById('appLoading');
  const appShell = document.getElementById('appShell');
  const mobileBackdrop = document.getElementById('mobileBackdrop');
  const profileButton = document.getElementById('profileButton');
  const headerProfileButton = document.getElementById('headerProfileButton');
  const accountMenu = document.getElementById('accountMenu');
  const profileAvatar = document.getElementById('profileAvatar');
  const headerProfileAvatar = document.getElementById('headerProfileAvatar');
  const profileName = document.getElementById('profileName');
  const profileState = document.getElementById('profileState');
  const accountMenuName = document.getElementById('accountMenuName');
  const accountMenuEmail = document.getElementById('accountMenuEmail');
  const menuLoginLink = document.getElementById('menuLoginLink');
  const menuSignupLink = document.getElementById('menuSignupLink');
  const menuLogoutBtn = document.getElementById('menuLogoutBtn');

  let isWaiting = false;
  let selectedImages = [];
  let allChats = [];
  let activeChatId = null;
  let chatHistory = [];
  let lastUserPrompt = null;
  let lastUserParts = null;
  let pendingDeleteChatId = null;
  let isIncognito = false;
  let recognition = null;
  let isRecording = false;
  let currentCropIndex = null;
  let cropper = null;
  let cameraStream = null;
  let unlockedChats = new Set();
  let pendingLockChatId = null;
  let pendingLockReason = '';
  let isBulkMode = false;
  let selectedChats = new Set();
  let scrollBottomBtn = null;
  let currentUser = null;
  let currentSession = null;
  let appInitialized = false;
  let dbReady = true;
  let initToken = 0;
  const saveQueues = new Map();

  const userKey = (suffix) => currentUser ? `vexel:${currentUser.id}:${suffix}` : null;
  const activeChatStorageKey = () => userKey('activeChat');
  const draftStorageKey = (chatId) => currentUser && chatId ? `vexel:${currentUser.id}:draft:${chatId}` : null;
  const feedbackStorageKey = () => userKey('feedback');

  async function initializeApp(session) {
    const token = ++initToken;
    currentSession = session || null;
    currentUser = session?.user || null;
    appShell.setAttribute('aria-hidden', 'false');
    updateAuthUI();

    try {
      if (!supabaseClient) throw new Error('Supabase failed to initialize.');
      await loadAllChats();
      if (token !== initToken) return;

      if (currentUser) {
        const storedId = localStorage.getItem(activeChatStorageKey());
        activeChatId = storedId && allChats.some(c => c.id === storedId) ? storedId : (allChats[0]?.id || null);
        if (activeChatId) localStorage.setItem(activeChatStorageKey(), activeChatId);
        chatHistory = [];
        if (activeChatId) loadActiveChat();
        else renderEmptyState();
      } else {
        activeChatId = null;
        chatHistory = [];
        renderEmptyState(true);
      }

      renderChatList();
      updateLockButtonState();
      clearDraftUI();
      if (activeChatId) loadDraft(activeChatId);
      updateResponsiveLayout();
    } catch (error) {
      console.error('Vexel initialization error:', error);
      dbReady = false;
      allChats = [];
      activeChatId = null;
      chatHistory = [];
      renderSystemError('Chat history is unavailable right now. Your account is still signed in, but cloud history could not be loaded.');
    } finally {
      if (token === initToken) {
        appInitialized = true;
        appLoading.hidden = true;
        promptInput.focus();
      }
    }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    scrollBottomBtn = document.createElement('button');
    scrollBottomBtn.className = 'scroll-bottom-btn';
    scrollBottomBtn.type = 'button';
    scrollBottomBtn.setAttribute('aria-label', 'Scroll to latest message');
    scrollBottomBtn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m0 0 5-5m-5 5-5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    scrollBottomBtn.onclick = () => messagesDiv.scrollTo({top:messagesDiv.scrollHeight, behavior:'smooth'});
    messagesDiv.appendChild(scrollBottomBtn);
    messagesDiv.addEventListener('scroll', () => {
      const atBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 60;
      scrollBottomBtn.classList.toggle('visible', !atBottom);
    }, { passive: true });

    document.getElementById('confirmDeleteBtn').addEventListener('click', executeDelete);
    confirmBulkDeleteBtn.addEventListener('click', executeBulkDelete);

    confirmPinBtn.addEventListener('click', handlePinConfirmation);
    newPinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handlePinConfirmation(); });

    promptInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    promptInput.addEventListener('input', function() {
      this.style.height = '44px';
      this.style.height = Math.min(this.scrollHeight, 180) + 'px';
      if (!isIncognito && activeChatId) saveDraft(activeChatId);
    });

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = event => {
        promptInput.value = `${promptInput.value}${promptInput.value ? ' ' : ''}${event.results[0][0].transcript}`;
        promptInput.dispatchEvent(new Event('input'));
        promptInput.focus();
        stopRecordingUI();
      };
      recognition.onerror = () => stopRecordingUI();
      recognition.onend = () => stopRecordingUI();
      micMenuItem.style.display = 'flex';
    }

    messagesDiv.addEventListener('click', (e) => {
      const image = e.target.closest('.chat-img');
      if (image) { lightboxImg.src = image.src; lightbox.hidden = false; }
    });

    mobileBackdrop.addEventListener('click', () => toggleSidebar(false));
    lightbox.addEventListener('click', () => { lightbox.hidden = true; lightboxImg.src = ''; });

    window.addEventListener('resize', updateResponsiveLayout);
    document.addEventListener('click', handleGlobalPointerDown);

  function renderImagePreviews(){imagePreviewsContainer.innerHTML='';selectedImages.forEach((img,index)=>{const thumb=document.createElement('div');thumb.className='preview-thumb';const image=document.createElement('img');image.src=img.previewUrl;image.alt=`Attachment ${index+1}`;const remove=document.createElement('button');remove.className='remove-thumb';remove.type='button';remove.setAttribute('aria-label',`Remove attachment ${index+1}`);remove.textContent='×';image.addEventListener('click',e=>{e.stopPropagation();openCropModal(index);});remove.addEventListener('click',e=>{e.stopPropagation();selectedImages.splice(index,1);renderImagePreviews();saveDraft(activeChatId);});thumb.append(image,remove);imagePreviewsContainer.appendChild(thumb);});}
  function renderAllMessages(){removeLockOverlay();messagesDiv.innerHTML='';const column=document.createElement('div');column.className='message-column';messagesDiv.appendChild(column);if(chatHistory.length===0){const empty=document.createElement('div');empty.className='empty-state';empty.innerHTML='<div class="empty-card"><div class="empty-mark">V</div><h2>How can I help?</h2><p>Ask a question, upload an image or PDF, or use one of the tools in the composer.</p></div>';column.appendChild(empty);return;}chatHistory.forEach(msg=>{const role=msg.role==='model'?'assistant':'user';const textPart=(msg.parts||[]).find(p=>p.text);const imageParts=(msg.parts||[]).filter(p=>p.inline_data);let text=textPart?.text||'';let imgHtml='';imageParts.forEach(part=>{const mime=String(part.inline_data.mime_type||'image/png').replace(/[^a-zA-Z0-9.+\/-]/g,'');imgHtml+=`<img src="data:${mime};base64,${part.inline_data.data}" class="chat-img" alt="Attachment">`;});renderMessage(role,escapeHtml(text).replace(/\n/g,'<br>')+imgHtml,null,false,role==='user');});requestAnimationFrame(()=>{messagesDiv.scrollTop=messagesDiv.scrollHeight;});}
  function sanitizeAssistantHtml(html){const template=document.createElement('template');template.innerHTML=html;const blocked=['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','TEXTAREA','SELECT','OPTION','VIDEO','AUDIO','SOURCE','META','LINK'];template.content.querySelectorAll('*').forEach(el=>{if(blocked.includes(el.tagName)){el.remove();return;}[...el.attributes].forEach(attr=>{const name=attr.name.toLowerCase();const value=attr.value.trim();if(name.startsWith('on'))el.removeAttribute(attr.name);if(name==='href'&&!/^(https?:|mailto:)/i.test(value))el.setAttribute('href','#');if(name==='src'&&!/^(https?:\/\/|data:image\/)/i.test(value))el.removeAttribute(attr.name);if(name==='target')el.setAttribute('rel','noopener noreferrer');});});return template.innerHTML;}
  function renderMessage(role,content,unused,smoothScroll=true,skipActions=false){const div=document.createElement('div');div.className=`message ${role}`;if(role==='assistant'){const markedHtml=typeof marked!=='undefined'?marked.parse(content,{mangle:false,headerIds:false}):escapeHtml(content);div.innerHTML=sanitizeAssistantHtml(markedHtml);if(typeof renderMathInElement==='function'){renderMathInElement(div,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});}attachCodeCopyButtons(div);if(!skipActions)addMessageActions(div,content,false);}else{div.innerHTML=content;}let column=messagesDiv.querySelector('.message-column');if(!column){column=document.createElement('div');column.className='message-column';messagesDiv.appendChild(column);}column.appendChild(div);if(smoothScroll)messagesDiv.scrollTop=messagesDiv.scrollHeight;return div;}
  function addMessageActions(div,content,skipActions){
  if(skipActions)return;
  const actions=document.createElement('div');
  actions.className='message-actions';
  const makeButton=(label,svg,handler,cls='')=>{
    const b=document.createElement('button'); b.type='button'; b.className=cls; b.setAttribute('aria-label',label); b.title=label; b.innerHTML=svg; b.onclick=handler; return b;
  };
  const copy=makeButton('Copy response','<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 16V6a2 2 0 0 1 2-2h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',async()=>{try{await navigator.clipboard.writeText(stripHtml(content));copy.setAttribute('aria-label','Copied');setTimeout(()=>{copy.setAttribute('aria-label','Copy response')},1200);}catch{copy.setAttribute('aria-label','Copy failed');setTimeout(()=>copy.setAttribute('aria-label','Copy response'),1200);}});
  const regen=makeButton('Regenerate response','<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 1 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',()=>regenerateResponse());
  const like=makeButton('Like','<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H4V10h3Zm0 10h8.4a2 2 0 0 0 1.96-1.61l1.1-5.5A2 2 0 0 0 16.5 10H13l.5-3.2A2.34 2.34 0 0 0 11.2 4.5L7 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',()=>toggleFeedback('like',like),'like-btn');
  const dislike=makeButton('Dislike','<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14V4H4v10h3Zm0-10h8.4a2 2 0 0 1 1.96 1.61l1.1 5.5A2 2 0 0 1 16.5 14H13l.5 3.2a2.34 2.34 0 0 1-2.3 2.3L7 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',()=>toggleFeedback('dislike',dislike),'dislike-btn');
  actions.append(copy,regen,like,dislike); div.appendChild(actions);
}
  function stripHtml(value){const temp=document.createElement('div');temp.innerHTML=value;return temp.textContent||temp.innerText||'';}
  function attachCodeCopyButtons(container){container.querySelectorAll('pre').forEach(pre=>{if(pre.querySelector('.copy-code-btn'))return;const btn=document.createElement('button');btn.className='copy-code-btn';btn.type='button';btn.textContent='Copy';btn.onclick=async()=>{try{await navigator.clipboard.writeText(pre.querySelector('code')?.innerText||'');btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200);}catch{btn.textContent='Failed';setTimeout(()=>btn.textContent='Copy',1200);}};pre.appendChild(btn);});}
  function showTyping(){removeTyping();const div=document.createElement('div');div.className='message assistant typing-message';div.id='typingIndicator';div.innerHTML='<span class="typing-dots" aria-label="Vexel is thinking"><span></span><span></span><span></span></span>';const column=messagesDiv.querySelector('.message-column')||messagesDiv;column.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight;}
  function removeTyping(){document.getElementById('typingIndicator')?.remove();}
  // ========== IMAGE / PDF / VOICE / CAMERA / CROP ==========
  function handleImageSelection(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      if (selectedImages.length >= 4) { alert('Max 4 images'); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = e.target.result.split(',')[1];
        selectedImages.push({ mimeType: file.type, data: base64, previewUrl: e.target.result, id: Date.now()+Math.random() });
        renderImagePreviews();
        saveDraft(activeChatId);
      };
      reader.readAsDataURL(file);
    });
    imageInput.value = '';
  }

  async function handlePDFSelection(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
      }
      promptInput.value = promptInput.value + '\n\n[PDF Content]:\n' + fullText.slice(0,5000);
    } catch(e) { alert('Failed to extract PDF text.'); }
    pdfInput.value = '';
  }

  function startVoiceInput() {
    if (!recognition) return;
    if (isRecording) { recognition.stop(); return; }
    isRecording = true;
    micMenuItem.querySelector('.icon').textContent = '🎙️';
    recognition.start();
  }

  function stopRecordingUI() {
    isRecording = false;
    const el = document.getElementById('micMenuItem');
    if (el) el.querySelector('.icon').textContent = '🎤';
  }

  async function openCamera() {
    const video = document.getElementById('cameraVideo');
    const modal = document.getElementById('cameraModal');

    if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
      alert('Camera is not available in this browser or page. Make sure Vexel is opened with HTTPS.');
      return;
    }

    try {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
      } catch (firstError) {
        console.warn('Preferred camera request failed; retrying with a basic webcam request.', firstError);
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }

      cameraStream = stream;
      video.srcObject = stream;
      modal.classList.add('active');

      await new Promise(resolve => {
        if (video.readyState >= 1 && video.videoWidth > 0) {
          resolve();
          return;
        }
        const onLoaded = () => {
          video.removeEventListener('loadedmetadata', onLoaded);
          resolve();
        };
        video.addEventListener('loadedmetadata', onLoaded, { once: true });
      });

      try {
        await video.play();
      } catch (playError) {
        console.warn('Camera preview autoplay was blocked:', playError);
      }
    } catch (err) {
      console.error('Camera error:', err);
      const name = err?.name || '';
      let message = 'Vexel could not open your camera.';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        message = 'Camera permission was denied. Allow camera access for Vexel in Chrome site settings, then try again.';
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        message = 'No camera was found on this device.';
      } else if (name === 'NotReadableError' || name === 'TrackStartError') {
        message = 'Your camera is already being used by another app or browser tab.';
      } else if (name === 'SecurityError') {
        message = 'The browser blocked camera access for security reasons. Open Vexel over HTTPS.';
      }
      alert(message);
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      modal.classList.remove('active');
    }
  }

  function toggleTorch() {
    if (!cameraStream) return;
    const track = cameraStream.getVideoTracks()[0];
    if (!track) return;

    const capabilities = typeof track.getCapabilities === 'function' ? track.getCapabilities() : {};
    if (!capabilities.torch) {
      alert('Torch is not supported by this camera.');
      return;
    }

    const enabled = Boolean(track.getSettings().torch);
    track.applyConstraints({ advanced: [{ torch: !enabled }] })
      .then(() => {
        const button = document.getElementById('torchBtn');
        if (button) button.textContent = !enabled ? '💡✅' : '💡';
      })
      .catch(error => console.warn('Torch could not be toggled:', error));
  }

  function capturePhoto() {
    const video = document.getElementById('cameraVideo');

    if (!cameraStream || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
      alert('The camera preview is not ready yet. Wait for the preview to appear, then press Capture.');
      return;
    }

    if (selectedImages.length >= 4) {
      alert('Max 4 images');
      closeCamera();
      return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');
    if (!ctx) {
      alert('Vexel could not capture the camera frame.');
      return;
    }

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

    selectedImages.push({
      mimeType: 'image/jpeg',
      data: dataUrl.split(',')[1],
      previewUrl: dataUrl,
      id: Date.now() + Math.random()
    });

    renderImagePreviews();
    saveDraft(activeChatId);
    closeCamera();
  }

  function closeCamera() {
    if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
    document.getElementById('cameraModal').classList.remove('active');
  }

  function openCropModal(index) {
    currentCropIndex = index;
    const img = selectedImages[index];
    document.getElementById('cropImage').src = img.previewUrl;
    document.getElementById('cropModal').classList.add('active');
    if (cropper) cropper.destroy();
    cropper = new Cropper(document.getElementById('cropImage'), {
      aspectRatio: NaN, viewMode: 1, autoCropArea: 0.8, responsive: true, background: false,
      zoomable: true, rotatable: true, scalable: true
    });
  }

  function applyCrop() {
    if (!cropper || currentCropIndex === null) return;
    const canvas = cropper.getCroppedCanvas();
    const dataUrl = canvas.toDataURL(selectedImages[currentCropIndex].mimeType);
    selectedImages[currentCropIndex].data = dataUrl.split(',')[1];
    selectedImages[currentCropIndex].previewUrl = dataUrl;
    cropper.destroy();
    cropper = null;
    document.getElementById('cropModal').classList.remove('active');
    renderImagePreviews();
    saveDraft(activeChatId);
  }

  function cancelCrop() {
    if (cropper) cropper.destroy();
    cropper = null;
    document.getElementById('cropModal').classList.remove('active');
    currentCropIndex = null;
  }

  // ========== IMAGE GENERATION ==========
  async function generateImage() {
    const description = promptInput.value.trim() || prompt('Describe the image you want to generate:');
    if (!description) return;
    renderMessage('user', escapeHtml(description).replace(/\n/g,'<br>'), null, true, false);
    chatHistory.push({ role: 'user', parts: [{ text: description }] });
    saveCurrentChatIfNeeded();

    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(description)}?width=512&height=512&nologo=true`;
    try {
      const tempDiv = document.createElement('div');
      tempDiv.className = 'typing';
      tempDiv.innerHTML = '<span></span><span></span><span></span>';
      messagesDiv.appendChild(tempDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const response = await fetch(url);
      const blob = await response.blob();
      const dataUrl = URL.createObjectURL(blob);
      tempDiv.remove();

      const imgMsg = document.createElement('div');
      imgMsg.className = 'message assistant';
      imgMsg.innerHTML = `<img src="${dataUrl}" class="chat-img" alt="Generated image" />`;
      messagesDiv.appendChild(imgMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        chatHistory.push({ role: 'model', parts: [{ inline_data: { mime_type: 'image/png', data: base64 } }] });
        saveCurrentChatIfNeeded();
      };
      reader.readAsDataURL(blob);
    } catch(err) { alert('Image generation failed.'); }
  }

  // ========== SHARE & DOWNLOAD ==========
  function shareChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `*${role}:* ${textPart.text}\n\n`;
    });
    const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
    const choice = confirm('Share via WhatsApp? Click OK for WhatsApp, Cancel to copy to clipboard.');
    if (choice) window.open(whatsappUrl, '_blank');
    else navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
  }
  function downloadChat() {
    let text = '';
    chatHistory.forEach(msg => {
      const role = msg.role === 'model' ? 'AI' : 'You';
      const textPart = msg.parts.find(p => p.text);
      if (textPart) text += `**${role}:** ${textPart.text}\n\n`;
    });
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vexel-chat-${Date.now()}.md`;
    a.click();
  }

  // ========== SEND MESSAGE ==========
  async function sendMessage(regenerating=false){
    if(isWaiting)return;
    const prompt=promptInput.value.trim();
    if((!prompt&&selectedImages.length===0&&!regenerating))return;
    if(!activeChatId&&!isIncognito){await createNewChat(true);if(!activeChatId)return;}
    isWaiting=true;sendBtn.disabled=true;promptInput.disabled=true;removeTyping();
    let userParts=[];
    try{
      if(!regenerating){
        if(prompt)userParts.push({text:prompt});
        selectedImages.forEach(img=>userParts.push({inline_data:{mime_type:img.mimeType,data:img.data}}));
        const safePrompt=escapeHtml(prompt).replace(/\n/g,'<br>');
        const safeImages=selectedImages.map(img=>`<img src="${img.previewUrl}" class="chat-img" alt="Attachment">`).join('');
        renderMessage('user',safePrompt+safeImages,null,true,true);
        promptInput.value='';promptInput.style.height='44px';selectedImages=[];renderImagePreviews();
        saveDraft(activeChatId);lastUserPrompt=prompt;lastUserParts=userParts;
      }else{
        if(chatHistory.at(-1)?.role==='model'){chatHistory.pop();getChatById(activeChatId).messages=chatHistory;await queueCloudSave(activeChatId);const lastAssistant=messagesDiv.querySelector('.message.assistant:last-of-type');lastAssistant?.remove();}
        userParts=lastUserParts||[];
      }
      showTyping();
      const payload={prompt:regenerating?(lastUserPrompt||''):prompt,history:regenerating?chatHistory:[...chatHistory,{role:'user',parts:userParts}],images:regenerating?(lastUserParts||[]).filter(p=>p.inline_data).map(p=>({mimeType:p.inline_data.mime_type,data:p.inline_data.data})):[]};
      const res=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      let data=null;try{data=await res.json();}catch{data={error:{message:'The AI returned an invalid response.'}};}
      removeTyping();
      if(!res.ok||data.error){renderMessage('assistant',escapeHtml(data?.error?.message||'Vexel could not complete the request.'),null,true,false);return;}
      const reply=data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(typeof reply!=='string'){renderMessage('assistant','Vexel returned an unexpected response. Please try again.',null,true,false);return;}
      renderMessage('assistant',reply,null,true,false);
      if(!regenerating)chatHistory.push({role:'user',parts:userParts});
      chatHistory.push({role:'model',parts:[{text:reply}]});
      const chat=getChatById(activeChatId);
      if(chat&&!isIncognito){chat.messages=chatHistory;if(chat.title==='New Chat'){const first=chatHistory.find(m=>m.role==='user');const firstText=first?.parts?.find(p=>p.text)?.text;chat.title=firstText?firstText.replace(/\s+/g,' ').trim().slice(0,70):'File chat';}chat.updatedAt=Date.now();renderChatList();await queueCloudSave(activeChatId);}
    }catch(error){console.error('Send message error:',error);removeTyping();renderMessage('assistant',escapeHtml(error?.message?.toLowerCase().includes('network')?'Network error. Check your connection and try again.':'Vexel could not complete that request. Please try again.'),null,true,false);}finally{isWaiting=false;sendBtn.disabled=false;promptInput.disabled=false;promptInput.focus();}
  }
  async function saveCurrentChat(chatId=activeChatId){if(!chatId||isIncognito||!currentUser)return;const chat=getChatById(chatId);if(!chat)return;chat.messages=chatId===activeChatId?chatHistory:chat.messages;chat.updatedAt=Date.now();if(chat.title==='New Chat'&&chat.messages.length){const first=chat.messages.find(m=>m.role==='user');const text=first?.parts?.find(p=>p.text)?.text;chat.title=text?text.replace(/\s+/g,' ').trim().slice(0,70):'File chat';}try{await queueCloudSave(chatId);renderChatList();}catch(error){console.error('Save chat error:',error);throw error;}}
  function saveCurrentChatIfNeeded(){return saveCurrentChat(activeChatId);}
  function regenerateResponse(){if(isWaiting)return;if(!lastUserPrompt&&!(chatHistory.find(m=>m.role==='user'))){return;}sendMessage(true);}
  async function clearCurrentChat(){if(isWaiting||!activeChatId)return;if(!confirm('Clear this conversation?'))return;chatHistory=[];const chat=getChatById(activeChatId);if(chat){chat.messages=[];chat.updatedAt=Date.now();try{await queueCloudSave(activeChatId);}catch(error){console.error('Clear chat error:',error);alert('The chat could not be cleared.');return;}}clearDraftUI();renderAllMessages();renderChatList();}
  function toggleFeedback(type,button){const key=feedbackStorageKey();if(!key||!activeChatId||isIncognito)return;let feedback={};try{feedback=JSON.parse(localStorage.getItem(key)||'{}');}catch{feedback={};}const assistantNodes=[...messagesDiv.querySelectorAll('.message.assistant')];const index=assistantNodes.indexOf(button.closest('.message.assistant'));const feedbackKey=`${activeChatId}:${index}`;feedback[feedbackKey]=feedback[feedbackKey]===type?null:type;localStorage.setItem(key,JSON.stringify(feedback));button.classList.toggle(type==='like'?'liked':'disliked',feedback[feedbackKey]===type);const sibling=type==='like'?button.nextElementSibling:button.previousElementSibling;sibling?.classList.remove(type==='like'?'disliked':'liked');}
  function toggleTheme(){document.body.classList.toggle('light-mode');const theme=document.body.classList.contains('light-mode')?'light':'dark';localStorage.setItem('vexel_theme',theme);updateThemeIcon();}
  function updateThemeIcon(){const light=document.body.classList.contains('light-mode');const button=document.getElementById('themeHeaderBtn');if(button)button.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');const label=document.getElementById('themeMenuLabel');if(label)label.textContent=light?'Use dark theme':'Use light theme';}
  (function(){if(localStorage.getItem('vexel_theme')==='light')document.body.classList.add('light-mode');updateThemeIcon();})();

  function getInitials(username){const value=String(username||'V').trim();const parts=value.split(/[\s_-]+/).filter(Boolean);if(parts.length>=2)return `${parts[0][0]}${parts[1][0]}`.toUpperCase();return value.slice(0,1).toUpperCase();}
  function updateAuthUI(){
    const loggedIn = Boolean(currentUser);
    const username = currentUser?.user_metadata?.username || currentUser?.email?.split('@')[0] || 'User';
    const initials = getInitials(username);

    [profileAvatar, headerProfileAvatar].forEach(el => {
      if (el) el.textContent = initials;
    });

    profileName.textContent = loggedIn ? username : 'Guest';
    profileState.textContent = loggedIn ? 'Signed in' : 'Not signed in';
    accountMenuName.textContent = loggedIn ? username : 'Guest';
    accountMenuEmail.textContent = loggedIn ? 'Vexel account' : 'Not signed in';

    // Account-menu authentication actions:
    // logged out -> Log in + Sign up
    // logged in  -> Log out only
    menuLoginLink.hidden = loggedIn;
    menuSignupLink.hidden = loggedIn;
    menuLogoutBtn.hidden = !loggedIn;
    const themeMenuBtn = document.getElementById('themeMenuBtn');
    if (themeMenuBtn) themeMenuBtn.hidden = false;

    // Header authentication actions:
    // logged out -> Log in + Sign up
    // logged in  -> neither
    const signupLink = document.getElementById('signupLink');
    const loginLink = document.getElementById('loginLink');
    if (signupLink) signupLink.hidden = loggedIn;
    if (loginLink) loginLink.hidden = loggedIn;

    updateLockButtonState();
  }
  function toggleAccountMenu(forceOpen=null,fromHeader=false){const shouldOpen=forceOpen===null?accountMenu.hidden:forceOpen;accountMenu.hidden=!shouldOpen;accountMenu.classList.toggle('from-header',Boolean(fromHeader&&shouldOpen));profileButton.setAttribute('aria-expanded',String(shouldOpen));headerProfileButton?.setAttribute('aria-expanded',String(shouldOpen));}
  function closeAccountMenu(){accountMenu.hidden=true;accountMenu.classList.remove('from-header');profileButton.setAttribute('aria-expanded','false');headerProfileButton?.setAttribute('aria-expanded','false');}
  async function logout(){
  if(!supabaseClient)return;

  menuLogoutBtn.disabled=true;

  try{
    const {error}=await supabaseClient.auth.signOut();

    if(error)throw error;

  }catch(error){
    console.error('Logout error:',error);
    alert('Vexel could not log you out. Please try again.');

  }finally{
    menuLogoutBtn.disabled=false;
    closeAccountMenu();
  }
}
