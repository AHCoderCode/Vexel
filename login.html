<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Vexel AI — Log in</title>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#212121">

<link rel="apple-touch-icon" href="/icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5962202637347912"
    crossorigin="anonymous"
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>

  <style>
:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: dark;
  --bg:#212121; --surface:#2a2a2a; --surface2:#303030; --surface3:#3a3a3a;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.15);
  --text:#f7f7f8; --muted:#9b9ba3; --accent:#8b7cf6; --accent-hover:#9c8df9;
  --danger:#ef6a6a; --success:#72d6a1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;touch-action:manipulation}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit}
.shell{width:min(100%,430px)}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px;font-weight:720;font-size:19px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#5f50c8);color:#fff;font-size:13px;font-weight:800;box-shadow:0 7px 24px rgba(0,0,0,.18)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:26px;box-shadow:0 20px 70px rgba(0,0,0,.22)}
h1{font-size:24px;letter-spacing:-.03em;text-align:center;margin:0 0 8px}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.5}
.status,.error{min-height:18px;font-size:12px;line-height:1.45;word-break:break-word}
.status{color:var(--success);margin-bottom:7px}.error{color:var(--danger);margin-bottom:2px}
form{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field label{font-size:12px;font-weight:650;margin-bottom:6px;display:block}
.field input{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);padding:0 12px;outline:none;transition:border-color .14s ease,box-shadow .14s ease,background .14s ease}
.field input::placeholder{color:#777780}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,124,246,.11);background:var(--surface3)}
.password-field{position:relative}.password-field input{padding-right:44px}
.eye{position:absolute;right:5px;top:5px;width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.eye:hover{background:rgba(255,255,255,.06);color:var(--text)}.eye:active{transform:scale(.96)}
.hint{color:#777780;font-size:10px;margin-top:5px;line-height:1.4}
.submit{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer;transition:background .14s ease,opacity .14s ease,transform .05s ease}.submit:hover:not(:disabled){background:var(--accent-hover)}.submit:active:not(:disabled){transform:translateY(1px)}.submit:disabled{opacity:.55;cursor:not-allowed}
.switch{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}.switch a{color:#b8afff;text-decoration:none}.switch a:hover{text-decoration:underline}
.home-link{display:block;text-align:center;margin-top:11px;color:var(--muted);font-size:11px;text-decoration:none}.home-link:hover{color:var(--text)}
.note{text-align:center;color:#777780;font-size:10px;margin-top:13px;line-height:1.5}
@media (max-width:460px){body{padding:14px}.row{grid-template-columns:1fr}.card{padding:21px;border-radius:14px}.brand{margin-bottom:15px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

<body>

  <main class="shell">

    <div class="brand">
      <span class="mark">V</span>
      Vexel
    </div>

    <section class="card">

      <h1>Welcome back</h1>

      <p class="subtitle">Log in to continue to your Vexel account.</p>

      <div
        class="status"
        id="status"
        aria-live="polite"
      ></div>

      <div
        class="error"
        id="error"
        aria-live="assertive"
      ></div>

      <form
        id="loginForm"
        novalidate
      >

        <div class="field">
          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            maxlength="20"
            placeholder="Your username"
            required
          />
        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-field">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Your password"
              required
            />

            <button
              type="button"
              class="eye"
              id="passwordEye"
              aria-label="Show password"
              aria-pressed="false"
            >
              ◎
            </button>

          </div>

        </div>

        <button
          class="submit"
          id="submitButton"
          type="submit"
        >
          Log in
        </button>

      </form>

      <p class="switch">
        Don't have an account?
        <a href="signup.html">
          Sign up
        </a>
      </p>

      <a
        class="home-link"
        href="index.html"
      >
        Back to Vexel
      </a>

      <p class="note">Your username is used as Vexel’s internal sign-in identity.</p>

    </section>

  </main>

  <script>
    (() => {
      "use strict";

      const client = window.vexelSupabase;

      const form =
        document.getElementById("loginForm");

      const usernameInput =
        document.getElementById("username");

      const passwordInput =
        document.getElementById("password");

      const passwordEye =
        document.getElementById("passwordEye");

      const errorEl =
        document.getElementById("error");

      const statusEl =
        document.getElementById("status");

      const button =
        document.getElementById("submitButton");

      function showError(message) {
        errorEl.textContent = message || "";
      }

      passwordEye.addEventListener(
        "click",
        () => {
          const show =
            passwordInput.type === "password";

          passwordInput.type =
            show ? "text" : "password";

          passwordEye.textContent =
            show ? "●" : "◎";

          passwordEye.setAttribute(
            "aria-label",
            show
              ? "Hide password"
              : "Show password"
          );

          passwordEye.setAttribute(
            "aria-pressed",
            String(show)
          );

          passwordInput.focus();
        }
      );

      async function initialize() {
        if (!client) {
          showError(
            "Supabase failed to initialize. Check supabaseClient.js."
          );
          return;
        }

        try {
          const {
            data,
            error
          } = await client.auth.getSession();

          if (error) {
            console.error(
              "Login session error:",
              error
            );

            showError(
              error.message ||
              "Could not initialize authentication."
            );

            return;
          }

          /*
            IMPORTANT:
            Do NOT automatically redirect.
            This allows the Login page to actually open
            even when an existing session exists.
          */
          if (data?.session) {
            const user =
              data.session.user;

            const username =
              user?.user_metadata?.username ||
              user?.email?.split("@")[0] ||
              "User";

            statusEl.textContent =
              `Currently signed in as ${username}. Signing in here will switch the active account.`;
          }

          usernameInput.focus();

        } catch (error) {
          console.error(
            "Login initialization crashed:",
            error
          );

          showError(
            error.message ||
            "Could not initialize the login page."
          );
        }
      }

      form.addEventListener(
        "submit",
        async (event) => {
          event.preventDefault();

          showError("");
          statusEl.textContent = "";

          const username =
            usernameInput.value.trim();

          const password =
            passwordInput.value;

          if (
            !/^[A-Za-z0-9_]{3,20}$/.test(
              username
            )
          ) {
            showError(
              "Please enter a valid username."
            );
            usernameInput.focus();
            return;
          }

          if (!password) {
            showError(
              "Please enter your password."
            );
            passwordInput.focus();
            return;
          }

          if (!client) {
            showError(
              "Supabase failed to initialize."
            );
            return;
          }

          button.disabled = true;
          button.textContent = "Logging in…";

          try {
            const email =
              `${username.toLowerCase()}@vexel.ai`;

            const {
              data,
              error
            } = await client.auth.signInWithPassword({
              email,
              password
            });

            if (error) {
              console.error(
                "Supabase login error:",
                error
              );

              const message =
                String(error.message || "")
                  .toLowerCase();

              if (
                message.includes(
                  "invalid login credentials"
                ) ||
                message.includes(
                  "invalid credentials"
                )
              ) {
                showError(
                  "Username or password is incorrect."
                );
              } else {
                showError(
                  error.message ||
                  "Login failed."
                );
              }

              return;
            }

            if (!data?.session) {
              showError(
                "Login succeeded, but no session was returned."
              );
              return;
            }

            window.location.assign(
              "/"
            );

          } catch (error) {
            console.error(
              "Login crashed:",
              error
            );

            showError(
              error.message ||
              "Something went wrong while logging in."
            );
          } finally {
            button.disabled = false;
            button.textContent = "Log in";
          }
        }
      );

      initialize();

    })();
  </script>
</body>
</html>
