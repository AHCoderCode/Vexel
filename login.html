<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI – Log In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0c18;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      background: rgba(18, 20, 42, 0.7);
      border: 1px solid rgba(120, 90, 255, 0.4);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      color: #f0eefc;
    }
    h2 { text-align: center; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      background: #232734;
      border: 1px solid #2e3347;
      border-radius: 10px;
      color: white;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #8a6dff;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    a { color: #b590ff; text-decoration: none; }
    .error { color: #ff6b6b; text-align: center; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Log In to Vexel</h2>
    <div class="error" id="error"></div>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Log In</button>
    <p style="text-align:center; margin-top:1rem;">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      if (!username || !password) {
        errorEl.textContent = 'Please enter both username and password.';
        return;
      }

      const email = username.toLowerCase() + '@vexel.ai';
      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = 'Username or password is incorrect.';
        return;
      }

      window.location.href = '/';
    }
  </script>
</body>
</html>
