<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI — Log in</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5962202637347912" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#212121;--surface:#2a2a2a;--surface2:#303030;--border:rgba(255,255,255,.11);--text:#f7f7f8;--muted:#9b9ba3;--accent:#8b7cf6;--danger:#ef6a6a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,420px)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;font-weight:750;font-size:20px;letter-spacing:-.02em}.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#5f50c8);color:#fff;font-size:14px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.2)}h1{font-size:25px;letter-spacing:-.03em;text-align:center;margin:0 0 8px} .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
    form{display:grid;gap:14px}label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}.field input{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);padding:0 12px;outline:none}.field input:focus{border-color:var(--accent)}
    .password-field{position:relative}.password-field input{padding-right:42px}.eye{position:absolute;right:5px;top:5px;width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}.eye:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .error{min-height:18px;color:var(--danger);font-size:13px;line-height:1.4}.submit{height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:650}.submit:hover{background:#9c8df9}.submit:disabled{opacity:.55;cursor:not-allowed}
    .switch{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 0}.switch a{color:#b8afff;text-decoration:none}.switch a:hover{text-decoration:underline}.note{text-align:center;color:#777780;font-size:11px;margin-top:14px;line-height:1.5}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">V</span> Vexel</div>
    <section class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to continue to your Vexel account.</p>
      <div class="error" id="error" aria-live="polite"></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" maxlength="20" placeholder="Your username" required /></div>
        <div class="field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required /><button type="button" class="eye" id="passwordEye" aria-label="Show password" aria-pressed="false">◎</button></div></div>
        <button class="submit" id="submitButton" type="submit">Log in</button>
      </form>
      <p class="switch">Don't have an account? <a href="/signup.html">Sign up</a></p>
      <p class="note">Your username is used as the internal Vexel sign-in identity.</p>
    </section>
  </main>
  <script>
    const client=window.vexelSupabase;
    const form=document.getElementById('loginForm');const usernameInput=document.getElementById('username');const passwordInput=document.getElementById('password');const passwordEye=document.getElementById('passwordEye');const errorEl=document.getElementById('error');const button=document.getElementById('submitButton');
    passwordEye.addEventListener('click',()=>{const show=passwordInput.type==='password';passwordInput.type=show?'text':'password';passwordEye.textContent=show?'●':'◎';passwordEye.setAttribute('aria-label',show?'Hide password':'Show password');passwordEye.setAttribute('aria-pressed',String(show));passwordInput.focus();});
    (async()=>{if(!client){errorEl.textContent='Supabase failed to initialize. Refresh the page and try again.';return;}const {data}=await client.auth.getSession();if(data.session)window.location.href='/';usernameInput.focus();})();
    form.addEventListener('submit',async(event)=>{event.preventDefault();errorEl.textContent='';const username=usernameInput.value.trim();const password=passwordInput.value;if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){errorEl.textContent='Please enter a valid username.';return;}if(!password){errorEl.textContent='Please enter your password.';return;}if(!client){errorEl.textContent='Supabase failed to initialize. Refresh the page and try again.';return;}button.disabled=true;button.textContent='Logging in…';try{const email=`${username.toLowerCase()}@vexel.ai`;const {data,error}=await client.auth.signInWithPassword({email,password});if(error||!data.session){console.error('Login error:',error);errorEl.textContent='Username or password is incorrect.';return;}window.location.replace('/');}catch(error){console.error('Login crashed:',error);errorEl.textContent='Something went wrong. Please try again.';}finally{button.disabled=false;button.textContent='Log in';}});
  </script>
</body>
</html>
