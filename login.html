<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI – Log In</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5962202637347912"
     crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0c18;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      background: rgba(18, 20, 42, 0.7);
      border: 1px solid rgba(120, 90, 255, 0.4);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      color: #f0eefc;
    }
    h2 { text-align: center; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      background: #232734;
      border: 1px solid #2e3347;
      border-radius: 10px;
      color: white;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #8a6dff;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    a { color: #b590ff; text-decoration: none; }
    .error { color: #ff6b6b; text-align: center; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Log In to Vexel</h2>
    <div class="error" id="error"></div>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Log In</button>
    <p style="text-align:center; margin-top:1rem;">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {

    const button = document.getElementById('signupButton');
    const errorEl = document.getElementById('error');

    button.addEventListener('click', signup);

    async function signup() {

      errorEl.textContent = '';

      const username = document.getElementById('username').value.trim();
      const age = document.getElementById('age').value.trim();
      const password = document.getElementById('password').value;

      // Check that Supabase actually loaded
      if (!window.supabase) {
        errorEl.textContent =
          'Supabase library failed to load. Refresh the page and try again.';
        console.error('window.supabase is missing');
        return;
      }

      // Check that your Supabase client loaded
      if (typeof supabase === 'undefined') {
        errorEl.textContent =
          'Supabase client failed to load. Check supabaseClient.js.';
        console.error('supabase client is missing');
        return;
      }

      // Username
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        errorEl.textContent =
          'Username must be 3-20 characters and use only letters, numbers, or _.';
        return;
      }

      // Age
      const ageNum = Number(age);

      if (
        !age ||
        !Number.isInteger(ageNum) ||
        ageNum < 5 ||
        ageNum > 120
      ) {
        errorEl.textContent =
          'Age must be a whole number between 5 and 120.';
        return;
      }

      // Password
      if (password.length < 6) {
        errorEl.textContent =
          'Password must be at least 6 characters.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Creating Account...';

      try {

        const email = username.toLowerCase() + '@vexel.ai';

        console.log('Attempting signup:', email);

        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              username: username,
              age: ageNum
            }
          }
        });

        console.log('Supabase response:', data, error);

        if (error) {
          console.error('Supabase signup error:', error);
          errorEl.textContent = error.message;
          return;
        }

        // If Confirm Email is OFF, a session should normally exist.
        if (!data.session) {
          errorEl.textContent =
            'Account created, but no login session was created. Make sure Confirm Email is OFF in Supabase.';
          return;
        }

        console.log('Signup successful.');

        window.location.href = '/';

      } catch (err) {

        console.error('Signup crashed:', err);

        errorEl.textContent =
          err.message || 'Something went wrong while creating the account.';

      } finally {

        button.disabled = false;
        button.textContent = 'Create Account';

      }
    }
  });
</script>
</body>
</html>
