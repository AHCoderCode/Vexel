<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI – Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0c18;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      background: rgba(18, 20, 42, 0.7);
      border: 1px solid rgba(120, 90, 255, 0.4);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      color: #f0eefc;
    }
    h2 { text-align: center; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      background: #232734;
      border: 1px solid #2e3347;
      border-radius: 10px;
      color: white;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #8a6dff;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    a { color: #b590ff; text-decoration: none; }
    .error { color: #ff6b6b; text-align: center; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Vexel Account</h2>
    <div class="error" id="error"></div>
    <input type="text" id="username" placeholder="Username (e.g. Alex123)" />
    <input type="number" id="age" placeholder="Age" min="5" max="120" />
    <input type="password" id="password" placeholder="Password (min 6 characters)" />
    <button onclick="signup()">Create Account</button>
    <p style="text-align:center; margin-top:1rem;">Already have an account? <a href="/login.html">Log in</a></p>
  </div>

  <script>
    async function signup() {
      const username = document.getElementById('username').value.trim();
      const age = document.getElementById('age').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      if (!username || username.length < 3 || username.length > 20) {
        errorEl.textContent = 'Username must be 3-20 characters.';
        return;
      }
      const ageNum = Number(age);
      if (!age || isNaN(ageNum) || ageNum < 5 || ageNum > 120) {
        errorEl.textContent = 'Age must be between 5 and 120.';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        return;
      }

      const email = username.toLowerCase() + '@vexel.ai';
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { username, age: ageNum }
        }
      });

      if (error) {
        if (error.message.includes('duplicate') || error.message.includes('already')) {
          errorEl.textContent = 'Username is already taken.';
        } else {
          errorEl.textContent = error.message;
        }
        return;
      }

      // Success – redirect to main app
      window.location.href = '/';
    }
  </script>
</body>
</html>
