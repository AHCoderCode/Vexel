<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Vexel AI — Sign up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color-scheme: dark;

      --bg: #212121;
      --surface: #2a2a2a;
      --surface2: #303030;
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f7f7f8;
      --muted: #9b9ba3;
      --accent: #8b7cf6;
      --accent-hover: #9c8df9;
      --danger: #ef6a6a;
      --success: #72d6a1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    button,
    input {
      font: inherit;
      touch-action: manipulation;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(100%, 420px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      font-weight: 750;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: linear-gradient(
        145deg,
        var(--accent),
        #5f50c8
      );
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 25px;
      letter-spacing: -0.03em;
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .field input::placeholder {
      color: #777780;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 2px rgba(139, 124, 246, 0.12);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 44px;
    }

    .eye {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .eye:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .eye:active {
      transform: scale(0.96);
    }

    .hint {
      color: #777780;
      font-size: 11px;
      margin-top: 5px;
      line-height: 1.4;
    }

    .error {
      min-height: 18px;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 2px;
      word-break: break-word;
    }

    .error:empty {
      margin-bottom: 0;
    }

    .status {
      min-height: 18px;
      color: var(--success);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .submit {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      cursor: pointer;
      transition:
        background 0.15s ease,
        opacity 0.15s ease,
        transform 0.05s ease;
    }

    .submit:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 20px 0 0;
    }

    .switch a {
      color: #b8afff;
      text-decoration: none;
    }

    .switch a:hover {
      text-decoration: underline;
    }

    .home-link {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--text);
    }

    .note {
      text-align: center;
      color: #777780;
      font-size: 11px;
      margin-top: 14px;
      line-height: 1.5;
    }

    @media (max-width: 460px) {
      body {
        padding: 16px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 22px;
      }
    }
  </style>

</head>

<body>

  <main class="shell">

```
<div class="brand">
  <span class="mark">V</span>
  <span>Vexel</span>
</div>

<section class="card">

  <h1>Create your account</h1>

  <p class="subtitle">
    Start with a username-based Vexel account.
  </p>

  <div
    class="status"
    id="status"
    aria-live="polite"
  ></div>

  <div
    class="error"
    id="error"
    aria-live="assertive"
  ></div>

  <form
    id="signupForm"
    novalidate
  >

    <!-- Username -->
    <div class="field">

      <label for="username">

      <input
        id="username"

        type="text"
        autocomplete="username"
        maxlength="20"
        placeholder="e.g. Alex123"
        spellcheck="false"

        required
      />

      <div class="hint">
        3–20 characters: letters, numbers, or underscore.
      </div>

    </div>

    <!-- Age + Password -->
    <div class="row">

      <div class="field">

        <label for="age">
          Age
        </label>

        <input
          id="age"
          name="age"
          type="number"
          inputmode="numeric"
          min="5"
          max="120"
          autocomplete="off"

        />

      </div>

      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="password-field">

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"

          />

          <button

            class="eye"

          </button>

        </div>

      </div>

    </div>

    <!-- Confirm password -->
    <div class="field">

      <label for="confirmPassword">
        Retype password
      </label>

      <div class="password-field">

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Retype your password"
          required
        />

        <button
          type="button"
          class="eye"
          id="confirmEye"
          aria-label="Show password"
          aria-pressed="false"
        >
          ◎
        </button>

      </div>

    </div>

    <button
      class="submit"

  </form>

  <p class="switch">

    <a

  <a

</section>
```

  </main>

  <script>
    (() => {
      "use strict";

      /*
        ==========================================================
        DOM
        ==========================================================
      */

      const client = window.vexelSupabase;

      const form =
        document.getElementById("signupForm");

      const usernameInput =
        document.getElementById("username");

      const ageInput =
        document.getElementById("age");

      const passwordInput =
        document.getElementById("password");

      const confirmInput =
        document.getElementById("confirmPassword");

      const passwordEye =
        document.getElementById("passwordEye");

      const confirmEye =
        document.getElementById("confirmEye");

      const errorEl =
        document.getElementById("error");

      const statusEl =
        document.getElementById("status");

      const button =
        document.getElementById("submitButton");

      /*
        ==========================================================
        HELPERS
        ==========================================================
      */

      function showError(message) {
        statusEl.textContent = "";
        errorEl.textContent = String(message || "");
      }

      function showStatus(message) {
        errorEl.textContent = "";
        statusEl.textContent = String(message || "");
      }

      function clearMessages() {
        errorEl.textContent = "";
        statusEl.textContent = "";
      }

      function navigate(path) {
        window.location.assign(path);
      }

      /*
        ==========================================================
        PASSWORD VISIBILITY
        ==========================================================
      */

      function setupPasswordEye(buttonElement, inputElement) {
        if (!buttonElement || !inputElement) {
          return;
        }

        buttonElement.addEventListener("click", () => {
          const shouldShow =
            inputElement.type === "password";

          inputElement.type =
            shouldShow ? "text" : "password";

          buttonElement.textContent =
            shouldShow ? "●" : "◎";

          buttonElement.setAttribute(
            "aria-label",
            shouldShow
              ? "Hide password"
              : "Show password"
          );

          buttonElement.setAttribute(
            "aria-pressed",
            String(shouldShow)
          );

          inputElement.focus();
        });
      }

      setupPasswordEye(
        passwordEye,
        passwordInput
      );

      setupPasswordEye(
        confirmEye,
        confirmInput
      );

      /*
        ==========================================================
        NAVIGATION
        ==========================================================
        Explicit click handlers make the auth links work
        reliably even if another global listener exists.
      */

      document
        .getElementById("loginLink")
        ?.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();

          navigate("login.html");
        });

      document
        .getElementById("homeLink")
        ?.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();

          navigate("index.html");
        });

      /*
        ==========================================================
        SUPABASE INITIALIZATION
        ==========================================================
      */

      async function initializePage() {
        if (!client) {
          showError(
            "Supabase failed to initialize. Make sure supabaseClient.js is loading correctly."
          );

          return;
        }

        try {
          const {
            data,
            error
          } = await client.auth.getSession();

          if (error) {
            console.error(
              "Vexel signup session error:",
              error
            );

            showError(
              error.message ||
              "Could not initialize authentication."
            );

            return;
          }

          /*
            Do NOT redirect to / automatically.
            The signup page must remain visible.
          */

          if (data?.session) {
            const user =
              data.session.user;

            const currentUsername =
              user?.user_metadata?.username ||
              user?.email?.split("@")[0] ||
              "User";

            showError(
              `You are already signed in as ${currentUsername}. Log out first before creating another account.`
            );

            usernameInput.focus();

            return;
          }

          usernameInput.focus();

        } catch (error) {
          console.error(
            "Vexel signup initialization crashed:",
            error
          );

          showError(
            error?.message ||
            "Could not initialize the signup page."
          );
        }
      }

      /*
        ==========================================================
        VALIDATION
        ==========================================================
      */

      function validateForm() {
        const username =
          usernameInput.value.trim();

        const age =
          Number(ageInput.value);

        const password =
          passwordInput.value;

        const confirm =
          confirmInput.value;

        if (
          !/^[A-Za-z0-9_]{3,20}$/.test(
            username
          )
        ) {
          showError(
            "Username must be 3–20 characters and use only letters, numbers, or _."
          );

          usernameInput.focus();

          return null;
        }

        if (
          !Number.isInteger(age) ||
          age < 5 ||
          age > 120
        ) {
          showError(
            "Age must be a whole number between 5 and 120."
          );

          ageInput.focus();

          return null;
        }

        if (password.length < 6) {
          showError(
            "Password must be at least 6 characters."
          );

          passwordInput.focus();

          return null;
        }

        if (password !== confirm) {
          showError(
            "Passwords do not match."
          );

          confirmInput.focus();

          return null;
        }

        return {
          username,
          age,
          password
        };
      }

      /*
        ==========================================================
        SIGNUP
        ==========================================================
      */

      form.addEventListener(
        "submit",
        async (event) => {
          event.preventDefault();

          clearMessages();

          const values =
            validateForm();

          if (!values) {
            return;
          }

          if (!client) {
            showError(
              "Supabase failed to initialize."
            );

            return;
          }

          const {
            username,
            age,
            password
          } = values;

          button.disabled = true;
          button.textContent =
            "Creating account…";

          try {
            /*
              Supabase password authentication
              requires an email/phone identity.
              Vexel uses the username-based internal
              identity consistently with login.html.
            */

            const email =
              `${username.toLowerCase()}@vexel.ai`;

            console.log(
              "Starting Vexel signup..."
            );

            console.log(
              "Username:",
              username
            );

            console.log(
              "Internal auth identity:",
              email
            );

            const {
              data,
              error
            } = await client.auth.signUp({
              email,
              password,
              options: {
                data: {
                  username,
                  age
                }
              }
            });

            /*
              =====================================================
              REAL SUPABASE ERROR
              =====================================================
            */

            if (error) {
              console.error(
                "========== VEXEL SIGNUP ERROR =========="
              );

              console.error(
                "Full error:",
                error
              );

              console.error(
                "Message:",
                error.message
              );

              console.error(
                "Code:",
                error.code
              );

              console.error(
                "Status:",
                error.status
              );

              console.error(
                "Name:",
                error.name
              );

              console.error(
                "========================================="
              );

              const message =
                String(
                  error.message || ""
                ).toLowerCase();

              if (
                message.includes(
                  "already registered"
                ) ||
                message.includes(
                  "already exists"
                ) ||
                message.includes(
                  "duplicate"
                ) ||
                message.includes(
                  "unique"
                )
              ) {
                showError(
                  "That username is already taken."
                );
              } else if (
                message.includes(
                  "invalid api key"
                )
              ) {
                showError(
                  "Supabase rejected the API key. Check supabaseClient.js."
                );
              } else if (
                message.includes(
                  "signups not allowed"
                )
              ) {
                showError(
                  "New account creation is disabled in Supabase. Enable user signups in Authentication settings."
                );
              } else if (
                message.includes(
                  "email provider"
                )
              ) {
                showError(
                  "Supabase Email authentication is not enabled."
                );
              } else if (
                message.includes(
                  "password"
                ) &&
                message.includes(
                  "weak"
                )
              ) {
                showError(
                  "That password is too weak. Please choose a stronger password."
                );
              } else {
                /*
                  Show the real message so future
                  Supabase problems can be diagnosed.
                */
                showError(
                  error.message ||
                  error.code ||
                  "Supabase rejected the signup request."
                );
              }

              return;
            }

            console.log(
              "Vexel signup response:",
              data
            );

            /*
              =====================================================
              NO SESSION
              =====================================================
            */

            if (!data?.session) {
              showError(
                "Account was created, but Supabase did not return a session. Disable email confirmation in Supabase Authentication settings for this username-based flow."
              );

              return;
            }

            /*
              =====================================================
              SUCCESS
              =====================================================
            */

            showStatus(
              "Account created successfully. Opening Vexel…"
            );

            /*
              Give the session storage a moment to
              settle before navigating.
            */

            setTimeout(() => {
              navigate("index.html");
            }, 250);

          } catch (error) {
            console.error(
              "Vexel signup crashed:",
              error
            );

            showError(
              error?.message ||
              "Something went wrong while creating your account."
            );

          } finally {
            button.disabled = false;
            button.textContent =
              "Create account";
          }
        }
      );

      /*
        ==========================================================
        ENTER / INPUT BEHAVIOR
        ==========================================================
      */

      [usernameInput, ageInput, passwordInput, confirmInput]
        .forEach((input) => {
          input.addEventListener(
            "input",
            () => {
              if (
                errorEl.textContent ||
                statusEl.textContent
              ) {
                clearMessages();
              }
            }
          );
        });

      /*
        ==========================================================
        START
        ==========================================================
      */

      initializePage();

    })();
  </script>

</body>
</html>
