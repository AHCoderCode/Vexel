<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexel AI – Sign Up</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5962202637347912"
     crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0c18;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      background: rgba(18, 20, 42, 0.7);
      border: 1px solid rgba(120, 90, 255, 0.4);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      color: #f0eefc;
    }
    h2 { text-align: center; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      background: #232734;
      border: 1px solid #2e3347;
      border-radius: 10px;
      color: white;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #8a6dff;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    a { color: #b590ff; text-decoration: none; }
    .error { color: #ff6b6b; text-align: center; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Vexel Account</h2>
    <div class="error" id="error"></div>
    <input type="text" id="username" placeholder="Username (e.g. Alex123)" />
    <input type="number" id="age" placeholder="Age" min="5" max="120" />
    <input type="password" id="password" placeholder="Password (min 6 characters)" />
    <button onclick="signup()">Create Account</button>
    <p style="text-align:center; margin-top:1rem;">Already have an account? <a href="/login.html">Log in</a></p>
  </div>

  <script>
    async function signup() {
      const usernameInput = document.getElementById('username');
    const ageInput = document.getElementById('age');
    const passwordInput = document.getElementById('password');
    const errorEl = document.getElementById('error');
    const button = document.querySelector('button');

    const username = usernameInput.value.trim();
    const age = ageInput.value.trim();
    const password = passwordInput.value;

    errorEl.textContent = '';

    // Username must be 3-20 characters
    // Only letters, numbers and underscore are allowed.
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
      errorEl.textContent =
        'Username must be 3-20 characters and use only letters, numbers, or _.';
      return;
    }

    // Check age
    const ageNum = Number(age);

    if (!age || !Number.isInteger(ageNum) || ageNum < 5 || ageNum > 120) {
      errorEl.textContent =
        'Age must be a whole number between 5 and 120.';
      return;
    }

    // Check password
    if (password.length < 6) {
      errorEl.textContent =
        'Password must be at least 6 characters.';
      return;
    }

    button.disabled = true;
    button.textContent = 'Creating Account...';

    try {
      // Convert the Vexel username into an internal email.
      const email = `${username.toLowerCase()}@vexel.ai`;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            username,
            age: ageNum
          }
        }
      });

      if (error) {
        console.error('Signup error:', error);

        const message = error.message.toLowerCase();

        if (
          message.includes('already registered') ||
          message.includes('already exists') ||
          message.includes('duplicate')
        ) {
          errorEl.textContent = 'Username is already taken.';
        } else {
          errorEl.textContent = error.message;
        }

        return;
      }

      // With Confirm Email disabled, Supabase should return a session.
      if (!data.session) {
        errorEl.textContent =
          'Account was created, but Supabase did not create a session. Check that Confirm Email is OFF.';
        return;
      }

      // Successful signup
      window.location.href = '/';

    } catch (err) {
      console.error('Unexpected signup error:', err);
      errorEl.textContent =
        'Something went wrong. Please try again.';
    } finally {
      button.disabled = false;
      button.textContent = 'Create Account';
    }
      }

      // Success – redirect to main app
      window.location.href = '/';
    }
  </script>
</body>
</html>
